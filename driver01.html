        </div>

        <button onclick="closeIssueModal()"
                style="border:none;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.13);color:#fff;font-size:20px;cursor:pointer;">
          ×
        </button>
      </div>

      <div style="padding:22px;">

        <label style="display:block;color:#1a4d2a;font-size:13px;font-weight:850;margin-bottom:7px;">
          What is the issue?
        </label>

        <select id="issueReason"
                style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:14px;padding:13px 14px;background:#fff;color:#1e2e24;font:inherit;font-size:14px;font-weight:650;outline:none;margin-bottom:16px;">
          <option value="">Select issue</option>
          <option>Traffic / Delivery Delay</option>
          <option>Vehicle Breakdown</option>
          <option>Customer Not Available</option>
          <option>Wrong / Incomplete Address</option>
          <option>Plant / Material Damage</option>
          <option>Pickup Not Ready</option>
          <option>Unable to Contact Customer</option>
          <option>Other</option>
        </select>

        <label style="display:block;color:#1a4d2a;font-size:13px;font-weight:850;margin-bottom:7px;">
          Short Note
        </label>

        <textarea id="issueNote"
                  placeholder="Tell the supervisor what happened..."
                  style="width:100%;min-height:100px;resize:vertical;box-sizing:border-box;border:1px solid #dbe8db;border-radius:14px;padding:13px 14px;background:#fff;color:#1e2e24;font:inherit;font-size:14px;font-weight:600;outline:none;"></textarea>

        <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">

          <button onclick="closeIssueModal()"
                  style="flex:1;min-width:130px;border:1px solid #dbe8db;background:#fff;color:#1a4d2a;border-radius:999px;padding:13px 18px;font-weight:850;cursor:pointer;">
            Cancel
          </button>

          <button onclick="submitIssue()"
                  style="flex:1;min-width:180px;border:none;background:#b42331;color:#fff;border-radius:999px;padding:13px 18px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(180,35,49,.2);">
            Submit Issue
          </button>

        </div>
      </div>
    </div>

    const statusSequence = [
      "Assigned",
      "Going to Pickup",
      "At Pickup",
      "Picked Up",
      "In Transit",
      "Delivered"
    ];


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function myTasks() {
      return state.tasks.filter(task => task.driverId === currentDriver.id);
    }


    function filteredTasks() {

      let tasks = myTasks();

      if (state.filter === "active") {
        tasks = tasks.filter(task =>
          task.status !== "Delivered"
        );
      }

      if (state.filter === "completed") {
        tasks = tasks.filter(task =>
          task.status === "Delivered"
        );
      }

      if (state.filter === "issue") {
        tasks = tasks.filter(task =>
          task.status === "Issue"
        );
      }

      return tasks;
    }


    function statusMeta(status) {

      const map = {

        "Assigned": {
          bg: "#fff4d8",
          color: "#8b6500",
          icon: "📌",
          label: "Assigned"
        },

        "Going to Pickup": {
          bg: "#e6f3ff",
          color: "#1363a5",
          icon: "🚚",
          label: "Going to Pickup"
        },

        "At Pickup": {
          bg: "#efe5ff",
          color: "#6733a6",
          icon: "📍",
          label: "At Pickup"
        },

        "Picked Up": {
          bg: "#e8f5ea",
          color: "#17643a",
          icon: "📦",
          label: "Picked Up"
        },

        "In Transit": {
          bg: "#e6f3ff",
          color: "#135d84",
          icon: "🚚",
          label: "In Transit"
        },

        "Delivered": {
          bg: "#dcf7ea",
          color: "#0f7a45",
          icon: "✅",
          label: "Delivered"
        },

        "Issue": {
          bg: "#ffe3e6",
          color: "#b42331",
          icon: "⚠",
          label: "Issue Reported"
        }

      };

      return map[status] || map["Assigned"];
    }


    function priorityStyle(priority) {

      if (priority === "High") {
        return {
          bg: "#fff0ef",
          color: "#b42331",
          icon: "●"
        };
      }

      return {
        bg: "#eef6ef",
        color: "#1a4d2a",
        icon: "●"
      };
    }


    function nextAction(status) {

      if (status === "Assigned") {
        return {
          label: "Start Trip",
          icon: "🚚",
          next: "Going to Pickup"
        };
      }

      if (status === "Going to Pickup") {
        return {
          label: "I Reached Pickup",
          icon: "📍",
          next: "At Pickup"
        };
      }

      if (status === "At Pickup") {
        return {
          label: "Confirm Pickup",
          icon: "📦",
          next: "Picked Up"
        };
      }

      if (status === "Picked Up") {
        return {
          label: "Start Delivery",
          icon: "🚚",
          next: "In Transit"
        };
      }

      if (status === "In Transit") {
        return {
          label: "Mark Delivered",
          icon: "✅",
          next: "Delivered"
        };
      }

      if (status === "Issue") {
        return {
          label: "Resume Delivery",
          icon: "↻",
          next: null
        };
      }

      return null;
    }


    function progressPercent(task) {

      if (task.status === "Delivered") {
        return 100;
      }

      if (task.status === "Issue") {
        const status = task.previousStatus || "Assigned";
        const index = statusSequence.indexOf(status);
        return Math.max(8, (index / (statusSequence.length - 1)) * 100);
      }

      const index = statusSequence.indexOf(task.status);

      if (index < 0) {
        return 0;
      }

      return (index / (statusSequence.length - 1)) * 100;
    }


    function currentTime() {

      return new Date().toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }


    function showToast(message, error = false) {

      const toast = document.getElementById("toast");

      toast.textContent = (error ? "⚠ " : "✓ ") + message;

      toast.style.background = error ? "#b42331" : "#1a4d2a";

      toast.style.opacity = "1";
      toast.style.transform = "translateY(0)";

      clearTimeout(toast.timer);

      toast.timer = setTimeout(() => {

        toast.style.opacity = "0";
        toast.style.transform = "translateY(70px)";

      }, 2600);
    }

      return `

            height:42px;
            border-radius:13px;
            background:#eef6ef;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            position:absolute;
            right:14px;
            top:14px;
          ">
            ${icon}
          </div>

          <div style="
            color:#637568;
            font-size:11px;
            font-weight:800;
            padding-right:50px;
          ">
            ${label}
          </div>

          <div style="
            color:#1a4d2a;
            font-size:27px;
            font-weight:950;
            margin-top:17px;
          ">
            ${value}
          </div>

          <div style="
            color:#829085;
            font-size:10px;
            font-weight:700;
            margin-top:3px;
          ">
            ${note}
          </div>

        </div>
      `;
    }


    function renderSummary() {

      const tasks = myTasks();

      const active = tasks.filter(task =>
        task.status !== "Delivered"
      ).length;

      const transit = tasks.filter(task =>
        [
          "Going to Pickup",
          "At Pickup",
          "Picked Up",
          "In Transit"
        ].includes(task.status)
      ).length;

      const completed = tasks.filter(task =>
        task.status === "Delivered"
      ).length;

      const issues = tasks.filter(task =>
        task.status === "Issue"
      ).length;

      return `
        <div style="
          display:grid;
          grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
          gap:12px;
          margin-bottom:22px;
        ">

          ${metricCard(
            "📋",
            "My Active Jobs",
            active,
            "Assigned to you"
          )}

          ${metricCard(
            "🚚",
            "On Route",
            transit,
            "Pickup / delivery"
          )}

          ${metricCard(
            "✅",
            "Completed",
            completed,
            "Delivery finished"
          )}

          ${metricCard(
            "⚠",
            "Issues",
            issues,
            "Needs attention",
            issues ? "#fff7f6" : "#fff"
          )}

        </div>
      `;
    }


    function filterButton(id, label, count) {

      const active = state.filter === id;

      return `

          style="

            color:${active ? "#fff" : "#4f6555"};
            border-radius:999px;
            padding:9px 14px;
            font-size:11px;
            font-weight:850;
            cursor:pointer;
            white-space:nowrap;
          "
        >
          ${label}${count !== undefined ? ` · ${count}` : ""}
        </button>
      `;
    }


    function renderTaskCard(task) {

      const status = statusMeta(task.status);
      const priority = priorityStyle(task.priority);
      const action = nextAction(task.status);
      const progress = progressPercent(task);

      return `

        ">

          <!-- CARD HEADER -->
          <div style="

            <div style="

                  margin-bottom:8px;
                ">

                  <span style="
                    background:#eef6ef;

                    padding:5px 9px;
                    font-size:10px;
                    font-weight:900;

                    ${task.sourceIcon} ${escapeHtml(task.sourceType)}
                  </span>

                  <span style="
                    background:${priority.bg};

    function advanceTask(taskId) {

      const task = state.tasks.find(item =>
        item.id === taskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;
      }


      if (task.status === "Issue") {

        task.status = task.previousStatus || "Assigned";
        task.previousStatus = null;
        task.issue = null;

        task.history.push({
          status: "Issue Resolved / Delivery Resumed",
          time: currentTime()
        });

        render();

        showToast(
          task.id + " delivery resumed."
        );

        return;
      }


      const currentIndex = statusSequence.indexOf(task.status);

      if (currentIndex === -1 ||
          currentIndex >= statusSequence.length - 1) {
        return;
      }


      task.status = statusSequence[currentIndex + 1];

      task.history.push({
        status: task.status,
        time: currentTime()
      });


      render();


      if (task.status === "Delivered") {

        showToast(
          task.reference + " marked as delivered."
        );

      } else {

        showToast(
          "Status updated to " + task.status + "."
        );
      }
    }


    function openIssueModal(taskId) {

      const task = state.tasks.find(item =>
        item.id === taskId &&
        item.driverId === currentDriver.id

        return;

      state.issueTaskId = taskId;

      document.getElementById("issueTaskNumber").textContent =
        task.id + " · " + task.reference;

      document.getElementById("issueReason").value = "";
      document.getElementById("issueNote").value = "";

      document.getElementById("issueModal").style.display = "flex";
    }


    function closeIssueModal() {

      state.issueTaskId = null;

      document.getElementById("issueModal").style.display = "none";
    }


    function submitIssue() {

      const reason =
        document.getElementById("issueReason").value;

      const note =
        document.getElementById("issueNote").value.trim();


      if (!reason) {

        showToast(
          "Please select the issue.",
          true
        );

        return;

      const task = state.tasks.find(item =>
        item.id === state.issueTaskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;

      if (task.status !== "Issue") {
        task.previousStatus = task.status;

      task.status = "Issue";

      task.issue = {
        reason: reason,
        note: note,
        reportedAt: currentTime()

        time: currentTime()
      });


      closeIssueModal();

              color:#1a4d2a;
              font-size:11px;
              font-weight:950;
            ">
              📦 Delivery Items
            </div>

            ${task.items.map(item => `
              <div style="
                padding:11px 14px;
                border-top:1px solid #e6eee6;
                display:flex;
                justify-content:space-between;
                gap:10px;
              ">

                <div>

                  <div style="
                    font-size:12px;
                    font-weight:900;
                  ">
                    ${escapeHtml(item.name)}
                  </div>

                  <div style="
                    color:#78867b;
                    font-size:10px;
                    font-weight:700;
                    margin-top:3px;
                  ">
                    ${escapeHtml(item.detail)}
                  </div>

                </div>

                <strong style="
                  color:#1a4d2a;
                  font-size:11px;
                  white-space:nowrap;
                ">
                  ${escapeHtml(item.qty)}
                </strong>

              </div>
            `).join("")}

          </div>


          <div style="
            margin-top:16px;
            padding:14px;
            border-radius:16px;
            background:#f8fbf8;
            border:1px solid #e1eee1;
          ">

            <div style="
              color:#1a4d2a;
              font-size:11px;
              font-weight:950;
            ">
              📝 Driver Instructions
            </div>

            <div style="
              color:#65776a;
              font-size:11px;
              font-weight:650;
              line-height:1.6;
              margin-top:6px;
            ">
              ${escapeHtml(task.instructions)}
            </div>

          </div>


          <div style="
            margin-top:16px;
            padding:14px;
            border-radius:16px;
            background:#fff;
            border:1px solid #e1eee1;
          ">

            <div style="
              color:#1a4d2a;
              font-size:11px;
              font-weight:950;
              margin-bottom:9px;
            ">
              👤 Supervisor
            </div>

            <div style="
              font-size:12px;
              font-weight:900;
            ">
              ${escapeHtml(task.supervisor)}
            </div>

            <button
              onclick="callNumber('${escapeHtml(task.supervisorPhone)}')"
              style="
                margin-top:9px;
                border:1px solid #d8e5d9;
                background:#eef6ef;
                color:#1a4d2a;
                border-radius:999px;
                padding:8px 13px;
                font-size:10px;
                font-weight:900;
                cursor:pointer;
              "
            >
              📞 Call Supervisor
            </button>

          </div>


          <div style="
            margin-top:16px;
            border:1px solid #e1ebe2;
            border-radius:17px;
            overflow:hidden;
          ">

            <div style="
              padding:11px 14px;
              background:#edf5ef;
              color:#1a4d2a;
              font-size:11px;
              font-weight:950;
            ">
              Delivery Status History
            </div>

            ${task.history.slice().reverse().map(row => `
              <div style="
                padding:10px 14px;
                border-top:1px solid #e6eee6;
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:12px;
              ">

                <span style="
                  color:#304936;
                  font-size:11px;
                  font-weight:850;
                ">
                  ${escapeHtml(row.status)}
                </span>

                <span style="
                  color:#849087;
                  font-size:9px;
                  font-weight:700;
                  text-align:right;
                ">
                  ${escapeHtml(row.time)}
                </span>

              </div>
            `).join("")}

          </div>


          <div style="
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:9px;
            margin-top:17px;
          ">

            <button
              onclick="openRoute('${task.id}')"
              style="
                border:1px solid #d8e5d9;
                background:#fff;
                color:#1a4d2a;
                border-radius:999px;
                padding:11px 14px;
                font-size:11px;
                font-weight:900;
                cursor:pointer;
              "
            >
              🗺 Open Route
            </button>

            <button
              onclick="callNumber('${escapeHtml(task.deliveryPhone)}')"
              style="
                border:none;
                background:#1a4d2a;
                color:#fff;
                border-radius:999px;
                padding:11px 14px;
                font-size:11px;
                font-weight:900;
                cursor:pointer;
              "
            >
              📞 Call Delivery Contact
            </button>

          </div>

        </div>
      `;


      document.getElementById("detailModal").style.display = "flex";
    }


    function detailBox(label, value) {

      return `
        <div style="
          border:1px solid #e2ebe3;
          border-radius:14px;
          padding:11px;
          background:#fbfdfb;
        ">

          <div style="
            color:#809085;
            font-size:9px;
            font-weight:900;
            text-transform:uppercase;
          ">
            ${escapeHtml(label)}
          </div>

          <div style="
            color:#294631;
            font-size:11px;
            font-weight:900;
            margin-top:5px;
            word-break:break-word;
          ">
            ${escapeHtml(value)}
          </div>

        </div>
      `;
    }


    function closeDetails() {

      state.detailTaskId = null;

      document.getElementById("detailModal").style.display = "none";
    }


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        closeIssueModal();
        closeDetails();
      }
    });


    render();

  </script>

</body>
</html>
