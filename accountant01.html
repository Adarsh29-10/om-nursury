<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM Nursery · Accounts ERP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a4d2a;--green2:#2d6e3e;--green3:#0f3a1e;--gold:#f5c542;
  --bg:#f4f7f5;--soft:#f8fbf8;--border:#e1ebe2;--text:#1e2e24;--muted:#66786b;
  --blue:#1769aa;--red:#b42331;--orange:#a85d00;--purple:#6b46c1
}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,#153d25 0%,#1a4d2a 54%,#12341f 100%);
  color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto
}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}
.brand-logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px}
.brand h2{font-size:18px;font-weight:900}.brand p{font-size:11px;color:#cfe1d3;margin-top:3px}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#9fc1aa;font-weight:900;padding:8px 10px}
.nav-btn{width:100%;border:none;background:transparent;color:#dfece2;border-radius:14px;padding:12px 13px;margin:4px 0;display:flex;align-items:center;gap:11px;text-align:left;font-weight:800;font-size:13px;transition:.2s}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn.active{background:#fff;color:var(--green);box-shadow:0 10px 20px rgba(0,0,0,.14)}
.nav-icon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.nav-btn.active .nav-icon{background:#e9f5eb}
.side-summary{margin-top:20px;padding:15px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.side-summary strong{display:block;color:var(--gold);font-size:12px;margin-bottom:7px}.side-summary p{font-size:11px;line-height:1.55;color:#cfe1d3}
.main{padding:28px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}
.mobile-menu{display:none;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 12px;font-weight:900;color:var(--green)}
.account-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px 12px;box-shadow:0 8px 18px rgba(0,20,0,.04)}
.avatar{width:35px;height:35px;border-radius:11px;background:#fff2b7;color:#6c5500;display:flex;align-items:center;justify-content:center;font-weight:950}
.account-chip strong{font-size:12px}.account-chip span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.hero{background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;border-radius:28px;padding:28px 30px;box-shadow:0 18px 38px rgba(0,20,0,.14);position:relative;overflow:hidden;margin-bottom:20px}
.hero:after{content:"₹";position:absolute;right:22px;bottom:-30px;font-size:130px;font-weight:900;opacity:.07}
.hero-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#ffe37c;font-weight:900}
.hero h1{font-size:31px;line-height:1.1;margin:8px 0 8px;font-weight:900;letter-spacing:-.03em}
.hero p{font-size:13px;color:#dceade;line-height:1.6;max-width:900px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 10px 24px rgba(0,20,0,.045);position:relative;overflow:hidden}
.metric .label{font-size:11px;color:var(--muted);font-weight:800}.metric .value{font-size:25px;color:var(--green);font-weight:950;margin-top:13px}.metric .sub{font-size:10px;color:#8a978d;margin-top:4px}.metric .mi{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:12px;background:#eef6ef;display:flex;align-items:center;justify-content:center}
.stepper{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:13px 14px;margin-bottom:18px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;font-weight:850;color:#6d7d70}
.step-num{width:26px;height:26px;border-radius:50%;background:#edf2ed;display:flex;align-items:center;justify-content:center;font-size:10px}
.step.done{color:var(--green)}.step.done .step-num{background:#dff5e5;color:#0f7a45}.step.current{color:#725a00}.step.current .step-num{background:#fff2b7;color:#725a00}
.step-line{height:2px;min-width:26px;flex:1;background:#e7ece7}
.panel{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 10px 24px rgba(0,20,0,.045);margin-bottom:18px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-head h3{font-size:18px;color:var(--green);font-weight:900}.panel-head p{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.input,.select{border:1px solid #d8e3d9;background:#fff;border-radius:11px;padding:10px 12px;font-size:11px;font-weight:700;outline:none;min-height:39px}
.input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,77,42,.08)}
.search{min-width:250px}
.btn{border:none;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-green{background:var(--green);color:#fff}.btn-light{background:#eef6ef;color:var(--green);border:1px solid #d6e8d9}.btn-gold{background:#fff4d3;color:#745b00;border:1px solid #efd884}.btn-blue{background:#eef6ff;color:#135887;border:1px solid #d7e9fb}.btn-red{background:#fff0f1;color:var(--red);border:1px solid #f3cdd1}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1180px}
thead th{background:#edf5ef;color:var(--green);font-size:10px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px 13px;border-bottom:1px solid #d6e2d7;white-space:nowrap}
tbody td{font-size:11.5px;padding:13px;border-bottom:1px solid #e7ede7;vertical-align:middle}
tbody tr:hover{background:#fafcfa}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap}
.green{background:#dcf7ea;color:#0f7a45}.yellow{background:#fff3c7;color:#755b00}.blue{background:#eaf4ff;color:#155b88}.red{background:#ffe5e7;color:#a82430}.gray{background:#eef1ef;color:#66736a}.purple{background:#f0eaff;color:#6542a6}
.info-btn{width:26px;height:26px;border-radius:50%;border:1px solid #d5e2d6;background:#fff;color:var(--green);font-weight:950}
.bottom-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:18px}
.chart-card,.activity-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(0,20,0,.045)}
.chart-card h3,.activity-card h3{font-size:16px;color:var(--green);font-weight:900;margin-bottom:15px}
.bar-row{display:grid;grid-template-columns:150px 1fr 75px;gap:10px;align-items:center;margin:14px 0;font-size:11px}
.bar-bg{height:11px;background:#edf2ed;border-radius:999px;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),#4caf6d)}
.todo{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #edf1ed;align-items:flex-start}.todo:last-child{border-bottom:none}
.todo-dot{width:10px;height:10px;border-radius:50%;margin-top:3px;background:var(--gold)}.todo strong{font-size:11px}.todo p{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(10,28,18,.62);z-index:1000;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.modal.open{display:flex}.modal-box{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.modal-head{background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0}
.modal-head h3{font-size:17px}.close{width:32px;height:32px;border:none;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:18px}
.modal-body{padding:20px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:12px;border:1px solid var(--border);border-radius:12px;background:#fbfdfb}.detail label{display:block;font-size:9px;text-transform:uppercase;color:#7a897d;font-weight:900}.detail strong{display:block;font-size:12px;margin-top:5px;color:var(--text);word-break:break-word}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{font-size:11px;color:var(--green);font-weight:850}.form-grid .input,.form-grid .select{width:100%;margin-top:6px}.full{grid-column:1/-1}
.toast{position:fixed;right:22px;bottom:22px;background:var(--green);color:#fff;border-radius:14px;padding:13px 16px;font-size:12px;font-weight:850;box-shadow:0 16px 34px rgba(0,20,0,.2);opacity:0;transform:translateY(20px);transition:.25s;z-index:1200}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.metric-grid{grid-template-columns:repeat(2,1fr)}.bottom-grid{grid-template-columns:1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;top:0;width:270px;z-index:1300;transition:.25s}.sidebar.open{left:0}
  .main{padding:16px}.mobile-menu{display:inline-flex}.hero{padding:22px}.hero h1{font-size:25px}.metric-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){.metric-grid{grid-template-columns:1fr}.detail-grid,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.search{min-width:100%;width:100%}.topbar{align-items:flex-start}.account-chip{padding:7px 9px}.hero h1{font-size:22px}.stepper{padding:10px}.bar-row{grid-template-columns:105px 1fr 55px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-logo">🌿</div><div><h2>OM Nursery</h2><p>Accounts & Finance ERP</p></div></div>
    <div class="nav-label">Accounts Workspace</div>
    <button class="nav-btn active" data-tab="master" onclick="switchTab('master',this)"><span class="nav-icon">⌂</span>Master Dashboard</button>
    <button class="nav-btn" data-tab="b2c" onclick="switchTab('b2c',this)"><span class="nav-icon">🧾</span>B2C</button>
    <button class="nav-btn" data-tab="b2b" onclick="switchTab('b2b',this)"><span class="nav-icon">🤝</span>B2B</button>
    <button class="nav-btn" data-tab="vendorPortal" onclick="switchTab('vendorPortal',this)"><span class="nav-icon">📄</span>Vendor Portal</button>
    <button class="nav-btn" data-tab="vendorPurchase" onclick="switchTab('vendorPurchase',this)"><span class="nav-icon">🏢</span>Vendor Purchase Management</button>
    <div class="side-summary">
      <strong>Accountant Role Focus</strong>
      <p>Billing, receipts, outstanding balances, vendor purchases, quotation records, payment references and purchase history.</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu" onclick="toggleSidebar()">☰ Menu</button>
      <div></div>
      <div class="account-chip"><div class="avatar">AC</div><div><strong>Accounts User</strong><span>Finance & Billing</span></div></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const state={
 current:'master',
 b2cBills:[
  {bill:'B2C-0234',date:'19 Aug 2026',customer:'Aakash Patil',city:'Pune',supervisor:'Ramesh',items:4,subtotal:1196,gst:60,total:1256,payment:'Pending',mode:'Counter',status:'Pending'},
  {bill:'B2C-0233',date:'19 Aug 2026',customer:'Neha Joshi',city:'Pune',supervisor:'Suresh',items:3,subtotal:1680,gst:84,total:1764,payment:'Paid',mode:'UPI',status:'Completed'},
  {bill:'B2C-0232',date:'18 Aug 2026',customer:'Vikram Shah',city:'Mumbai',supervisor:'Dharmesh',items:6,subtotal:2870,gst:144,total:3014,payment:'Paid',mode:'Card',status:'Completed'},
  {bill:'B2C-0231',date:'18 Aug 2026',customer:'Kiran More',city:'Pune',supervisor:'Ramesh',items:2,subtotal:910,gst:46,total:956,payment:'Cancelled',mode:'Counter',status:'Cancelled'}
 ],
 b2b:[
  {order:'ORD-2026-001',quotation:'QTN-2026-001-V2',inquiry:'INQ-2026-001',customer:'GreenScape Landscaping Pvt Ltd',value:146500,received:75000,terms:'50% advance / balance before dispatch',supervisor:'Ramesh',driver:'Akash',status:'In Progress',payment:'Partially Paid'},
  {order:'ORD-2026-002',quotation:'QTN-2026-002-V1',inquiry:'INQ-2026-002',customer:'UrbanLeaf Developers',value:98000,received:98000,terms:'100% before delivery',supervisor:'Suresh',driver:'Prakash',status:'Completed',payment:'Fully Paid'},
  {order:'ORD-2026-003',quotation:'QTN-2026-003-V3',inquiry:'INQ-2026-003',customer:'EverGreen Resorts',value:212000,received:60000,terms:'30% advance / 70% on dispatch',supervisor:'Dharmesh',driver:'Ekansh',status:'Variance',payment:'Partially Paid'}
 ],
 vendorQuotes:[
  {rfq:'RFQ-2026-0812-014',wo:'WO-260812-018',vendor:'GreenRoot Agro Pvt. Ltd.',requirement:'Organic Fertilizer Supply',category:'Chemicals & Fertilizers',farm:'Kamshet Farm',qty:'1,250 kg',required:'18 Aug 2026',accepted:'12 Aug 2026',status:'Quote Pending'},
  {rfq:'RFQ-2026-0812-011',wo:'WO-260811-009',vendor:'Shree Sai Horticulture',requirement:'Mango Hapoos Saplings',category:'Plant Grower',farm:'Karla Farm',qty:'350 plants',required:'25 Aug 2026',accepted:'12 Aug 2026',status:'Accepted'},
  {rfq:'RFQ-2026-0811-009',wo:'WO-260811-006',vendor:'NaturePot Industries',requirement:'10 x 12 Grow Bags',category:'Packaging & Pots',farm:'Talegaon Farm',qty:'5,000 pcs',required:'20 Aug 2026',accepted:'11 Aug 2026',status:'Accepted'}
 ],
 vendors:[
  {id:'VEN-001',name:'GreenRoot Agro Pvt. Ltd.',trade:'GreenRoot Nursery',category:'Plant Grower / Wholesale Nursery',location:'Pune, Maharashtra',contact:'Rohit Patil',phone:'+91 98765 43210',gst:'27AABCG4821K1Z7',terms:'30 Days',status:'Active'},
  {id:'VEN-002',name:'Shree Sai Horticulture',trade:'Sai Plants',category:'Plant Grower / Wholesale Nursery',location:'Nashik, Maharashtra',contact:'Sandeep Jadhav',phone:'+91 98220 44551',gst:'27ABHFS3314Q1Z2',terms:'15 Days',status:'Active'},
  {id:'VEN-003',name:'NaturePot Industries',trade:'NaturePot',category:'Packaging & Pots',location:'Ahmednagar, Maharashtra',contact:'Nitin Kale',phone:'+91 97655 82001',gst:'27AAFCN5912D1Z6',terms:'Advance / 7 Days',status:'Active'}
 ],
 purchases:[
  {po:'PO-2026-0728-041',date:'28 Jul 2026',vendor:'GreenRoot Agro Pvt. Ltd.',product:'Tulsi',qty:500,rate:32,total:16000,farm:'Kamshet Farm',status:'Received',payment:'Due'},
  {po:'PO-2026-0714-033',date:'14 Jul 2026',vendor:'Prakruti Nursery',product:'Tulsi',qty:700,rate:30,total:21000,farm:'Karla Farm',status:'Received',payment:'Paid'},
  {po:'PO-2026-0621-026',date:'21 Jun 2026',vendor:'Shree Sai Horticulture',product:'Tulsi',qty:900,rate:31,total:27900,farm:'Talegaon Farm',status:'Received',payment:'Paid'},
  {po:'PO-2026-0802-046',date:'02 Aug 2026',vendor:'GreenRoot Agro Pvt. Ltd.',product:'Areca Palm',qty:220,rate:145,total:31900,farm:'Kamshet Farm',status:'Received',payment:'Due'},
  {po:'PO-2026-0722-038',date:'22 Jul 2026',vendor:'Shree Sai Horticulture',product:'Areca Palm',qty:300,rate:138,total:41400,farm:'Vadegaon Farm',status:'Received',payment:'Partial'}
 ]
};

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const badge=(text)=> {
 const t=String(text).toLowerCase();
 let c='gray';
 if(t.includes('paid')||t.includes('completed')||t==='received'||t==='accepted'||t==='active') c='green';
 if(t.includes('partial')||t.includes('pending')||t.includes('due')||t.includes('quote')) c='yellow';
 if(t.includes('progress')) c='blue';
 if(t.includes('cancel')||t.includes('failed')) c='red';
 if(t.includes('variance')) c='purple';
 return `<span class="badge ${c}">${text}</span>`;
};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2400)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function switchTab(tab,btn){
 state.current=tab;
 document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 document.getElementById('sidebar').classList.remove('open');
 render();
}
function infoButton(text){return `<button class="info-btn" title="Info" onclick='showInfo(${JSON.stringify(text)})'>i</button>`}
function showInfo(text){openModal('Information',`<div class="detail"><label>About this field</label><strong>${text}</strong></div>`)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})

function hero(kicker,title,sub){return `<section class="hero"><div class="hero-kicker">${kicker}</div><h1>${title}</h1><p>${sub}</p></section>`}
function metric(label,value,sub,icon){return `<div class="metric"><div class="mi">${icon}</div><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function stepper(items,current){return `<div class="stepper">${items.map((x,i)=>`${i?'<div class="step-line"></div>':''}<div class="step ${i<current?'done':i===current?'current':''}"><span class="step-num">${i<current?'✓':i+1}</span>${x}</div>`).join('')}</div>`}
function panel(title,sub,toolbar,body){return `<section class="panel"><div class="panel-head"><div><h3>${title}</h3><p>${sub}</p></div><div class="toolbar">${toolbar||''}</div></div>${body}</section>`}
function chart(rows){const max=Math.max(...rows.map(x=>x[1]),1);return `<div class="chart-card"><h3>Financial Snapshot</h3>${rows.map(r=>`<div class="bar-row"><span>${r[0]}</span><div class="bar-bg"><div class="bar-fill" style="width:${(r[1]/max)*100}%"></div></div><strong>${typeof r[1]==='number'?money(r[1]):r[1]}</strong></div>`).join('')}</div>`}
function activities(items){return `<div class="activity-card"><h3>Accounts Activity / To-do</h3>${items.map(x=>`<div class="todo"><span class="todo-dot"></span><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`}

function renderMaster(){
 const b2cTotal=state.b2cBills.reduce((s,x)=>s+x.total,0), b2cPaid=state.b2cBills.filter(x=>x.payment==='Paid').reduce((s,x)=>s+x.total,0);
 const b2bValue=state.b2b.reduce((s,x)=>s+x.value,0), b2bRecv=state.b2b.reduce((s,x)=>s+x.received,0);
 const purchase=state.purchases.reduce((s,x)=>s+x.total,0), due=state.purchases.filter(x=>x.payment!=='Paid').reduce((s,x)=>s+x.total,0);
 return hero('Accounts Control Center','Master Dashboard','Consolidated billing, collections, B2B receivables, vendor quotation activity and purchase obligations in one accountant-facing view.')+
 `<div class="metric-grid">${metric('Total Sales Value',money(b2cTotal+b2bValue),'B2C + B2B booked value','₹')}${metric('Payments Received',money(b2cPaid+b2bRecv),'Recorded collections','✓')}${metric('Outstanding Receivables',money((b2cTotal-b2cPaid)+(b2bValue-b2bRecv)),'Customer balance pending','⏳')}${metric('Vendor Purchase Value',money(purchase),'Purchase-order history','🏢')}</div>`+
 stepper(['Capture Transactions','Record Payments','Reconcile Balances','Close / Report'],2)+
 panel('Accounts Control Table','Priority financial transactions requiring accountant visibility or action.',
 `<select class="select"><option>All Modules</option><option>B2C</option><option>B2B</option><option>Vendor Purchase</option></select><button class="btn btn-light" onclick="toast('Filters refreshed')">↻ Refresh</button>`,
 `<div class="table-wrap"><table><thead><tr><th>Sr.</th><th>Module</th><th>Reference</th><th>Party</th><th>Transaction Value</th><th>Received / Paid</th><th>Balance</th><th>Status</th><th>Info</th><th>CTA</th></tr></thead><tbody>
 ${[
  ['B2C','B2C-0234','Aakash Patil',1256,0,1256,'Pending'],
  ['B2B','ORD-2026-001','GreenScape Landscaping Pvt Ltd',146500,75000,71500,'Partially Paid'],
  ['B2B','ORD-2026-003','EverGreen Resorts',212000,60000,152000,'Partially Paid'],
  ['Vendor Purchase','PO-2026-0802-046','GreenRoot Agro Pvt. Ltd.',31900,0,31900,'Due']
 ].map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td><td>${money(r[3])}</td><td>${money(r[4])}</td><td><strong>${money(r[5])}</strong></td><td>${badge(r[6])}</td><td>${infoButton('This row consolidates the financial status of the referenced transaction.')}</td><td><button class="btn btn-green" onclick="toast('Opening ${r[1]}')">Open</button></td></tr>`).join('')}
 </tbody></table></div>`)+
 `<div class="bottom-grid">${chart([['B2C Sales',b2cTotal],['B2B Orders',b2bValue],['Vendor Purchases',purchase],['Outstanding',due]])}${activities([
 ['Collect B2C-0234','Counter bill payment is still pending.'],
 ['Follow up ORD-2026-003','₹152,000 customer balance remains outstanding.'],
 ['Review vendor dues','Two purchase orders still require payment processing.'],
 ['Monthly reconciliation','Reconcile receipts, balances and purchase payments before closing.']
 ])}</div>`;
}

function renderB2C(){
 const total=state.b2cBills.reduce((s,x)=>s+x.total,0),paid=state.b2cBills.filter(x=>x.payment==='Paid').reduce((s,x)=>s+x.total,0),pending=state.b2cBills.filter(x=>x.payment==='Pending').reduce((s,x)=>s+x.total,0),cancelled=state.b2cBills.filter(x=>x.status==='Cancelled').length;
 return hero('MIMO 4 · Accountant Counter','B2C Billing & Payment Management','Manage counter bills, customer payment status, billing totals and invoice lifecycle without exposing the full customer-store workflow.')+
 `<div class="metric-grid">${metric('Total Bills',state.b2cBills.length,'Counter bills created','🧾')}${metric('B2C Sales',money(total),'Gross billed value','₹')}${metric('Payment Pending',money(pending),'Open counter receivables','⏳')}${metric('Cancelled Bills',cancelled,'Bills requiring reason audit','×')}</div>`+
 stepper(['Bill Created','Payment Recorded','Invoice Updated','Completed'],1)+
 panel('B2C Bill Management','Counter invoices from the B2C flow. Record payment directly from the table.',
 `<input id="b2cSearch" class="input search" placeholder="Search bill or customer..." oninput="filterRows('b2cTable',this.value)"><select class="select"><option>All Payment Status</option><option>Paid</option><option>Pending</option><option>Cancelled</option></select>`,
 `<div class="table-wrap"><table id="b2cTable"><thead><tr><th>Sr.</th><th>Bill No.</th><th>Date</th><th>Customer</th><th>City</th><th>Supervisor</th><th>Items</th><th>Subtotal</th><th>GST</th><th>Total</th><th>Payment</th><th>Bill Status</th><th>Info</th><th>CTA</th></tr></thead><tbody>
 ${state.b2cBills.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${x.bill}</strong></td><td>${x.date}</td><td>${x.customer}</td><td>${x.city}</td><td>${x.supervisor}</td><td>${x.items}</td><td>${money(x.subtotal)}</td><td>${money(x.gst)}</td><td><strong>${money(x.total)}</strong></td><td>${badge(x.payment)}</td><td>${badge(x.status)}</td><td>${infoButton('Payment status represents the accountant-side collection state of this counter bill.')}</td><td>${x.payment==='Pending'?`<button class="btn btn-gold" onclick="paymentModal('${x.bill}',${x.total},'B2C')">Record Payment</button>`:`<button class="btn btn-light" onclick="viewRecord('B2C','${x.bill}')">View Bill</button>`}</td></tr>`).join('')}
 </tbody></table></div>`)+
 `<div class="bottom-grid">${chart([['Paid',paid],['Pending',pending],['Total Billed',total]])}${activities([
 ['Verify pending counter bills','Check open bills against cash / UPI / card settlement.'],
 ['Review cancellations','Confirm cancellation reason and supervisor reference.'],
 ['Day-end B2C closure','Match counter total with payment settlement before daily close.']
 ])}</div>`;
}

function renderB2B(){
 const total=state.b2b.reduce((s,x)=>s+x.value,0),received=state.b2b.reduce((s,x)=>s+x.received,0),pending=total-received,completed=state.b2b.filter(x=>x.status==='Completed').length;
 return hero('MIMO 5 · B2B Finance','B2B Orders & Receivables','Accountant-facing view of finalized quotations, order values, payment terms, receipts, pending balances and order-linked payment tracking.')+
 `<div class="metric-grid">${metric('Active Orders',state.b2b.length,'Finalized quotations converted to orders','🤝')}${metric('Order Value',money(total),'Total B2B value','₹')}${metric('Payment Received',money(received),'Recorded receipts','✓')}${metric('Pending Balance',money(pending),completed+' order(s) completed','⏳')}</div>`+
 stepper(['Inquiry','Quotation Finalized','Payment Recorded','Order Fulfilled'],2)+
 panel('B2B Orders & Payment Register','Main receivables table linked to inquiry and finalized quotation records.',
 `<input class="input search" placeholder="Search order / customer..." oninput="filterRows('b2bTable',this.value)"><select class="select"><option>All Payment Status</option><option>Fully Paid</option><option>Partially Paid</option></select>`,
 `<div class="table-wrap"><table id="b2bTable"><thead><tr><th>Sr.</th><th>Order No.</th><th>Quotation</th><th>Inquiry</th><th>Customer</th><th>Order Value</th><th>Received</th><th>Pending</th><th>Payment Terms</th><th>Supervisor</th><th>Driver</th><th>Order Status</th><th>Payment Status</th><th>Info</th><th>CTA</th></tr></thead><tbody>
 ${state.b2b.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${x.order}</strong></td><td>${x.quotation}</td><td>${x.inquiry}</td><td>${x.customer}</td><td><strong>${money(x.value)}</strong></td><td>${money(x.received)}</td><td><strong>${money(x.value-x.received)}</strong></td><td>${x.terms}</td><td>${x.supervisor}</td><td>${x.driver}</td><td>${badge(x.status)}</td><td>${badge(x.payment)}</td><td>${infoButton('The accountant records payments against this order. Operational assignment fields remain visible for reference.')}</td><td><button class="btn ${x.received<x.value?'btn-gold':'btn-light'}" onclick="${x.received<x.value?`paymentModal('${x.order}',${x.value-x.received},'B2B')`:`viewRecord('B2B','${x.order}')`}">${x.received<x.value?'Update Payment':'View'}</button></td></tr>`).join('')}
 </tbody></table></div>`)+
 `<div class="bottom-grid">${chart([['Order Value',total],['Received',received],['Pending',pending]])}${activities([
 ['Follow up GreenScape','₹71,500 remains against ORD-2026-001.'],
 ['Review variance order','Confirm payment impact for ORD-2026-003 before closure.'],
 ['Verify payment references','Ensure UTR / cheque / receipt numbers are recorded for every B2B receipt.']
 ])}</div>`;
}

function renderVendorPortal(){
 const pending=state.vendorQuotes.filter(x=>x.status.includes('Pending')).length;
 return hero('MIMO 9 · Vendor Portal','Vendor Quotation Sent Details','Finance visibility into quotation requests accepted by vendors, linked work orders, due dates and quotation progress.')+
 `<div class="metric-grid">${metric('Vendor RFQs',state.vendorQuotes.length,'Accepted vendor-side opportunities','📄')}${metric('Quote Pending',pending,'Awaiting vendor quotation','⏳')}${metric('Accepted RFQs',state.vendorQuotes.filter(x=>x.status==='Accepted').length,'Accepted by vendor','✓')}${metric('Linked Work Orders',new Set(state.vendorQuotes.map(x=>x.wo)).size,'Unique WO references','🔗')}</div>`+
 stepper(['RFQ Sent','Vendor Accepted','Quotation Submitted','PO Decision'],2)+
 panel('Quotation Sent Details','Vendor quotation acceptance and RFQ linkage in a single accountant-readable table.',
 `<input class="input search" placeholder="Search RFQ / vendor..." oninput="filterRows('vendorQuoteTable',this.value)"><select class="select"><option>All Status</option><option>Accepted</option><option>Quote Pending</option></select>`,
 `<div class="table-wrap"><table id="vendorQuoteTable"><thead><tr><th>Sr.</th><th>RFQ No.</th><th>Work Order</th><th>Vendor</th><th>Requirement</th><th>Category</th><th>Farm</th><th>Requested Qty</th><th>Required By</th><th>Accepted On</th><th>Status</th><th>Info</th><th>CTA</th></tr></thead><tbody>
 ${state.vendorQuotes.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${x.rfq}</strong></td><td>${x.wo}</td><td>${x.vendor}</td><td>${x.requirement}</td><td>${x.category}</td><td>${x.farm}</td><td>${x.qty}</td><td>${x.required}</td><td>${x.accepted}</td><td>${badge(x.status)}</td><td>${infoButton('RFQ and work-order references allow the accountant to trace procurement demand back to the operational requirement.')}</td><td><button class="btn btn-blue" onclick="viewVendorQuote('${x.rfq}')">View Details</button></td></tr>`).join('')}
 </tbody></table></div>`)+
 `<div class="bottom-grid">${chart([['Accepted RFQs',state.vendorQuotes.filter(x=>x.status==='Accepted').length],['Quote Pending',pending]])}${activities([
 ['Check quote pending RFQ','RFQ-2026-0812-014 is accepted but vendor quote is still pending.'],
 ['Trace PO conversion','Ensure accepted vendor quotations eventually map to purchase orders.'],
 ['Review required-by dates','Escalate vendor RFQs approaching requirement date without final quote.']
 ])}</div>`;
}

function renderVendorPurchase(){
 const total=state.purchases.reduce((s,x)=>s+x.total,0),due=state.purchases.filter(x=>x.payment==='Due').reduce((s,x)=>s+x.total,0),partial=state.purchases.filter(x=>x.payment==='Partial').reduce((s,x)=>s+x.total,0);
 return hero('MIMO 10 · Vendor Purchase Management','Vendor Master & Purchase Order History','Register vendors, review supplier records, track PO history and manage purchase-side payment exposure from one accountant workspace.')+
 `<div class="metric-grid">${metric('Registered Vendors',state.vendors.length,'Vendor master records','🏢')}${metric('Purchase Orders',state.purchases.length,'Historical PO records','🧾')}${metric('Purchase Value',money(total),'Total PO value','₹')}${metric('Vendor Payables',money(due+partial),'Due + partial vendor payments','⏳')}</div>`+
 stepper(['Vendor Registered','PO Created','Material Received','Vendor Payment Closed'],2)+
 panel('Vendor Master','Register and maintain supplier master records. Vendor list remains in the same section.',
 `<button class="btn btn-green" onclick="openVendorRegistration()">＋ Register Vendor</button><input class="input search" placeholder="Search vendor..." oninput="filterRows('vendorMasterTable',this.value)">`,
 `<div class="table-wrap"><table id="vendorMasterTable"><thead><tr><th>Sr.</th><th>Vendor ID</th><th>Legal Name</th><th>Trade Name</th><th>Category</th><th>Location</th><th>Contact</th><th>GSTIN</th><th>Payment Terms</th><th>Status</th><th>Info</th><th>CTA</th></tr></thead><tbody>
 ${state.vendors.map((v,i)=>`<tr><td>${i+1}</td><td><strong>${v.id}</strong></td><td>${v.name}</td><td>${v.trade}</td><td>${v.category}</td><td>${v.location}</td><td>${v.contact}<br><span style="color:#7b887e;font-size:10px">${v.phone}</span></td><td>${v.gst}</td><td>${v.terms}</td><td>${badge(v.status)}</td><td>${infoButton('Vendor master data supports purchase order, payment-term and vendor-transaction records.')}</td><td><button class="btn btn-light" onclick="viewVendor('${v.id}')">View Details</button></td></tr>`).join('')}
 </tbody></table></div>`)+
 panel('Purchase Order History','PO-wise vendor purchases with payment visibility.',
 `<input class="input search" placeholder="Search PO / vendor / product..." oninput="filterRows('poTable',this.value)"><select class="select"><option>All Payment Status</option><option>Paid</option><option>Due</option><option>Partial</option></select>`,
 `<div class="table-wrap"><table id="poTable"><thead><tr><th>Sr.</th><th>PO No.</th><th>Date</th><th>Vendor</th><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th><th>Farm</th><th>Receipt Status</th><th>Payment Status</th><th>Info</th><th>CTA</th></tr></thead><tbody>
 ${state.purchases.map((p,i)=>`<tr><td>${i+1}</td><td><strong>${p.po}</strong></td><td>${p.date}</td><td>${p.vendor}</td><td>${p.product}</td><td>${p.qty.toLocaleString('en-IN')}</td><td>${money(p.rate)}</td><td><strong>${money(p.total)}</strong></td><td>${p.farm}</td><td>${badge(p.status)}</td><td>${badge(p.payment)}</td><td>${infoButton('Receipt status confirms material receipt; payment status tracks the financial settlement of the PO.')}</td><td>${p.payment!=='Paid'?`<button class="btn btn-gold" onclick="paymentModal('${p.po}',${p.total},'Vendor Purchase')">Record Payment</button>`:`<button class="btn btn-light" onclick="viewRecord('Purchase','${p.po}')">View</button>`}</td></tr>`).join('')}
 </tbody></table></div>`)+
 `<div class="bottom-grid">${chart([['Purchase Value',total],['Due',due],['Partial',partial]])}${activities([
 ['Process GreenRoot dues','Two GreenRoot purchase orders are marked Due.'],
 ['Verify material receipt','Only received POs should progress to final vendor payment.'],
 ['Review payment terms','Use vendor master payment terms when prioritizing outgoing payments.']
 ])}</div>`;
}

function render(){
 const c=document.getElementById('content');
 c.innerHTML=state.current==='b2c'?renderB2C():state.current==='b2b'?renderB2B():state.current==='vendorPortal'?renderVendorPortal():state.current==='vendorPurchase'?renderVendorPurchase():renderMaster();
}
function filterRows(tableId,q){q=q.toLowerCase();document.querySelectorAll('#'+tableId+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function paymentModal(ref,amount,module){
 openModal('Record Payment · '+ref,`<div class="form-grid">
  <label>Module<input class="input" value="${module}" disabled></label>
  <label>Reference<input class="input" value="${ref}" disabled></label>
  <label>Amount<input id="payAmount" class="input" type="number" value="${amount}"></label>
  <label>Payment Date<input class="input" type="date" value="2026-08-19"></label>
  <label>Payment Mode<select class="select"><option>Bank Transfer</option><option>UPI</option><option>Cash</option><option>Cheque</option><option>Card</option></select></label>
  <label>Reference / UTR<input class="input" placeholder="Enter transaction reference"></label>
  <label class="full">Payment Note<input class="input" placeholder="Advance / part / final payment"></label>
 </div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="closeModal();toast('Payment recorded for ${ref}')">Save Payment</button></div>`)
}
function viewRecord(type,ref){openModal(type+' Details',`<div class="detail-grid"><div class="detail"><label>Reference</label><strong>${ref}</strong></div><div class="detail"><label>Module</label><strong>${type}</strong></div><div class="detail full"><label>ERP Note</label><strong>This modal represents the detailed source transaction, payment history, linked documents and audit references.</strong></div></div>`)}
function viewVendorQuote(rfq){const x=state.vendorQuotes.find(v=>v.rfq===rfq);openModal('Vendor Quotation · '+rfq,`<div class="detail-grid">${[['RFQ',x.rfq],['Work Order',x.wo],['Vendor',x.vendor],['Requirement',x.requirement],['Category',x.category],['Farm',x.farm],['Requested Qty',x.qty],['Required By',x.required],['Accepted On',x.accepted],['Status',x.status]].map(a=>`<div class="detail"><label>${a[0]}</label><strong>${a[1]}</strong></div>`).join('')}</div>`)}
function openVendorRegistration(){openModal('Register Vendor',`<div class="form-grid">
<label>Legal Business Name<input id="rvName" class="input" placeholder="Vendor legal name"></label>
<label>Trade Name<input id="rvTrade" class="input" placeholder="Trade name"></label>
<label>Vendor Category<select id="rvCat" class="select"><option>Plant Grower / Wholesale Nursery</option><option>Packaging & Pots</option><option>Soil, Fertilizer & Growing Media</option><option>Logistics & Freight</option></select></label>
<label>Location<input id="rvLoc" class="input" placeholder="City, State"></label>
<label>Contact Person<input id="rvContact" class="input" placeholder="Primary contact"></label>
<label>Phone<input id="rvPhone" class="input" placeholder="+91 ..."></label>
<label>GST / Tax ID<input id="rvGst" class="input" placeholder="GSTIN"></label>
<label>Payment Terms<select id="rvTerms" class="select"><option>15 Days</option><option>30 Days</option><option>Advance / 7 Days</option><option>45 Days</option></select></label>
</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="saveVendor()">Register Vendor</button></div>`)}
function saveVendor(){
 const name=document.getElementById('rvName').value.trim(); if(!name){toast('Enter vendor legal name');return}
 state.vendors.push({id:'VEN-'+String(state.vendors.length+1).padStart(3,'0'),name,trade:document.getElementById('rvTrade').value||name,category:document.getElementById('rvCat').value,location:document.getElementById('rvLoc').value||'Not provided',contact:document.getElementById('rvContact').value||'Not provided',phone:document.getElementById('rvPhone').value||'Not provided',gst:document.getElementById('rvGst').value||'Not provided',terms:document.getElementById('rvTerms').value,status:'Active'});closeModal();render();toast('Vendor registered successfully')
}
function viewVendor(id){const v=state.vendors.find(x=>x.id===id);openModal('Vendor Details · '+id,`<div class="detail-grid">${[['Vendor ID',v.id],['Legal Name',v.name],['Trade Name',v.trade],['Category',v.category],['Location',v.location],['Contact',v.contact],['Phone',v.phone],['GSTIN',v.gst],['Payment Terms',v.terms],['Status',v.status]].map(a=>`<div class="detail"><label>${a[0]}</label><strong>${a[1]}</strong></div>`).join('')}</div>`)}
render();
</script>
</body>
</html>
