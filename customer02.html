<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OM Nursery · Customer</title>
</head>

<body style="margin:0;background:#f4f7f5;color:#1e2e24;font-family:Arial,Helvetica,sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:calc(90px + env(safe-area-inset-bottom));box-sizing:border-box;">

  <div id="app"></div>

  <!-- CAMERA / RFID SCAN MODAL -->
  <div id="scanModal"
       onclick="if(event.target===this) closeScanner()"
       style="display:none;position:fixed;inset:0;background:rgba(6,24,13,.72);backdrop-filter:blur(7px);z-index:9999;align-items:flex-start;justify-content:center;padding:12px 12px calc(90px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <div style="width:min(540px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.35);margin:auto;">
      <div style="background:linear-gradient(145deg,#173f27,#245b38);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div>
          <div style="font-size:17px;font-weight:950;">📷 Scan RFID / QR Label</div>
          <div style="font-size:10px;color:rgba(255,255,255,.78);margin-top:4px;line-height:1.45;">Camera reads a QR/barcode containing the RFID code.</div>
        </div>
        <button onclick="closeScanner()" style="border:none;background:rgba(255,255,255,.13);color:#fff;width:34px;height:34px;border-radius:10px;font-size:20px;cursor:pointer;">×</button>
      </div>

      <div style="padding:14px;">
        <div style="background:#0d1710;border-radius:16px;overflow:hidden;position:relative;min-height:260px;display:flex;align-items:center;justify-content:center;">
          <video id="cameraVideo" autoplay playsinline muted style="width:100%;max-height:360px;object-fit:cover;display:block;"></video>

          <div style="position:absolute;inset:15%;border:2px solid #d9a928;border-radius:17px;box-shadow:0 0 0 999px rgba(0,0,0,.20);pointer-events:none;"></div>

          <div id="cameraPlaceholder" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#dbe8dd;padding:28px;font-size:12px;line-height:1.55;font-weight:700;">
            Camera preview will appear here.
          </div>
        </div>

        <div id="scanStatus" style="margin-top:10px;padding:10px 11px;background:#edf5ef;border:1px solid #dce9de;border-radius:11px;color:#173f27;font-size:10px;line-height:1.5;font-weight:750;">
          Point the camera at a QR/barcode carrying an RFID code.
        </div>

        <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px;">
          <button onclick="simulateRFIDScan()" style="border:none;background:#d9a928;color:#1e2e24;border-radius:12px;padding:11px;font-size:11px;font-weight:900;cursor:pointer;">
            ⚡ Simulate RFID Scan
          </button>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin:13px 0 9px;">
          <div style="height:1px;background:#e6eee6;flex:1;"></div>
          <span style="font-size:9px;color:#879489;font-weight:800;">OR ENTER CODE</span>
          <div style="height:1px;background:#e6eee6;flex:1;"></div>
        </div>

        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <input id="manualRFID" placeholder="e.g. RFID-OM-1001" style="flex:1;min-width:180px;border:1px solid #dbe8db;border-radius:12px;padding:11px 12px;font:inherit;font-size:12px;outline:none;box-sizing:border-box;">
          <button onclick="manualRFIDAdd()" style="border:none;background:#173f27;color:#fff;border-radius:12px;padding:10px 15px;font-size:10px;font-weight:900;cursor:pointer;">Add Product</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PRODUCT DETAILS -->
  <div id="productModal"
       onclick="if(event.target===this) closeProductModal()"
       style="display:none;position:fixed;inset:0;background:rgba(6,24,13,.67);backdrop-filter:blur(6px);z-index:9998;align-items:flex-start;justify-content:center;padding:12px 12px calc(90px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;">
    <div id="productModalContent" style="width:min(620px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.32);margin:auto;"></div>
  </div>

  <div id="toast"
       style="position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:auto;background:#173f27;color:#fff;padding:12px 15px;border-radius:13px;box-shadow:0 13px 30px rgba(0,20,0,.22);font-size:11px;font-weight:850;z-index:10000;opacity:0;transform:translateY(70px);transition:.25s;pointer-events:none;"></div>

<script>
  const PRODUCTS = [
    {
      id:"P001", name:"Rose Plant", category:"Flowering", price:299, stage:"Adult",
      image:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80",
      description:"Healthy flowering rose plant suitable for home gardens and landscape beds."
    },
    {
      id:"P002", name:"Tulsi Plant", category:"Medicinal", price:199, stage:"Child",
      image:"https://images.unsplash.com/photo-1618375569909-3c8616cf7733?auto=format&fit=crop&w=800&q=80",
      description:"Aromatic Tulsi plant for home, balcony and medicinal garden use."
    },
    {
      id:"P003", name:"Mango Tree", category:"Fruit", price:499, stage:"Sapling",
      image:"https://images.unsplash.com/photo-1591073113125-e46713c829ed?auto=format&fit=crop&w=800&q=80",
      description:"Young mango sapling prepared for transplanting and long-term growth."
    },
    {
      id:"P004", name:"Aloe Vera", category:"Medicinal", price:249, stage:"Adult",
      image:"https://images.unsplash.com/photo-1509423350716-97f2360af8e4?auto=format&fit=crop&w=800&q=80",
      description:"Low-maintenance Aloe Vera plant suitable for indoor and outdoor placement."
    },
    {
      id:"P005", name:"Money Plant", category:"Indoor", price:179, stage:"Child",
      image:"https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=80",
      description:"Popular indoor foliage plant with easy-care growth."
    },
    {
      id:"P006", name:"Jasmine Plant", category:"Flowering", price:349, stage:"Adult",
      image:"https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=800&q=80",
      description:"Fragrant flowering Jasmine plant for pots and outdoor garden areas."
    },
    {
      id:"P007", name:"Guava Plant", category:"Fruit", price:399, stage:"Sapling",
      image:"https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?auto=format&fit=crop&w=800&q=80",
      description:"Healthy guava sapling suitable for home orchards and landscape planting."
    },
    {
      id:"P008", name:"Areca Palm", category:"Indoor", price:599, stage:"Adult",
      image:"https://images.unsplash.com/photo-1598880940080-ff9a29891b85?auto=format&fit=crop&w=800&q=80",
      description:"Decorative Areca Palm suitable for indoor and shaded environments."
    },
    {
      id:"P009", name:"Garden Trowel", category:"Tools", price:149, stage:"Tool",
      image:"https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=800&q=80",
      description:"Compact hand trowel for planting, potting and daily garden work."
    },
    {
      id:"P010", name:"Organic Compost", category:"Garden Care", price:220, stage:"Care",
      image:"https://images.unsplash.com/photo-1589923188900-85dae523342b?auto=format&fit=crop&w=800&q=80",
      description:"Organic compost mix for improving soil nutrition and plant growth."
    }
  ];

  const RFID_PRODUCTS = {
    "RFID-OM-1001":"P001",
    "RFID-OM-1002":"P002",
    "RFID-OM-1003":"P003",
    "RFID-OM-1004":"P004",
    "RFID-OM-1005":"P005",
    "RFID-OM-1006":"P006",
    "RFID-OM-1007":"P007",
    "RFID-OM-1008":"P008"
  };

  const state = {
    authView:"login",
    screen:"home",
    loggedIn:false,
    customer:null,
    storeSearch:"",
    category:"All",
    cart:[],
    checkoutComplete:false,
    order:null,
    reviews:{
      product:{rating:0,comment:""},
      display:{rating:0,comment:""},
      supervisor:{rating:0,comment:""}
    },
    reviewSubmitted:false,
    cameraStream:null,
    scanLoop:null
  };

  function esc(v){
    return String(v??"")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function money(v){
    return "₹"+Number(v||0).toLocaleString("en-IN");
  }

  function showToast(message,error=false){
    const t=document.getElementById("toast");
    t.textContent=(error?"⚠ ":"✓ ")+message;
    t.style.background=error?"#b42331":"#173f27";
    t.style.opacity="1";
    t.style.transform="translateY(0)";
    clearTimeout(t._timer);
    t._timer=setTimeout(()=>{
      t.style.opacity="0";
      t.style.transform="translateY(70px)";
    },2400);
  }

  function customerStorage(){
    try{
      return JSON.parse(localStorage.getItem("omNurseryCustomer")||"null");
    }catch(e){
      return null;
    }
  }

  function saveCustomerStorage(data){
    localStorage.setItem("omNurseryCustomer",JSON.stringify(data));
  }

  function field(label,id,type="text",placeholder="",value=""){
    return `
      <label style="display:block;color:#173f27;font-size:11px;font-weight:850;">
        ${label}
        <input
          id="${id}"
          type="${type}"
          placeholder="${placeholder}"
          value="${esc(value)}"
          style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;background:#fff;color:#1e2e24;border-radius:12px;padding:11px 12px;font:inherit;font-size:12px;font-weight:650;outline:none;margin-top:5px;"
        >
      </label>
    `;
  }

  function greenButton(label,onclick,extra=""){
    return `<button onclick="${onclick}" style="border:none;background:#173f27;color:#fff;border-radius:12px;padding:11px 14px;font-size:11px;font-weight:900;cursor:pointer;${extra}">${label}</button>`;
  }

  function lightButton(label,onclick,extra=""){
    return `<button onclick="${onclick}" style="border:1px solid #d9e7da;background:#fff;color:#173f27;border-radius:12px;padding:10px 13px;font-size:10px;font-weight:900;cursor:pointer;${extra}">${label}</button>`;
  }

  function authLayout(){
    const isLogin=state.authView==="login";

    return `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;">
        <div style="width:min(900px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));background:#fff;border:1px solid #e4ede4;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,20,0,.09);">

          <div style="background:linear-gradient(145deg,#173f27,#245b38);padding:28px;color:#fff;min-height:250px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;">
            <div style="position:absolute;right:-15px;bottom:-35px;font-size:140px;opacity:.08;">🌿</div>
            <div style="position:relative;z-index:2;">
              <div style="width:48px;height:48px;border-radius:15px;background:#d9a928;color:#173f27;display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:17px;">🌱</div>
              <div style="font-size:28px;font-weight:950;line-height:1.1;">OM Nursery</div>
              <div style="font-size:13px;color:rgba(255,255,255,.82);line-height:1.6;margin-top:9px;max-width:420px;">
                Register once, scan plant labels or choose products from the store, add them to your cart and proceed to the assigned counter.
              </div>
            </div>
          </div>

          <div style="padding:24px;">

            <div style="display:flex;gap:6px;background:#f4f7f5;border-radius:12px;padding:4px;margin-bottom:20px;">
              <button onclick="state.authView='login';render()" style="flex:1;border:none;background:${isLogin?"#173f27":"transparent"};color:${isLogin?"#fff":"#647568"};border-radius:9px;padding:9px;font-size:10px;font-weight:900;cursor:pointer;">Login</button>
              <button onclick="state.authView='register';render()" style="flex:1;border:none;background:${!isLogin?"#173f27":"transparent"};color:${!isLogin?"#fff":"#647568"};border-radius:9px;padding:9px;font-size:10px;font-weight:900;cursor:pointer;">Register</button>
            </div>

            ${isLogin ? loginForm() : registrationForm()}

          </div>
        </div>
      </div>
    `;
  }

  function registrationForm(){
    return `
      <div style="font-size:20px;color:#173f27;font-weight:950;">Create Customer Account</div>
      <div style="font-size:10px;color:#78867c;line-height:1.5;margin-top:4px;margin-bottom:15px;">
        Customer details follow the B2C registration fields. A password is added only for this customer-role login.
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;">
        ${field("Name","regName","text","Your full name")}
        ${field("Email","regEmail","email","name@example.com")}
        ${field("Phone","regPhone","tel","10-digit mobile")}
        ${field("City","regCity","text","Pune")}
      </div>

      <div style="margin-top:10px;">
        ${field("Create Password","regPassword","password","Minimum 6 characters")}
      </div>

      <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px;">
        ${greenButton("Create Account","registerCustomer()","width:100%;")}
        ${lightButton("⚡ Fill Demo Customer","fillDemoRegistration()","width:100%;")}
      </div>
    `;
  }

  function loginForm(){
    return `
      <div style="font-size:20px;color:#173f27;font-weight:950;">Customer Login</div>
      <div style="font-size:10px;color:#78867c;line-height:1.5;margin-top:4px;margin-bottom:15px;">
        Sign in using your registered email or phone.
      </div>

      <div style="display:grid;gap:10px;">
        ${field("Email / Phone","loginUser","text","Email or mobile number")}
        ${field("Password","loginPassword","password","Enter password")}
      </div>

      <div style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px;">
        ${greenButton("Login","loginCustomer()","width:100%;")}
        ${lightButton("⚡ Use Demo Login","fillDemoLogin()","width:100%;")}
      </div>

      <div style="margin-top:13px;padding:10px;background:#fff8df;border:1px solid #f0dfa4;border-radius:11px;color:#6f5b1f;font-size:9px;line-height:1.5;font-weight:700;">
        Demo login: <strong>aakash@example.com</strong> · Password: <strong>123456</strong>
      </div>
    `;
  }

  function fillDemoRegistration(){
    document.getElementById("regName").value="Aakash Patil";
    document.getElementById("regEmail").value="aakash@example.com";
    document.getElementById("regPhone").value="9876543210";
    document.getElementById("regCity").value="Pune";
    document.getElementById("regPassword").value="123456";
  }

  function fillDemoLogin(){
    const demo={
      name:"Aakash Patil",
      email:"aakash@example.com",
      phone:"9876543210",
      city:"Pune",
      password:"123456"
    };
    saveCustomerStorage(demo);
    document.getElementById("loginUser").value=demo.email;
    document.getElementById("loginPassword").value=demo.password;
  }

  function registerCustomer(){
    const name=document.getElementById("regName").value.trim();
    const email=document.getElementById("regEmail").value.trim();
    const phone=document.getElementById("regPhone").value.trim();
    const city=document.getElementById("regCity").value.trim();
    const password=document.getElementById("regPassword").value;

    if(!name||!email||!phone||!city||!password){
      showToast("Complete all registration fields.",true);
      return;
    }

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      showToast("Enter a valid email address.",true);
      return;
    }

    if(!/^\d{10}$/.test(phone.replace(/\D/g,""))){
      showToast("Enter a valid 10-digit mobile number.",true);
      return;
    }

    if(password.length<6){
      showToast("Password must be at least 6 characters.",true);
      return;
    }

    saveCustomerStorage({name,email,phone:phone.replace(/\D/g,""),city,password});
    state.authView="login";
    render();
    showToast("Registration complete. Please login.");
  }

  function loginCustomer(){
    const user=document.getElementById("loginUser").value.trim().toLowerCase();
    const password=document.getElementById("loginPassword").value;
    const saved=customerStorage();

    if(!saved){
      showToast("No customer account found. Register first.",true);
      return;
    }

    const matched=(saved.email.toLowerCase()===user || saved.phone===user.replace(/\D/g,""));

    if(!matched || saved.password!==password){
      showToast("Incorrect login details.",true);
      return;
    }

    state.customer=saved;
    state.loggedIn=true;
    state.screen="home";
    render();
    showToast("Welcome, "+saved.name.split(" ")[0]+"!");
  }

  function logout(){
    closeScanner();
    state.loggedIn=false;
    state.customer=null;
    state.screen="home";
    state.cart=[];
    state.checkoutComplete=false;
    state.order=null;
    state.reviewSubmitted=false;
    state.authView="login";
    render();
  }

  function customerScreenTitle(){
    const titles={
      home:"Discover",
      store:"Nursery Store",
      cart:"My Cart",
      checkout:"Checkout",
      review:"Feedback",
      profile:"My Profile"
    };

    return titles[state.screen] || "Customer Portal";
  }

  function customerNavButton(screen,icon,label,badge=""){
    const active=state.screen===screen;

    return `
      <button
        onclick="goScreen('${screen}')"
        title="${label}"
        style="
          position:relative;
          border:1px solid ${active?"#cbdccf":"transparent"};
          background:${active?"#ffffff":"transparent"};
          color:${active?"#173f27":"#66796d"};
          min-width:43px;
          height:39px;
          border-radius:11px;
          padding:0 9px;
          display:flex;
          align-items:center;
          justify-content:center;
          gap:5px;
          cursor:pointer;
          box-shadow:${active?"0 4px 12px rgba(23,63,39,.07)":"none"};
        "
      >
        <span style="font-size:14px;line-height:1;">${icon}</span>

        <span
          data-customer-nav-label="true"
          style="
            display:${window.innerWidth>=760?"inline":"none"};
            font-size:8px;
            font-weight:900;
            white-space:nowrap;
          "
        >
          ${label}
        </span>

        ${badge?`
          <span style="
            position:absolute;
            right:-5px;
            top:-6px;
            background:#d9a928;
            color:#fff;
            min-width:17px;
            height:17px;
            padding:0 4px;
            border:2px solid #fff;
            border-radius:999px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:7px;
            font-weight:950;
            box-sizing:border-box;
          ">${badge}</span>
        `:""}
      </button>
    `;
  }

  function renderHeader(){
    const cartQty=state.cart.reduce((s,i)=>s+i.qty,0);

    return `
      <div style="
        position:sticky;
        top:0;
        z-index:300;
        background:rgba(244,247,244,.94);
        backdrop-filter:blur(16px);
        padding:8px 0 8px;
      ">

        <div style="
          background:#ffffff;
          border:1px solid #dde7df;
          border-radius:16px;
          padding:8px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:10px;
          box-shadow:0 8px 24px rgba(23,63,39,.055);
        ">

          <button
            onclick="goScreen('home')"
            style="
              border:none;
              background:transparent;
              display:flex;
              align-items:center;
              gap:9px;
              min-width:0;
              cursor:pointer;
              text-align:left;
              padding:0;
            "
          >
            <span style="
              width:38px;
              height:38px;
              min-width:38px;
              border-radius:12px;
              background:#173f27;
              color:#fff;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:18px;
              box-shadow:0 5px 13px rgba(23,63,39,.15);
            ">🌿</span>

            <span style="min-width:0;">
              <span style="
                display:block;
                color:#819087;
                font-size:7px;
                font-weight:850;
                text-transform:uppercase;
                letter-spacing:.06em;
              ">
                OM Nursery Customer
              </span>

              <strong style="
                display:block;
                color:#173f27;
                font-size:11px;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis;
                margin-top:2px;
              ">
                ${customerScreenTitle()}
              </strong>
            </span>
          </button>


          <div style="
            display:flex;
            align-items:center;
            gap:3px;
            background:#f3f6f3;
            border:1px solid #e5ebe6;
            border-radius:13px;
            padding:3px;
            overflow-x:auto;
            scrollbar-width:none;
            -webkit-overflow-scrolling:touch;
          ">
            ${customerNavButton("home","⌂","Home")}
            ${customerNavButton("store","🌱","Store")}
            ${customerNavButton("cart","🛒","Cart",cartQty || "")}
            ${customerNavButton("profile","👤","Profile")}
          </div>

        </div>
      </div>
    `;
  }

  function goScreen(screen){
    if(screen==="cart" && !state.cart.length){
      showToast("Your cart is empty.",true);
      return;
    }

    if(screen==="review" && !state.checkoutComplete){
      showToast("Complete checkout first.",true);
      return;
    }

    state.screen=screen;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function render(){
    if(!state.loggedIn){
      document.getElementById("app").innerHTML=authLayout();
      return;
    }

    let content=homeScreen();

    if(state.screen==="store")content=storeScreen();
    if(state.screen==="cart")content=cartScreen();
    if(state.screen==="checkout")content=checkoutScreen();
    if(state.screen==="review")content=reviewScreen();
    if(state.screen==="profile")content=profileScreen();

    document.getElementById("app").innerHTML=`
      <div style="width:min(1180px,calc(100% - 16px));margin:0 auto;padding:0 0 calc(100px + env(safe-area-inset-bottom));box-sizing:border-box;">
        ${renderHeader()}
        ${content}
      </div>
    `;
  }

  function profileScreen(){
    const cartQty=state.cart.reduce((sum,item)=>sum+item.qty,0);
    const initials=state.customer.name
      .split(" ")
      .filter(Boolean)
      .slice(0,2)
      .map(part=>part.charAt(0).toUpperCase())
      .join("");

    return `
      <div style="padding:7px 0 5px;">

        <div style="

  function addProductToCart(productId,source,rfid=null,qty=1){
    const existing=state.cart.find(i=>i.productId===productId && i.source===source && (source!=="RFID" || i.rfid===rfid));

    if(existing){
      existing.qty+=qty;
    }else{
      state.cart.push({
        key:"CART-"+Date.now()+"-"+Math.random().toString(36).slice(2,7),
        productId,
        qty,
        source,
        rfid
      });
    }
  }

  function combinedProductQty(productId){
    return state.cart
      .filter(i=>i.productId===productId)
      .reduce((s,i)=>s+i.qty,0);

  function changeQty(productId,delta){
    const storeItem=state.cart.find(i=>i.productId===productId && i.source==="Store");

    if(!storeItem && delta>0){
      addProductToCart(productId,"Store",null,1);
    }else if(storeItem){
      storeItem.qty+=delta;
      if(storeItem.qty<=0){
        state.cart=state.cart.filter(i=>i.key!==storeItem.key);
      }
    }

    render();
  }

  function cartTotals(){
    const subtotal=state.cart.reduce((sum,item)=>{
      const p=PRODUCTS.find(x=>x.id===item.productId);
      return sum+(p?p.price*item.qty:0);
    },0);

    const gst=Math.round(subtotal*0.05*100)/100;

    return {
      subtotal,
      gst,
      total:subtotal+gst
    };
  }

  function cartScreen(){
    if(!state.cart.length){
      return `
        <div style="padding:15px 0;">
          <div style="background:#fff;border:1px dashed #bfd5bf;border-radius:18px;padding:35px 20px;text-align:center;">
            <div style="font-size:38px;">🛒</div>
            <div style="font-size:16px;color:#173f27;font-weight:950;margin-top:8px;">Your cart is empty</div>
            <div style="font-size:9px;color:#718176;margin-top:4px;">Scan a plant or select products from the store.</div>

          <div>

            <div style="font-size:8px;color:#819087;margin-top:3px;">RFID scans and store products are combined here.</div>
          </div>
          ${lightButton("＋ Add More","goScreen('home')")}
        </div>

        <div style="display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,.7fr);gap:10px;align-items:start;">

          <div style="display:grid;gap:8px;">
            ${state.cart.map(cartItemCard).join("")}
          </div>

          <div style="background:linear-gradient(145deg,#173f27,#245b38);border-radius:16px;padding:15px;color:#fff;position:sticky;top:62px;">
            <div style="font-size:14px;font-weight:950;">Cart Summary</div>

            <div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:9px;color:rgba(255,255,255,.82);margin-top:5px;">
              <span>Subtotal</span><strong style="color:#fff;">${money(totals.subtotal)}</strong>
            </div>

            <div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:9px;color:rgba(255,255,255,.82);">
              <span>GST · 5%</span><strong style="color:#fff;">${money(totals.gst)}</strong>
            </div>

            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;">
              <span style="font-size:10px;font-weight:900;">Total</span>
              <strong style="font-size:20px;color:#d9a928;">${money(totals.total)}</strong>
            </div>

            <button onclick="goScreen('checkout')" style="width:100%;border:none;background:#d9a928;color:#1e2e24;border-radius:11px;padding:11px;margin-top:13px;font-size:10px;font-weight:950;cursor:pointer;">Checkout →</button>
          </div>

        </div>
      </div>
    `;
  }

  function cartItemCard(item){
    const p=PRODUCTS.find(x=>x.id===item.productId);
    if(!p)return "";

    return `
      <div style="position:relative;background:#fff;border:1px solid #e2ebe3;border-radius:15px;padding:10px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;box-shadow:0 5px 15px rgba(0,20,0,.03);">

        <button onclick="removeCartItem('${item.key}')" title="Remove" style="position:absolute;right:8px;top:8px;border:none;background:#fff0ef;color:#b42331;width:25px;height:25px;border-radius:8px;font-size:14px;cursor:pointer;">×</button>

        <img src="${p.image}" alt="${esc(p.name)}" style="width:70px;height:70px;object-fit:cover;border-radius:11px;background:#eaf3ea;">

        <div style="padding-right:25px;">
          <div style="font-size:12px;color:#173f27;font-weight:950;">${esc(p.name)}</div>

          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;">
            <span style="background:${item.source==="RFID"?"#edf6ff":"#edf5ef"};color:${item.source==="RFID"?"#134f7a":"#173f27"};border-radius:999px;padding:4px 6px;font-size:7px;font-weight:900;">${item.source==="RFID"?"📡 RFID Scan":"🌿 Store"}</span>
            <span style="background:#fff8df;color:#71590d;border-radius:999px;padding:4px 6px;font-size:7px;font-weight:900;">${esc(p.stage)}</span>
          </div>

          ${item.rfid?`<div style="font-size:7px;color:#829085;font-weight:750;margin-top:4px;">${esc(item.rfid)}</div>`:""}

          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <strong style="font-size:12px;color:#173f27;">${money(p.price*item.qty)}</strong>

            <div style="display:flex;align-items:center;gap:6px;background:#f7faf7;border:1px solid #e3ece4;border-radius:10px;padding:4px;">
              <button
                onclick="changeCartItem('${item.key}',-1)"
                style="border:none;background:#173f27;color:#fff;width:27px;height:27px;border-radius:8px;font-size:14px;font-weight:950;cursor:pointer;"
              >−</button>

              <span style="min-width:22px;text-align:center;font-size:10px;color:#173f27;font-weight:950;">${item.qty}</span>

              <button
                onclick="changeCartItem('${item.key}',1)"
                style="border:none;background:#173f27;color:#fff;width:27px;height:27px;border-radius:8px;font-size:14px;font-weight:950;cursor:pointer;"
              >+</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function changeCartItem(key,delta){
    const item=state.cart.find(i=>i.key===key);
    if(!item)return;

    item.qty+=delta;

    if(item.qty<=0){
      state.cart=state.cart.filter(i=>i.key!==key);
    }

    render();
  }

  function removeCartItem(key){
    state.cart=state.cart.filter(i=>i.key!==key);
    render();
    showToast("Product removed from cart.");
  }

  function checkoutScreen(){
    if(!state.cart.length){
      state.screen="home";
      return homeScreen();
    }

    if(state.checkoutComplete && state.order){
      return checkoutCompleteView();
    }

    const totals=cartTotals();

    return `
      <div style="padding:7px 0;">
        <div style="background:#fff;border:1px solid #e2ebe3;border-radius:18px;padding:15px;box-shadow:0 7px 20px rgba(0,20,0,.04);">

          <div style="font-size:18px;color:#173f27;font-weight:950;">Checkout</div>
          <div style="font-size:9px;color:#718176;line-height:1.5;margin-top:4px;">Confirm your products. Payment and final billing will be handled at the assigned counter.</div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-top:12px;">
            ${checkoutInfo("Customer",state.customer.name)}
            ${checkoutInfo("Phone",state.customer.phone)}
            ${checkoutInfo("City",state.customer.city)}
            ${checkoutInfo("Products",state.cart.reduce((s,i)=>s+i.qty,0)+" items")}
          </div>

          <div style="margin-top:12px;border:1px solid #e2ebe3;border-radius:13px;overflow:hidden;">
            <div style="padding:9px 10px;background:#edf5ef;color:#173f27;font-size:9px;font-weight:950;">Order Summary</div>

            ${state.cart.map(item=>{
              const p=PRODUCTS.find(x=>x.id===item.productId);
              return `<div style="display:flex;justify-content:space-between;gap:9px;padding:9px 10px;border-top:1px solid #e8eee8;font-size:9px;">
                <span><strong style="color:#173f27;">${esc(p.name)}</strong> × ${item.qty} <span style="color:#879489;">· ${item.source}</span></span>
                <strong style="color:#173f27;">${money(p.price*item.qty)}</strong>
              </div>`;
            }).join("")}

            <div style="display:flex;justify-content:space-between;gap:9px;padding:10px;background:#fbfdfb;border-top:1px solid #e8eee8;">
              <strong style="font-size:10px;color:#173f27;">Total incl. 5% GST</strong>
              <strong style="font-size:14px;color:#173f27;">${money(totals.total)}</strong>
            </div>
          </div>

          <div style="margin-top:12px;padding:10px 11px;background:#fff8df;border:1px solid #f0dfa4;border-radius:11px;color:#6d5718;font-size:9px;line-height:1.5;font-weight:750;">
            After checkout, take your order token to the counter shown on screen. Counter staff will continue the billing/payment process.
          </div>

          <div style="display:grid;grid-template-columns:1fr;gap:7px;margin-top:12px;">
            ${greenButton("Confirm Checkout","completeCheckout()","width:100%;padding:12px;")}
            ${lightButton("← Back to Cart","goScreen('cart')","width:100%;")}
          </div>

        </div>
      </div>
    `;
  }

  function checkoutInfo(label,value){
    return `
      <div style="background:#f8fbf8;border:1px solid #e4ece4;border-radius:11px;padding:9px;">
        <div style="font-size:7px;color:#869389;font-weight:900;text-transform:uppercase;">${label}</div>
        <div style="font-size:10px;color:#173f27;font-weight:900;margin-top:4px;">${esc(value)}</div>
      </div>
    `;
  }

  function completeCheckout(){
    if(!state.cart.length){
      showToast("Cart is empty.",true);
      return;
    }

    const totals=cartTotals();
    const counterNumber=((new Date().getMinutes()%3)+1);
    const counter="Counter "+String(counterNumber).padStart(2,"0");

    state.order={
      id:"ORD-B2C-"+Date.now().toString().slice(-6),
      token:"T"+String(Math.floor(100+Math.random()*900)),
      counter,
      items:JSON.parse(JSON.stringify(state.cart)),
      totals,
      createdAt:new Date().toLocaleString("en-IN")
    };

    state.checkoutComplete=true;
    render();
    showToast("Checkout complete. Proceed to "+counter+".");
  }

  function checkoutCompleteView(){
    return `
      <div style="padding:18px 0;display:flex;justify-content:center;">
        <div style="width:min(560px,100%);background:#fff;border:1px solid #dfeae0;border-radius:21px;padding:20px;text-align:center;box-shadow:0 12px 30px rgba(0,20,0,.06);">

          <div style="width:58px;height:58px;border-radius:18px;background:#eaf8ef;color:#173f27;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto;">✓</div>

          <div style="font-size:21px;color:#173f27;font-weight:950;margin-top:12px;">Checkout Complete</div>
          <div style="font-size:9px;color:#718176;line-height:1.55;margin-top:5px;">Your selection is confirmed. Please continue at the nursery counter.</div>

          <div style="background:linear-gradient(145deg,#173f27,#245b38);border-radius:17px;padding:17px;color:#fff;margin-top:15px;">
            <div style="font-size:9px;color:rgba(255,255,255,.76);font-weight:850;">PLEASE GO TO</div>
            <div style="font-size:28px;color:#d9a928;font-weight:950;margin-top:4px;">${esc(state.order.counter)}</div>
            <div style="font-size:10px;color:rgba(255,255,255,.85);margin-top:4px;">Show Token <strong>${esc(state.order.token)}</strong></div>
          </div>

          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px;">
            ${checkoutInfo("Order",state.order.id)}
            ${checkoutInfo("Token",state.order.token)}
          </div>

          <div style="display:grid;grid-template-columns:1fr;gap:7px;margin-top:13px;">
            ${greenButton("⭐ Add Review","goScreen('review')","width:100%;padding:12px;")}
            ${lightButton("Back to Home","goScreen('home')","width:100%;")}
          </div>

        </div>
      </div>
    `;
  }

  function reviewScreen(){
    if(!state.checkoutComplete){
      return `<div></div>`;
    }

    if(state.reviewSubmitted){
      return `
        <div style="padding:18px 0;display:flex;justify-content:center;">
          <div style="width:min(540px,100%);background:#fff;border:1px solid #dfeae0;border-radius:20px;padding:22px;text-align:center;">
            <div style="font-size:38px;">🌿</div>
            <div style="font-size:20px;color:#173f27;font-weight:950;margin-top:8px;">Thank you for your feedback!</div>
            <div style="font-size:10px;color:#718176;line-height:1.55;margin-top:5px;">Your product, nursery display and supervisor reviews have been submitted.</div>
            <div style="margin-top:13px;">${greenButton("Done","goScreen('home')")}</div>
          </div>
        </div>
      `;
    }

    return `
      <div style="padding:7px 0;">

        <div style="margin-bottom:10px;">
          <div style="font-size:19px;color:#173f27;font-weight:950;">⭐ Add Review</div>
          <div style="font-size:9px;color:#718176;line-height:1.5;margin-top:3px;">Please complete all three review sections.</div>
        </div>

        <div style="display:grid;gap:9px;">
          ${reviewCard("product","🌿","Product Review","How satisfied are you with the plants/products?")}
          ${reviewCard("display","🏪","Nursery Display Review","How was the store/display and product arrangement?")}
          ${reviewCard("supervisor","👤","Supervisor Review","How was the support from the nursery supervisor/staff?")}
        </div>

        <button onclick="submitReviews()" style="width:100%;border:none;background:#173f27;color:#fff;border-radius:12px;padding:12px;margin-top:11px;font-size:11px;font-weight:950;cursor:pointer;">Submit All Reviews</button>

      </div>
    `;
  }

  function reviewCard(type,icon,title,sub){
    const data=state.reviews[type];

    return `
      <div style="background:#fff;border:1px solid #e2ebe3;border-radius:16px;padding:13px;box-shadow:0 5px 16px rgba(0,20,0,.035);">
        <div style="display:flex;align-items:flex-start;gap:9px;">
          <div style="width:35px;height:35px;min-width:35px;border-radius:10px;background:#edf5ef;display:flex;align-items:center;justify-content:center;font-size:17px;">${icon}</div>
          <div>
            <div style="font-size:13px;color:#173f27;font-weight:950;">${title}</div>
            <div style="font-size:8px;color:#829085;line-height:1.4;margin-top:3px;">${sub}</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:11px;">
          ${[1,2,3,4,5].map(n=>`
            <button onclick="setReviewRating('${type}',${n})" style="border:1px solid ${data.rating>=n?"#d9a928":"#dce8dd"};background:${data.rating>=n?"#fff8df":"#fff"};color:${data.rating>=n?"#d9a928":"#b7c4b9"};border-radius:10px;height:39px;font-size:20px;cursor:pointer;">★</button>
          `).join("")}
        </div>

        <textarea
          oninput="state.reviews['${type}'].comment=this.value"
          placeholder="Write your comment..."
          style="width:100%;min-height:70px;box-sizing:border-box;border:1px solid #dbe8db;border-radius:11px;padding:10px;margin-top:9px;font:inherit;font-size:10px;line-height:1.45;resize:vertical;outline:none;"
        >${esc(data.comment)}</textarea>
      </div>
    `;
  }

  function setReviewRating(type,rating){
    state.reviews[type].rating=rating;
    render();
  }

  function submitReviews(){
    const all=Object.values(state.reviews);

    if(all.some(r=>!r.rating)){
      showToast("Give a star rating in all three reviews.",true);
      return;
    }

    if(all.some(r=>!r.comment.trim())){
      showToast("Add a comment in all three reviews.",true);
      return;
    }

    state.reviewSubmitted=true;
    render();
    showToast("Thank you! Reviews submitted.");
  }

  async function openScanner(){
    document.getElementById("scanModal").style.display="flex";
    document.getElementById("scanStatus").textContent="Starting camera...";
    document.getElementById("cameraPlaceholder").style.display="flex";

    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        throw new Error("Camera API is not supported in this browser.");
      }

      const stream=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

      state.cameraStream=stream;

      const video=document.getElementById("cameraVideo");
      video.srcObject=stream;

      await video.play();

      document.getElementById("cameraPlaceholder").style.display="none";
      document.getElementById("scanStatus").textContent="Camera ready. Scan a QR/barcode containing the RFID code.";

      startBarcodeDetection();

    }catch(err){
      document.getElementById("scanStatus").innerHTML=
        "Camera unavailable. You can still use <strong>Simulate RFID Scan</strong> or enter the RFID code manually.";
      document.getElementById("cameraPlaceholder").style.display="flex";
      document.getElementById("cameraPlaceholder").textContent="Camera permission unavailable";
    }
  }

  function startBarcodeDetection(){
    stopBarcodeLoopOnly();

    if(!("BarcodeDetector" in window)){
      document.getElementById("scanStatus").innerHTML=
        "Camera is open. Automatic QR/barcode detection is not supported in this browser. Use the demo scan or manual code below.";
      return;
    }

    let detector;

    try{
      detector=new BarcodeDetector({
        formats:["qr_code","code_128","code_39","ean_13","ean_8","data_matrix"]
      });
    }catch(e){
      try{
        detector=new BarcodeDetector();
      }catch(err){
        return;
      }
    }

    const scan=async()=>{
      if(!state.cameraStream)return;

      const video=document.getElementById("cameraVideo");

      if(video && video.readyState>=2){
        try{
          const codes=await detector.detect(video);

          if(codes.length){
            const value=String(codes[0].rawValue||"").trim().toUpperCase();

            if(value){
              handleRFIDCode(value);
              return;
            }
          }
        }catch(e){}
      }

      state.scanLoop=requestAnimationFrame(scan);
    };

    state.scanLoop=requestAnimationFrame(scan);
  }

  function stopBarcodeLoopOnly(){
    if(state.scanLoop){
      cancelAnimationFrame(state.scanLoop);
      state.scanLoop=null;
    }
  }

  function closeScanner(){
    stopBarcodeLoopOnly();

    if(state.cameraStream){
      state.cameraStream.getTracks().forEach(track=>track.stop());
      state.cameraStream=null;
    }

    const video=document.getElementById("cameraVideo");
    if(video)video.srcObject=null;

    document.getElementById("scanModal").style.display="none";
  }

  function simulateRFIDScan(){
    const codes=Object.keys(RFID_PRODUCTS);
    const already=state.cart.filter(i=>i.source==="RFID").map(i=>i.rfid);
    const available=codes.find(c=>!already.includes(c)) || codes[Math.floor(Math.random()*codes.length)];

    handleRFIDCode(available);
  }

  function manualRFIDAdd(){
    const code=document.getElementById("manualRFID").value.trim().toUpperCase();

    if(!code){
      showToast("Enter an RFID code.",true);
      return;
    }

    handleRFIDCode(code);
  }

  function handleRFIDCode(code){
    const productId=RFID_PRODUCTS[code];

    if(!productId){
      const status=document.getElementById("scanStatus");
      if(status)status.innerHTML=`RFID <strong>${esc(code)}</strong> was not found in the demo product registry.`;
      showToast("RFID product not found.",true);
      return;
    }

    const duplicate=state.cart.some(i=>i.source==="RFID" && i.rfid===code);

    if(duplicate){
      showToast("This RFID product is already in your cart.",true);
      return;
    }

    addProductToCart(productId,"RFID",code,1);

    const p=PRODUCTS.find(x=>x.id===productId);

    closeScanner();
    state.screen="cart";
    render();
    showToast(p.name+" scanned and added to cart.");
  }

  window.addEventListener("beforeunload",closeScanner);

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      closeScanner();
      closeProductModal();
    }
  });

  render();
</script>

<script>
  /*
    Mobile layout safeguard:
    The cart automatically switches from 2 columns to 1 column on narrower screens
    while preserving the strict inline-CSS requirement.
  */
  function applyCustomerResponsiveLayout(){
    const isMobile=window.innerWidth<760;

    document.querySelectorAll('div[style*="grid-template-columns:minmax(0,1.6fr)"]').forEach(el=>{
      el.style.gridTemplateColumns=isMobile
        ? "1fr"
        : "minmax(0,1.6fr) minmax(240px,.7fr)";
    });

    document.querySelectorAll('[data-customer-nav-label="true"]').forEach(el=>{
      el.style.display=isMobile?"none":"inline";
    });
  }

  window.addEventListener("resize",applyCustomerResponsiveLayout);

  const originalRender=render;
  render=function(){
    originalRender();
    requestAnimationFrame(applyCustomerResponsiveLayout);
  };

  render();
</script>

</body>
</html>
