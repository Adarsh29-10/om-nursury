<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OM Nursery · Supervisor Workspace V5</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  .erp-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #e1ebe2;border-radius:16px;background:#fff}
  .erp-table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.45}
  .erp-table th{padding:11px 12px;background:#edf5ef;color:#1a4d2a;text-align:left;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #d7e5d9;white-space:nowrap}
  .erp-table td{padding:11px 12px;border-bottom:1px solid #e7eee7;vertical-align:middle;color:#294631}
  .erp-table tbody tr:hover{background:#fbfdfb}
  .erp-inline-select{min-width:132px;width:100%;border:1px solid #d7e5d9;background:#fff;color:#1f402b;border-radius:10px;padding:8px 30px 8px 9px;font-size:11px;font-weight:800;outline:none}
  .erp-inline-select:focus{border-color:#1a4d2a;box-shadow:0 0 0 3px rgba(26,77,42,.08)}
  .erp-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}
  .erp-multi{position:relative}
  .erp-multi summary{list-style:none;cursor:pointer;border:1px solid #dce7dc;background:#fff;border-radius:12px;padding:10px 11px;font-size:11px;font-weight:850;color:#365640;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .erp-multi summary::-webkit-details-marker{display:none}
  .erp-multi[open] summary{border-color:#1a4d2a;box-shadow:0 0 0 3px rgba(26,77,42,.07)}
  .erp-multi-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:80;background:#fff;border:1px solid #dce7dc;border-radius:13px;padding:6px;box-shadow:0 16px 35px rgba(15,58,30,.14);max-height:230px;overflow:auto}
  .erp-check{display:flex;align-items:center;gap:8px;padding:8px 7px;border-radius:9px;font-size:11px;font-weight:750;color:#385540;cursor:pointer}
  .erp-check:hover{background:#f2f7f3}
  .erp-check input{accent-color:#1a4d2a;width:16px;height:16px;margin:0}
  .erp-stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .erp-step{border:1px solid #e1ebe2;background:#fff;border-radius:13px;padding:10px;min-height:56px}
  .erp-step strong{display:block;color:#1a4d2a;font-size:10px;font-weight:950;margin-bottom:3px}
  .erp-step span{font-size:9px;color:#718176;font-weight:700;line-height:1.35}
  .erp-step.active{background:#eef6ef;border-color:#cfe0d2}
  .erp-step.done{background:#f8fbf8}
  .erp-mobile-hint{display:none}
  .erp-breadcrumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px;font-size:11px;font-weight:800;color:#7a887d}
  .erp-breadcrumb button{border:none;background:transparent;color:#1a4d2a;padding:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:900}
  .erp-breadcrumb button:hover{text-decoration:underline}
  .erp-breadcrumb .current{color:#294631;font-weight:900}
  .erp-breadcrumb .sep{color:#a3ada5}
  .erp-po-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0 12px}
  .erp-mobile-filter-toggle{display:none;width:100%;border:0;background:transparent;color:#1a4d2a;padding:0;font-family:inherit;align-items:center;gap:7px;cursor:pointer;text-align:left}
  .erp-mobile-filter-toggle strong{flex:1;font-size:11px;font-weight:900}
  .erp-filter-chevron{font-size:14px;color:#718176}
  @media(max-width:820px){
    .erp-stepper{display:flex;grid-template-columns:none;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:1px 0 3px;scrollbar-width:none}
    .erp-stepper::-webkit-scrollbar{display:none}
    .erp-step{flex:0 0 auto;min-height:0!important;padding:7px 9px!important;border-radius:999px!important;display:flex;align-items:center;white-space:nowrap}
    .erp-step strong{font-size:9px!important;margin:0!important;line-height:1.1}
    .erp-step span{display:none!important}
    .erp-mobile-filter-toggle{display:flex}
    .erp-filter-panel{padding:9px!important;border-radius:13px!important;background:#fff!important}
    .erp-filter-panel .erp-filter-body{display:none;padding-top:9px}
    .erp-filter-panel.mobile-open .erp-filter-body{display:block}
    .erp-filter-grid{grid-template-columns:1fr!important;gap:7px!important}
    .erp-multi summary{padding:9px 10px!important;border-radius:10px!important}
    .erp-page-heading{gap:8px!important;margin-bottom:9px!important}
    .erp-page-heading-icon{width:32px!important;height:32px!important;min-width:32px!important;border-radius:10px!important;font-size:14px!important}
    .erp-page-heading-title{font-size:16px!important}
    .erp-page-heading-sub{display:none!important}
    .erp-inline-help{display:none!important}
    .erp-po-summary{grid-template-columns:1fr 1fr!important;gap:5px!important;margin:7px 0 9px!important}
    section[style*="border-radius:22px"][style*="padding:16px"]{padding:11px!important;border-radius:16px!important;margin-bottom:9px!important}

    .erp-mobile-hint{display:block;font-size:9px;color:#718176;font-weight:800;margin:6px 0 8px}
    .erp-table th,.erp-table td{padding:10px;font-size:11px}
    .erp-table th{font-size:9px}
    .erp-inline-select{min-width:145px}
    .erp-po-summary{grid-template-columns:1fr 1fr}
    .erp-breadcrumb{font-size:10px;gap:5px;margin-bottom:10px}
    .erp-breadcrumb button{font-size:10px}
  }
  @media(max-width:460px){
    .erp-step{padding:7px 8px!important}
    .erp-step strong{font-size:8.5px!important}
    .erp-po-summary{grid-template-columns:1fr 1fr!important}
  }

  /* ===== Reference-style list/table UI ===== */
  .ref-list-page{background:#fff;padding:7px 2px 10px}
  .ref-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 18px}
  .ref-title-wrap{display:flex;align-items:center;gap:11px;min-width:0}
  .ref-title{margin:0;color:#17212b;font-size:31px;line-height:1.1;font-weight:800;letter-spacing:-.035em}
  .ref-count-badge{min-width:39px;height:39px;padding:0 10px;border-radius:12px;background:#eaf6ee;color:#1c7b42;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
  .ref-search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
  .ref-search-box{height:46px;border:1px solid #dce3de;border-radius:13px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 13px;box-sizing:border-box}
  .ref-search-icon{font-size:18px;color:#6b7470;line-height:1}
  .ref-search-box input{width:100%;min-width:0;border:none;outline:none;background:transparent;color:#27322c;font:inherit;font-size:13px;font-weight:500}
  .ref-filter-master{height:46px;border:1px solid #dce3de;border-radius:13px;background:#fff;color:#25332b;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:12px;font-weight:750;cursor:pointer}
  .ref-filter-strip{display:flex;flex-wrap:nowrap;gap:7px;margin:10px 0;width:100%;align-items:stretch}
  .ref-filter-chip{flex:1 1 0;min-width:0;max-width:none;position:relative}
  .ref-filter-chip .erp-multi summary{height:40px;box-sizing:border-box;padding:0 9px;border-radius:10px;font-size:10px;font-weight:700;color:#2d3732;min-width:0;overflow:hidden}
  .ref-filter-chip-icon{font-size:13px;color:#4f5d55;margin-right:4px}
  .ref-result-bar{min-height:48px;border:1px solid #dce3de;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 13px;margin:8px 0 12px;box-sizing:border-box}
  .ref-result-count{font-size:11px;color:#222d27;font-weight:750}
  .ref-clear-btn{border:none;background:transparent;color:#1a7a42;font:inherit;font-size:11px;font-weight:750;cursor:pointer;padding:7px 2px}
  .ref-pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 1px 2px;color:#65716a;font-size:10px}
  .ref-page-size{height:38px;border:1px solid #dce3de;border-radius:10px;background:#fff;color:#27322c;padding:0 10px;font:inherit;font-size:11px}
  .ref-page-controls{display:flex;align-items:center;gap:7px}
  .ref-page-btn{width:38px;height:38px;border:1px solid #dce3de;border-radius:10px;background:#fff;color:#68736d;font:inherit;font-size:14px;font-weight:800}
  .ref-page-btn.active{background:#1c7b42;border-color:#1c7b42;color:#fff}
  .ref-status-select{border-radius:10px!important;font-weight:750!important}
  .ref-table-id{font-size:12px;color:#16723c;font-weight:850;white-space:nowrap}
  .ref-sub{font-size:9px;color:#7d8982;margin-top:3px;line-height:1.35}
  .ref-table-action{border:1px solid #d9e3db;background:#fff;color:#17643a;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}
  .ref-po-progress{display:flex;gap:6px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:8px 0 11px}
  .ref-po-progress::-webkit-scrollbar{display:none}
  .ref-po-progress span{flex:0 0 auto;border:1px solid #dfe8e0;background:#fff;color:#65736a;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:800;white-space:nowrap}
  .ref-po-progress span.active{background:#eaf6ee;border-color:#cee3d3;color:#17643a}

  @media(max-width:820px){
    .ref-list-page{padding:12px 4px 20px}
    .ref-title-row{margin:4px 0 15px}
    .ref-title{font-size:27px}
    .ref-count-badge{min-width:36px;height:36px;border-radius:11px;font-size:13px}
    .ref-search-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}
    .ref-search-box,.ref-filter-master{height:45px}
    .ref-filter-master{padding:0 13px}
    .ref-filter-strip{gap:5px;margin:8px 0;flex-wrap:nowrap}
    .ref-filter-chip{flex:1 1 0;min-width:0;max-width:none}
    .ref-filter-chip .erp-multi summary{height:38px;padding:0 7px;font-size:9px;border-radius:9px}
    .ref-filter-chip-icon{font-size:11px;margin-right:1px}
    .ref-result-bar{min-height:45px;margin:7px 0 10px}
    .erp-table-wrap{border-radius:13px}
    .erp-table th{background:#f2f6f3;color:#526158;text-transform:none;letter-spacing:0;font-size:9px;font-weight:800}
    .erp-table td{font-size:10px}
    .ref-pagination{padding-top:12px}
  }
  @media(max-width:540px){
    .ref-title{font-size:25px}
    .ref-search-box input{font-size:12px}
    .ref-filter-master{font-size:11px;padding:0 12px}
    .ref-filter-chip{flex:1 1 0;min-width:0}
    .ref-filter-chip .erp-multi summary{height:36px;font-size:8.5px;padding:0 6px}
    .ref-filter-chip-icon{display:none}
    .ref-result-bar{padding:0 11px}
  }

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style id="white-workspace-compact-filter-update">
  html,body,#app{background:#fff!important;}
  .ref-list-page{background:#fff!important;}
  @media(max-width:540px){
    .ref-filter-strip{display:flex!important;flex-wrap:nowrap!important;gap:4px!important;width:100%!important;}
    .ref-filter-chip{flex:1 1 0!important;min-width:0!important;width:auto!important;}
    .ref-filter-chip .erp-multi summary{height:35px!important;padding:0 5px!important;font-size:8px!important;border-radius:8px!important;}
    .ref-filter-chip .erp-multi summary>span:first-child{gap:2px!important;min-width:0!important;}
    .ref-filter-chip-icon{display:none!important;}
  }
</style>

<style id="mobile-density-update">
  /* Mobile-only density pass: keep desktop/laptop unchanged */
  @media(max-width:700px){
    /* Denser tables across the complete supervisor workspace */
    .erp-table-wrap{border-radius:10px!important;}
    .erp-table-wrap .erp-table,
    div[style*="overflow-x:auto"] > table{
      min-width:640px!important;
      font-size:9px!important;
      line-height:1.22!important;
    }
    .erp-table th,
    .erp-table td,
    div[style*="overflow-x:auto"] > table th,
    div[style*="overflow-x:auto"] > table td{
      padding:6px 7px!important;
      font-size:9px!important;
      line-height:1.22!important;
    }
    .erp-table th,
    div[style*="overflow-x:auto"] > table th{
      font-size:8px!important;
      letter-spacing:0!important;
      white-space:nowrap!important;
    }
    .erp-table td[style*="min-width"],
    .erp-table th[style*="min-width"]{min-width:78px!important;}
    .erp-table td:first-child,
    .erp-table th:first-child{padding-left:7px!important;}
    .erp-table td:last-child,
    .erp-table th:last-child{padding-right:7px!important;}
    .ref-table-id{font-size:10px!important;}
    .ref-sub{font-size:7.5px!important;margin-top:2px!important;line-height:1.2!important;}
    .ref-table-action{padding:5px 7px!important;border-radius:7px!important;font-size:8px!important;}
    .erp-inline-select,
    .ref-status-select{
      min-width:92px!important;
      width:auto!important;
      max-width:112px!important;
      padding:5px 20px 5px 6px!important;
      border-radius:7px!important;
      font-size:8.5px!important;
      line-height:1.15!important;
    }
    .erp-table input[type="number"],
    .erp-table input[type="text"],
    .erp-table select{
      min-width:0!important;
      max-width:112px!important;
      padding-top:5px!important;
      padding-bottom:5px!important;
      font-size:8.5px!important;
    }
    .erp-table input[type="number"]{width:64px!important;}
    .erp-table span[style*="border-radius:999px"],
    .erp-table span[style*="border-radius:40px"]{
      padding:4px 6px!important;
      font-size:7.5px!important;
      white-space:nowrap!important;
    }

    /* Compact list header / search / filter area */
    .ref-list-page{padding-top:5px!important;}
    .ref-title-row{margin:2px 0 9px!important;}
    .ref-title{font-size:23px!important;}
    .ref-count-badge{min-width:30px!important;height:30px!important;padding:0 8px!important;border-radius:9px!important;font-size:11px!important;}
    .ref-search-row{gap:5px!important;}
    .ref-search-box,
    .ref-filter-master{height:36px!important;border-radius:9px!important;}
    .ref-search-box{padding:0 9px!important;gap:7px!important;}
    .ref-search-icon{font-size:14px!important;}
    .ref-search-box input{font-size:10.5px!important;}
    .ref-filter-master{padding:0 9px!important;font-size:9.5px!important;gap:5px!important;}
    .ref-filter-strip{gap:3px!important;margin:5px 0!important;}
    .ref-filter-chip .erp-multi summary{
      height:29px!important;
      min-height:29px!important;
      padding:0 4px!important;
      border-radius:7px!important;
      font-size:7.5px!important;
      line-height:1!important;
    }
    .ref-result-bar{
      min-height:35px!important;
      height:35px!important;
      padding:0 9px!important;
      margin:4px 0 7px!important;
      border-radius:9px!important;
    }
    .ref-result-count,.ref-clear-btn{font-size:9px!important;}
    .ref-clear-btn{padding:4px 0!important;}
    .erp-filter-panel{padding:6px!important;border-radius:9px!important;}
    .erp-mobile-filter-toggle strong{font-size:9px!important;}
    .erp-filter-panel .erp-filter-body{padding-top:5px!important;}
    .erp-filter-grid{gap:4px!important;}
    .erp-multi summary{padding:7px 8px!important;font-size:9px!important;border-radius:8px!important;}
    .erp-check{padding:6px!important;font-size:9px!important;}
    .erp-check input{width:13px!important;height:13px!important;}
    .ref-pagination{padding-top:8px!important;gap:7px!important;}
    .ref-page-size{height:32px!important;border-radius:8px!important;font-size:9px!important;padding:0 7px!important;}
    .ref-page-btn{width:32px!important;height:32px!important;border-radius:8px!important;font-size:11px!important;}

    /* Compact PO child-screen controls too */
    .ref-po-progress{gap:4px!important;margin:5px 0 7px!important;}
    .ref-po-progress span{padding:5px 7px!important;font-size:7.5px!important;}
    .erp-po-summary{gap:4px!important;margin:5px 0 7px!important;}
    .erp-mobile-hint{font-size:7.5px!important;margin:4px 0 5px!important;}
  }

  @media(max-width:420px){
    .erp-table-wrap .erp-table,
    div[style*="overflow-x:auto"] > table{min-width:590px!important;}
    .erp-table th,.erp-table td,
    div[style*="overflow-x:auto"] > table th,
    div[style*="overflow-x:auto"] > table td{padding:5px 6px!important;}
    .erp-table td[style*="min-width"],
    .erp-table th[style*="min-width"]{min-width:70px!important;}
    .erp-inline-select,.ref-status-select{min-width:84px!important;max-width:102px!important;font-size:8px!important;}
    .ref-filter-chip .erp-multi summary{height:27px!important;min-height:27px!important;font-size:7px!important;padding:0 3px!important;}
    .ref-search-box,.ref-filter-master{height:34px!important;}
    .ref-result-bar{height:33px!important;min-height:33px!important;}
  }
</style>

<style id="table-height-separation-update">
  /* Restore comfortable vertical table rhythm while keeping compact mobile widths */

  @media(max-width:700px){

</style>

<style id="supervisor-v5-workorders-responsive">
  /* ===== Supervisor V5 · Work Orders visual match ===== */

  .wo-mobile-list,.wo-mobile-heading{display:none;}

  .wo-filter-master{height:46px;border:1px solid #dce3de;border-radius:13px;background:#fff;color:#25332b;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap;}
  .wo-filter-master svg{width:17px;height:17px;}

  .wo-mobile-card{

    border-radius:14px;
    background:#fff;
    box-shadow:0 4px 14px rgba(18,39,25,.055);
    padding:15px 15px 14px;
    box-sizing:border-box;
  }
  .wo-mobile-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}

function pill(text,tone='green'){const c=tone==='red'?['#ffe3e6','#b42331']:tone==='gold'?['#fff4d8','#7a5c00']:tone==='blue'?['#e6f3ff','#1363a5']:['#e8f5ea','#17643a'];return `<span style="display:inline-flex;padding:5px 9px;border-radius:999px;background:${c[0]};color:${c[1]};font-size:10px;font-weight:900;white-space:nowrap;">${esc(text)}</span>`}function statusPill(s){const red=['Halted','Attention','Failed','Variance'].some(x=>String(s).includes(x)),blue=['In-Progress','In Transit','Driver Assigned','Ready to Dispatch','Ready for Pickup'].some(x=>String(s).includes(x)),gold=['Pending','Partially','Assigned','On Hold'].some(x=>String(s).includes(x));return pill(s,red?'red':blue?'blue':gold?'gold':'green')}function materialStatusBadge(s){
  const v=String(s||'');
  const x=v.toLowerCase();
  let tone='gray';
  if(x.includes('fail')||x.includes('reject')||x.includes('blocked'))tone='red';
  else if(x==='allocated'||x.includes('success')||x.includes('complete'))tone='green';
  else if(x.includes('submitted')||x.includes('progress'))tone='blue';
  else if(x.includes('pending')||x.includes('partial')||x.includes('waiting'))tone='orange';
  else if(x.includes('not required')||x.includes('inactive')||x.includes('none'))tone='gray';
  return `<span class="desktop-material-badge ${tone}">${esc(v)}</span>`;
}
function deliveryStatusBadge(s){
  const v=String(s||'');
  const x=v.toLowerCase();
  let tone='gray';
  if(x.includes('fail')||x.includes('cancel')||x.includes('variance'))tone='red';
  else if(x.includes('delivered')||x.includes('complete'))tone='green';
  else if(x.includes('driver assigned')||x.includes('in transit')||x.includes('ready for pickup'))tone='blue';
  else if(x.includes('pending')||x.includes('waiting')||x.includes('not scheduled'))tone='orange';
  return `<span class="ops-readonly-badge ${tone}">${esc(v)}</span>`;
}

  if(state.view==='workorders')setTimeout(applyWorkOrderFiltersDom,0);

}

function filterSummary(values,emptyLabel){
  if(!values || !values.length)return emptyLabel;
  if(values.length===1)return values[0];
  return values.length+' selected';
}

function multiFilter(scope,key,label,options,emptyLabel){
  const selected=state[scope][key]||[];
  return `
    <div>
      <div style="font-size:9px;color:#758379;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px 2px;">${label}</div>
      <details class="erp-multi">
        <summary>
          <span id="${scope}-${key}-summary">${esc(filterSummary(selected,emptyLabel))}</span>
          <span style="color:#1a4d2a;font-size:10px;">▾</span>
        </summary>
        <div class="erp-multi-menu">
          ${options.map(value=>`
            <label class="erp-check">
              <input type="checkbox" ${selected.includes(value)?'checked':''}
                onchange="toggleListFilter('${scope}','${key}','${value}',this.checked,'${emptyLabel}')">
              <span>${esc(value)}</span>
            </label>
          `).join('')}
        </div>
      </details>
    </div>
  `;
}

function compactMultiFilter(scope,key,label,icon,options){
  const selected=state[scope][key]||[];
  const summaryText=!selected.length?label:(selected.length===1?selected[0]:selected.length+' selected');
  return `
    <div class="ref-filter-chip">
      <details class="erp-multi">
        <summary>
          <span style="display:flex;align-items:center;gap:5px;min-width:0;"><span class="ref-filter-chip-icon">${icon}</span><span id="${scope}-${key}-summary" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(summaryText)}</span></span>
          <span style="color:#647169;font-size:10px;">⌄</span>
        </summary>
        <div class="erp-multi-menu">
          ${options.map(value=>`
            <label class="erp-check">
              <input type="checkbox" ${selected.includes(value)?'checked':''}
                onchange="toggleCompactFilter('${scope}','${key}','${value}',this.checked,'${label}')">
              <span>${esc(value)}</span>
            </label>
          `).join('')}
        </div>
      </details>
    </div>`;
}

function toggleCompactFilter(scope,key,value,checked,label){
  const list=state[scope][key]||[];
  state[scope][key]=checked?[...new Set([...list,value])]:list.filter(x=>x!==value);
  const summary=document.getElementById(scope+'-'+key+'-summary');
  if(summary){
    const selected=state[scope][key];
    summary.textContent=!selected.length?label:(selected.length===1?selected[0]:selected.length+' selected');
  }
  if(scope==='woFilters')applyWorkOrderFiltersDom();
  if(scope==='b2bFilters')applyB2BFiltersDom();
  if(scope==='poFilters')applyPOFiltersDom();
}

function toggleReferenceFilterStrip(id){
  const el=document.getElementById(id);
  if(!el)return;
  const opening=!el.classList.contains('filter-strip-open');
  el.classList.toggle('filter-strip-open',opening);
  el.setAttribute('aria-hidden',opening?'false':'true');
  const page=el.closest('.wo-v5-page,.b2b-v5-page,.po-v5-page');
  if(page)page.classList.toggle('filters-open',opening);
}

function toggleMobileListView(scope){
  if(window.innerWidth>=900)return;
  const current=state.mobileListView[scope]||'cards';
  state.mobileListView[scope]=current==='cards'?'table':'cards';
  render();
}

function mobileViewToggle(scope){
  const current=state.mobileListView[scope]||'cards';
  const next=current==='cards'?'Table':'Cards';
  const icon=current==='cards'
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v14H4zM4 10h16M9 5v14M15 5v14"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>`;
  return `<button class="mobile-view-toggle" onclick="toggleMobileListView('${scope}')" aria-label="Switch to ${next} view">${icon}<span>${next}</span></button>`;
}

function referencePagination(count,label){
  return `<div class="ref-pagination"><span>Showing ${count} of ${count} ${label}</span><div style="display:flex;align-items:center;gap:8px;"><select class="ref-page-size"><option>10 / page</option><option>25 / page</option><option>50 / page</option></select><div class="ref-page-controls"><button class="ref-page-btn" disabled>‹</button><button class="ref-page-btn active">1</button><button class="ref-page-btn" disabled>›</button></div></div></div>`;
}

function toggleListFilter(scope,key,value,checked,emptyLabel){
  const list=state[scope][key]||[];
  state[scope][key]=checked
    ? [...new Set([...list,value])]
    : list.filter(x=>x!==value);

  const summary=document.getElementById(scope+'-'+key+'-summary');
  if(summary)summary.textContent=filterSummary(state[scope][key],emptyLabel);

  if(scope==='woFilters')applyWorkOrderFiltersDom();
  if(scope==='b2bFilters')applyB2BFiltersDom();
  if(scope==='poFilters')applyPOFiltersDom();
}

function updateWorkOrderInline(id,field,value){
  const w=workOrders.find(x=>x.id===id);
  if(!w)return;

  w[field]=value;

  document.querySelectorAll('.wo-data-row[data-wo-id="'+id+'"]').forEach(row=>{
    if(field==='status')row.dataset.status=value;
    if(field==='allocationStatus')row.dataset.allocation=value;
  });

  document.querySelectorAll('[data-wo-bind="'+id+'-'+field+'"]').forEach(el=>{
    if(el.value!==value)el.value=value;
  });

  if(field==='status' && value==='Completed'){
    w.efficiency=Math.max(Number(w.efficiency||0),90);
    w.message='Work completed by supervisor. Final record updated from the Work Order screen.';
  }
  if(field==='status' && value==='Halted'){
    w.message='Work halted by supervisor. Review reason in work-order details.';
  }

  applyWorkOrderFiltersDom();
  showToast(id+' '+(field==='status'?'work status':'material status')+' updated.');
}

function applyWorkOrderFiltersDom(){
  const f=state.woFilters;

  document.querySelectorAll('.wo-data-row').forEach(row=>{
    const rowPlants=(row.dataset.plants||'').split('|').filter(Boolean);
    const matchStatus=!f.status.length || f.status.includes(row.dataset.status);
    const matchAllocation=!f.allocation.length || f.allocation.includes(row.dataset.allocation);
    const matchFarm=!f.farm.length || f.farm.includes(row.dataset.farm);
    const matchPlant=!f.plant.length || f.plant.some(p=>rowPlants.includes(p));
    const q=(f.search||'').trim().toLowerCase();
    const matchSearch=!q || (row.dataset.search||'').includes(q);
    const show=matchStatus&&matchAllocation&&matchFarm&&matchPlant&&matchSearch;
    row.style.display=show?'':'none';
  });

  const mobileMode=window.innerWidth<900;
  const selector=mobileMode
    ? (state.mobileListView.workorders==='table'?'.wo-desktop-table .wo-data-row':'.wo-mobile-list .wo-data-row')
    : '.wo-desktop-table .wo-data-row';

  const visible=[...document.querySelectorAll(selector)]
    .filter(row=>row.style.display!=='none').length;

  const count=document.getElementById('woVisibleCount');
  if(count)count.textContent=visible+' work order'+(visible===1?'':'s');
}

function clearWorkOrderFilters(){
  state.woFilters={status:[],allocation:[],farm:[],plant:[],search:''};
  render();
  showToast('Work-order filters cleared.');
}

function toggleMobileFilters(buttonEl){
  const panel=buttonEl.closest('.erp-filter-panel');
  if(!panel)return;
  panel.classList.toggle('mobile-open');
  const chevron=buttonEl.querySelector('.erp-filter-chevron');
  if(chevron)chevron.textContent=panel.classList.contains('mobile-open')?'⌃':'⌄';
}

      ${modalInfoCard('Work Order',w.id,'🧾')}
      ${modalInfoCard('Plants',w.plants.join(', '),'🌿')}

    ${modalFooter([
      modalAction('Save Status',`saveWOStatus('${id}')`,'green','width:100%;'),
      modalAction('Cancel','closeModal()','outline','width:100%;')
    ])}`;

  openModal(`<div style="background:transparent;border-radius:28px;overflow:visible;">${modalHero('Update Work Order Status',w.id,esc(w.plants.join(', ')),modalBadge(w.status))}${modalSurface(body)}</div>`,'650px');
}
function saveWOStatus(id){const w=workOrders.find(x=>x.id===id);w.status=document.getElementById('woStatusNew').value;w.message=document.getElementById('woMessageNew').value.trim();w.efficiency=Math.max(0,Math.min(100,Number(document.getElementById('woEfficiencyNew').value||0)));closeModal();render();showToast(id+' work status updated.')}
function suggestedReq(w){
  const q=w.quantity;
  const adult=w.stages.includes('Adult');
  const child=w.stages.includes('Child');

  return {
    'RM-001':Math.ceil(q/(adult?8:child?10:12)),
    'RM-002':w.stages.includes('Sapling')?Math.ceil(q*.65):0,
    'RM-003':child?Math.ceil(q*.55):0,
    'RM-004':adult?Math.ceil(q*.55):0,
    'RM-005':Math.max(1,Math.ceil(q/50)),
    'RM-006':Math.ceil(q/28),
    'RM-007':Math.ceil(q*.42),
    'RM-008':q
  };
}

function openAllocation(id){
  const w=workOrders.find(x=>x.id===id);
  if(!w)return;

  if(!state.allocationDraft[id]) state.allocationDraft[id]=suggestedReq(w);
  const d=state.allocationDraft[id];

  const list = rawMaterials.map(m=>{
    const qty=Number(d[m.id]||0);
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #e5ece6;border-radius:18px;padding:14px 15px;background:#fff;">
      <div style="min-width:0;">
        <div style="font-size:14px;color:#173020;font-weight:950;">${m.name}</div>
        <div style="font-size:11px;color:#78867b;font-weight:800;margin-top:5px;">${m.id} • Unit: ${m.unit}</div>
      </div>
      <div style="width:128px;flex:0 0 128px;">
        <div style="font-size:10px;color:#748176;font-weight:900;margin-bottom:6px;text-align:center;">REQUIRED QTY</div>
        <input id="req-${m.id}" type="number" min="0" value="${qty}" inputmode="numeric" style="width:100%;box-sizing:border-box;border:1px solid #d9e4db;border-radius:14px;padding:11px 10px;text-align:center;font-size:14px;font-weight:900;color:#173020;background:#fff;outline:none;">
      </div>
    </div>`;
  }).join('');

  const body = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;">
      ${modalInfoCard('Farm / Block',w.farm+' • '+w.block,'📍')}
      ${modalInfoCard('Plants',w.plants.join(', '),'🌿')}
      ${modalInfoCard('Quantity',w.quantity+' plants','#')}
    </div>
    ${modalSectionTitle('🧾','Required Materials')}
    <div style="display:grid;gap:10px;">${list}</div>
    ${modalFooter([
      modalAction('Submit Material Requirement',`saveAllocation('${id}')`,'green','width:100%;'),
      modalAction('Close','closeModal()','outline','width:100%;')
    ])}`;

  openModal(`<div style="background:transparent;border-radius:28px;overflow:visible;">${modalHero('Material Allocation',id,`${esc(w.farm)} • ${esc(w.block)} • ${esc(w.plants.join(', '))} • ${w.quantity} plants`,modalBadge(w.allocationStatus))}${modalSurface(body)}</div>`,'800px');
}
function syncAllocationInputs(id){
  const d={};

  rawMaterials.forEach(m=>{
    d[m.id]=Math.max(
      0,
      Number(document.getElementById('req-'+m.id)?.value||0)
    );
  });

  state.allocationDraft[id]=d;
  return d;
}

function saveAllocation(id){
  const w=workOrders.find(x=>x.id===id);
  const d=syncAllocationInputs(id);

  const selected=rawMaterials.filter(
    m=>Number(d[m.id]||0)>0
  );

  if(!selected.length){
    showToast('Enter at least one material quantity before submitting.',true);
    return;
  }

  w.allocationStatus='Requirement Submitted';
  w.materialRequirementUpdatedAt=nowText();

  closeModal();
  render();

  showToast(
    id+' material requirement submitted to HO / Admin.'
  );
}

function rfidIcon(name){
  const icons={

    trash:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg>`,
    scan:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5a1 1 0 0 0-1 1v3M16 4h3a1 1 0 0 1 1 1v3M8 20H5a1 1 0 0 1-1-1v-3M16 20h3a1 1 0 0 0 1-1v-3"/><path d="M9 9h6v6H9z"/></svg>`,
    cube:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>`,
    check:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>`,
    user:`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M6 20c.8-4 3-6 6-6s5.2 2 6 6"/></svg>`,
    tag:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13l-7 7-9-9V4h7l9 9z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>`,

  };
  return icons[name]||'';
}

  // Keep the default selector compact on mobile: 3 rows × 3 tags.

  const initialVisibleCount=9;
  const visible=state.rfidShowAll?usable:usable.slice(0,initialVisibleCount);

  return `

        </div>
      </div>

      ${usable.length>initialVisibleCount?`<button class="rfid-v5-show-more ${state.rfidShowAll?'open':''}" onclick="toggleRFIDShowMore()">${rfidIcon('down')}<span>${state.rfidShowAll?'Show less':'Show more'}</span></button>`:''}

    <div class="rfid-v5-card">
      <div class="rfid-v5-step-head">
        <div class="rfid-v5-step-title"><span class="rfid-v5-step-num">2</span><span>Inventory Details</span></div>

function latestRFIDInventoryUpdate(){
  const ind=state.individualLogs[0];
  const grp=state.groupLogs[0];
  if(!ind && !grp)return null;
  if(ind && !grp)return {...ind,type:'Individual'};
  if(grp && !ind)return {...grp,type:'Group'};
  // Both arrays are newest-first; use the latest action count as a stable prototype tie-breaker.
  const indNo=Number(String(ind.id||'').match(/(\d+)$/)?.[1]||0);
  const grpNo=Number(String(grp.id||'').match(/(\d+)$/)?.[1]||0);
  return indNo>=grpNo?{...ind,type:'Individual'}:{...grp,type:'Group'};
}

function updateB2BInline(id,field,value){
  const o=b2bOrders.find(x=>x.id===id);
  if(!o)return;

  o[field]=value;

  if(field==='driver'){
    if(value && o.deliveryStatus==='Pending Assignment')o.deliveryStatus='Driver Assigned';
    if(!value)o.deliveryStatus='Pending Assignment';
  }

  if(field==='deliveryStatus'){
    if(value==='Delivered')o.orderStatus='Completed';
    if(value==='Failed')o.orderStatus='Failed';
    if(['Driver Assigned','Ready for Pickup','In Transit'].includes(value) && o.orderStatus==='Completed')o.orderStatus='In Progress';
  }

  document.querySelectorAll('[data-b2b-bind="'+id+'-orderStatus"]').forEach(el=>{
    el.value=o.orderStatus;
    el.dataset.value=o.orderStatus;
  });
  document.querySelectorAll('[data-b2b-bind="'+id+'-deliveryStatus"]').forEach(el=>{
    el.value=o.deliveryStatus;
    el.dataset.value=o.deliveryStatus;
  });
  document.querySelectorAll('[data-b2b-bind="'+id+'-driver"]').forEach(el=>{
    el.value=o.driver||'';
  });

  document.querySelectorAll('.b2b-data-row[data-b2b-id="'+id+'"]').forEach(row=>{
    row.dataset.order=o.orderStatus;
    row.dataset.delivery=o.deliveryStatus;
    row.dataset.driver=o.driver||'Not Assigned';
    row.dataset.farm=o.farm;
  });

  applyB2BFiltersDom();
  showToast(id+' updated.');
}

function applyB2BFiltersDom(){
  const f=state.b2bFilters;
  document.querySelectorAll('.b2b-data-row').forEach(row=>{
    const matchOrder=!f.order.length || f.order.includes(row.dataset.order);
    const matchDelivery=!f.delivery.length || f.delivery.includes(row.dataset.delivery);
    const matchDriver=!f.driver.length || f.driver.includes(row.dataset.driver);
    const matchFarm=!f.farm.length || f.farm.includes(row.dataset.farm);
    const q=(f.search||'').trim().toLowerCase();
    const matchSearch=!q || (row.dataset.search||'').includes(q);
    const show=matchOrder&&matchDelivery&&matchDriver&&matchFarm&&matchSearch;
    row.style.display=show?'':'none';
  });

  const isMobile=window.innerWidth<900;
  const b2bSelector=isMobile
    ? (state.mobileListView.b2b==='table'?'.b2b-desktop-table .b2b-data-row':'.b2b-mobile-list .b2b-data-row')
    : '.b2b-desktop-table .b2b-data-row';
  const visible=[...document.querySelectorAll(b2bSelector)]
    .filter(row=>row.style.display!=='none').length;
  const count=document.getElementById('b2bVisibleCount');
  if(count)count.textContent=visible+' order'+(visible===1?'':'s');
}

function savePlantDetails(code){
  const d=plantDatabase[code];
  if(!d)return;

  const name=document.getElementById('editPlantName')?.value.trim();
  const healthScore=Number(document.getElementById('editHealthScore')?.value||0);
  if(!name){showToast('Plant name is required.',true);return;}
  if(!Number.isFinite(healthScore)||healthScore<0||healthScore>100){showToast('Health score must be between 0 and 100.',true);return;}

  d.name=name;
  d.botanicalName=document.getElementById('editBotanical')?.value.trim()||'—';
  d.farm=document.getElementById('editFarm')?.value||d.farm;
  d.block=document.getElementById('editBlock')?.value.trim()||'—';
  d.batch=document.getElementById('editBatch')?.value.trim()||'—';
  d.row=document.getElementById('editRow')?.value.trim()||'—';
  d.stage=document.getElementById('editStage')?.value||d.stage;
  d.height=document.getElementById('editHeight')?.value.trim()||'—';
  d.width=document.getElementById('editWidth')?.value.trim()||'—';
  d.age=document.getElementById('editAge')?.value.trim()||'—';
  d.container=document.getElementById('editContainer')?.value.trim()||'—';
  d.plantingDate=document.getElementById('editPlantingDate')?.value.trim()||'—';
  d.propagation=document.getElementById('editPropagation')?.value.trim()||'—';
  d.grade=document.getElementById('editGrade')?.value.trim()||'—';
  d.sellable=document.getElementById('editSellable')?.value.trim()||'—';
  d.health=document.getElementById('editHealth')?.value.trim()||'—';
  d.healthScore=Math.round(healthScore);
  d.moisture=document.getElementById('editMoisture')?.value.trim()||'—';
  d.fertilisation=document.getElementById('editFertilisation')?.value.trim()||'—';
  d.pruning=document.getElementById('editPruning')?.value.trim()||'—';
  d.pest=document.getElementById('editPest')?.value.trim()||'—';
  d.nextAction=document.getElementById('editNextAction')?.value.trim()||'—';
  d.owner=document.getElementById('editOwner')?.value.trim()||'—';
  d.updatedAt=nowText();

  render();
  openIndividualPlantModal(code);
  showToast(code+' plant details updated.');
}

function poStageFor(p){
  if(p.status==='Received')return 4;
  if(p.status==='Partially Received' || p.status==='Variance Review' || p.status==='Ready to Complete')return 3;
  return Math.max(1,state.poReceiptStage||1);

function previewPOVariance(poId){
  const p=purchaseOrders.find(x=>x.id===poId);
  if(!p)return;

  p.items.forEach(i=>{
    const input=document.getElementById('recv-'+i.id);
    const el=document.getElementById('short-'+i.id);
    if(!input || !el)return;
    if(input.value===''){
      el.textContent='—';
      el.style.color='#7b897f';
      return;
    }
    const r=Math.max(0,Number(input.value));
    const short=Math.max(0,Number(i.requested||0)-r);
    el.textContent=short;
    el.style.color=short>0?'#b42331':'#1a4d2a';
  });
}

function submitPOReceiptModern(){
  const p=purchaseOrders.find(x=>x.id===state.selectedPO);
  if(!p)return;

  let invalid=false;
  let missing=false;
  const submitted=[];

  p.items.forEach(i=>{
    const receivedEl=document.getElementById('recv-'+i.id);
    const damagedEl=document.getElementById('dam-'+i.id);
    const receivedRaw=receivedEl?.value ?? '';
    const damagedRaw=damagedEl?.value ?? '';

    if(receivedRaw==='' || damagedRaw===''){
      missing=true;
      return;
    }

    const received=Math.max(0,Number(receivedRaw));
    const damaged=Math.max(0,Number(damagedRaw));

    if(received>i.requested || damaged>received)invalid=true;
    submitted.push({item:i,received,damaged});
  });

  if(missing){
    showToast('Enter Received and Damaged quantity for every PO line. Enter 0 manually where applicable.',true);
    return;
  }

  if(invalid){
    showToast('Received cannot exceed ordered quantity, and damaged cannot exceed received quantity.',true);
    return;
  }

  submitted.forEach(x=>{
    x.item.received=x.received;
    x.item.damaged=x.damaged;
  });

  p.comment=document.getElementById('poComment')?.value.trim()||'';
  const short=totalShort(p);
  p.status=short>0?'Partially Received':'Ready to Complete';
  state.poReceiptStage=3;
  render();
  showToast(p.id+' receipt data saved. Variance review is now available.');
}

function renderPOModernVariance(p){
  const req=totalRequested(p);
  const rec=totalReceived(p);
  const dam=totalDamaged(p);
  const sh=totalShort(p);
  const canComplete=sh===0 && p.status!=='Received';

  return `
    <div style="border:1px solid #dfe9df;border-radius:15px;background:#f8fbf8;padding:11px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:9px;">
        <div>
          <div style="font-size:13px;color:#1a4d2a;font-weight:950;">Receipt Variance Review</div>
          <div style="font-size:9px;color:#7b897f;margin-top:3px;">Review exceptions before completing the receipt.</div>
        </div>
        ${sh>0||dam>0?pill('Variance Found','red'):pill('Quantities Matched')}
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;margin-bottom:9px;">
        ${detail('Ordered',req)}
        ${detail('Received',rec)}
        ${detail('Short',sh)}
        ${detail('Damaged',dam)}
      </div>

      <div class="erp-table-wrap">
        <table class="erp-table" style="min-width:650px;">
          <thead><tr><th>Item</th><th>Ordered</th><th>Received</th><th>Short</th><th>Damaged</th><th>Result</th></tr></thead>
          <tbody>
            ${p.items.map(i=>{
              const short=Math.max(0,i.requested-i.received);
              const issue=short>0||i.damaged>0;
              return `
                <tr>
                  <td><strong>${esc(i.name)}</strong></td>
                  <td>${i.requested}</td>
                  <td>${i.received}</td>
                  <td style="color:${short>0?'#b42331':'#294631'};font-weight:900;">${short}</td>
                  <td style="color:${i.damaged>0?'#b42331':'#294631'};font-weight:900;">${i.damaged}</td>
                  <td>${issue?pill('Variance','red'):pill('Matched')}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>

      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;">
        ${p.status==='Received'
          ? pill('Receipt Completed')
          : canComplete
            ? button('Complete Receipt',`completePOReceipt('${p.id}')`,'green','padding:10px 14px;font-size:10px;')
            : button('Notify Head Of Operations',"showToast('Head Of Operations informed about the receipt variance.')",'gold','padding:10px 14px;font-size:10px;')
        }
      </div>
    </div>
  `;
}

function completePOReceipt(id){
  const p=purchaseOrders.find(x=>x.id===id);
  if(!p)return;

  if(totalShort(p)>0){
    showToast('Receipt cannot be completed while ordered quantity is still short.',true);
    return;
  }

  p.status='Received';
  state.poReceiptStage=4;
  render();
  showToast(id+' receipt completed and stock validated.');
}

    const items=p.items.map(i=>`<div class="mobile-item-row"><div><strong>${esc(i.name)}</strong><span>${esc(i.category)}</span></div><div class="qty">${i.requested} ordered</div></div>`).join('');

      ${modalInfoCard('Farm',p.farm,'📍')}
      ${modalInfoCard('Expected Delivery',p.expectedDelivery,'📅')}

    ${modalSectionTitle('📋','Purchase Order Information')}

        <table style="width:100%;min-width:560px;border-collapse:collapse;font-size:13px;">
          <thead><tr style="background:#fbfdfb;color:#617366;text-align:left;">${['Item','Category','Ordered Qty'].map(h=>`<th style="padding:8px 10px;font-weight:900;border-top:1px solid #edf1ee;">${h}</th>`).join('')}</tr></thead>
          <tbody>${p.items.map(i=>`<tr><td style="padding:9px 10px;border-top:1px solid #edf1ee;font-weight:900;color:#173020;">${esc(i.name)}</td><td style="padding:9px 10px;border-top:1px solid #edf1ee;color:#46584a;">${esc(i.category)}</td><td style="padding:9px 10px;border-top:1px solid #edf1ee;font-weight:900;color:#173020;">${i.requested}</td></tr>`).join('')}</tbody>

  const buttons=[];
  if(!state.amountsUnlocked) buttons.push(modalAction('View PO Amount','closeModal();openAmountAccess()','gold','width:100%;'));
  buttons.push(modalAction('Close','closeModal()','outline','width:100%;'));

  openModal(`<div style="background:transparent;border-radius:28px;overflow:visible;">${modalHero('Purchase Order',esc(p.id),esc(p.vendor.name),modalBadge(p.status))}${modalSurface(summary + info + items + modalFooter(buttons))}</div>`,'860px');
}
function renderPODetails(p){return `${headerBlock('Purchase Order Details',`${p.id} · ${p.requisitionNo} · ${p.vendor.name}`,'🧾')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px;">${detail('Farm',p.farm)}${detail('Order Date',p.orderDate)}${detail('Expected Delivery',p.expectedDelivery)}${detail('PO Amount',state.amountsUnlocked?money(p.amount):'₹••••••')}</div><div style="display:flex;gap:6px;margin-top:8px;">${button(state.amountsUnlocked?'Amount Unlocked':'View PO Amount','openAmountAccess()','gold')}</div><div style="margin-top:10px;padding:10px;border:1px solid #e2ebe3;border-radius:12px;background:#f8fbf8;"><div style="font-size:12px;color:#1a4d2a;font-weight:950;">Vendor Details</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:6px;">${detail('Vendor',p.vendor.name)}${detail('Location',p.vendor.location)}${detail('GST',p.vendor.gst)}${detail('Contact',p.vendor.contact)}</div></div><div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px;">${p.items.map(i=>`<div style="border:1px solid #e2ebe3;border-radius:11px;padding:9px;background:#fff;"><div style="font-size:12px;color:#1a4d2a;font-weight:950;">${i.name}</div><div style="font-size:10px;color:#829085;margin-top:2px;">${i.category}</div><div style="font-size:11px;margin-top:6px;">Requested <strong>${i.requested}</strong> · Received <strong>${i.received}</strong> · Damaged <strong style="color:#b42331;">${i.damaged}</strong></div></div>`).join('')}</div>`}
function openAmountAccess(){
  const body = `
    <div style="display:grid;gap:12px;justify-items:center;text-align:center;">
      <div style="width:74px;height:74px;border-radius:999px;background:#eef5ef;border:1px solid #dde8de;display:flex;align-items:center;justify-content:center;color:#17643a;font-size:34px;">🔐</div>
      <div>
        <div style="font-size:22px;color:#173020;font-weight:950;line-height:1.2;">Amount Access</div>
        <div style="font-size:13px;color:#69786e;line-height:1.55;margin-top:6px;">Enter password to unmask PO amount.</div>
      </div>
      <div style="width:100%;">${modalInputBlock('Password',`<input id="amountPass" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;border:1px solid #d9e4db;border-radius:14px;padding:13px 14px;background:#fff;font-size:13px;font-weight:800;color:#1d3022;">`)}</div>
      ${modalFooter([

  openModal(`<div style="background:transparent;border-radius:28px;overflow:visible;">${modalHero('Secure Access','Purchase Order Amounts','Unlock PO amounts for this supervisor session')}${modalSurface(body)}</div>`,'520px');
}
function unlockAmount(){if(document.getElementById('amountPass').value!=='fundsroom'){showToast('Incorrect password.',true);return}state.amountsUnlocked=true;closeModal();render();showToast('PO amount unlocked.')}
function renderPackingSlip(p){return `${headerBlock('Packing Slip Entry',`Record actual received and damaged quantity for ${p.id}.`,'📄')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px;">${p.items.map(i=>`<div style="border:1px solid #e2ebe3;border-radius:12px;padding:9px;background:#fbfdfb;"><div style="font-size:12px;color:#1a4d2a;font-weight:950;">${i.name}</div><div style="font-size:10px;color:#829085;margin-top:2px;">Requested ${i.requested}</div><label style="display:block;font-size:10px;color:#1a4d2a;font-weight:900;margin-top:6px;">Actually Received<input id="recv-${i.id}" type="number" min="0" value="${i.received}" style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:8px;padding:7px;margin-top:3px;"></label><label style="display:block;font-size:10px;color:#1a4d2a;font-weight:900;margin-top:5px;">Damaged Qty<input id="dam-${i.id}" type="number" min="0" value="${i.damaged}" style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:8px;padding:7px;margin-top:3px;"></label></div>`).join('')}</div><label style="display:block;font-size:11px;color:#1a4d2a;font-weight:900;margin-top:9px;">Supervisor Comment<textarea id="poComment" style="width:100%;min-height:70px;box-sizing:border-box;border:1px solid #dbe8db;border-radius:9px;padding:9px;margin-top:4px;">${esc(p.comment)}</textarea></label><div style="margin-top:9px;">${button('Submit Packing Slip','submitPackingSlip()')}</div>`}
function submitPackingSlip(){const p=purchaseOrders.find(x=>x.id===state.selectedPO);p.items.forEach(i=>{i.received=Number(document.getElementById('recv-'+i.id).value||0);i.damaged=Number(document.getElementById('dam-'+i.id).value||0)});p.comment=document.getElementById('poComment').value.trim();p.status=totalShort(p)===0?'Received':'Partially Received';render();showToast('Packing slip submitted; variance updated.')}
function renderVariance(p){const req=totalRequested(p),rec=totalReceived(p),dam=totalDamaged(p),sh=totalShort(p),healthy=Math.max(0,rec-dam),ful=req?((rec/req)*100).toFixed(1):'0.0',dr=rec?((dam/rec)*100).toFixed(1):'0.0';return `<div id="varianceReport">${headerBlock('Variance Report',`${p.id} · ${p.vendor.name}`,'📊')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;">${metric('📋','Requested',req,'Total requested')}${metric('📦','Received',rec,'Actual received')}${metric('⚠','Short',sh,'Not received')}${metric('💥','Damaged',dam,'Damaged stock')}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:10px;"><div style="border:1px solid #e2ebe3;border-radius:12px;padding:9px;background:#fff;"><div style="font-size:12px;color:#1a4d2a;font-weight:950;margin-bottom:5px;">Received vs Short vs Damaged</div><canvas id="varianceChart" height="170"></canvas></div><div style="border:1px solid #e2ebe3;border-radius:12px;padding:9px;background:#fff;"><div style="font-size:12px;color:#1a4d2a;font-weight:950;margin-bottom:5px;">Stock Quality Split</div><canvas id="qualityChart" height="170"></canvas></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:10px;">${detail('Fulfilment Rate',ful+'%')}${detail('Damage Rate',dr+'%')}${detail('Healthy Stock',healthy)}${detail('Supervisor Comment',p.comment||'No comment')}</div><div style="overflow-x:auto;border:1px solid #e2ebe3;border-radius:12px;margin-top:10px;"><table style="width:100%;min-width:600px;border-collapse:collapse;font-size:11px;"><thead><tr style="background:#edf5ef;color:#1a4d2a;text-align:left;">${['Stock','Requested','Received','Short','Damaged','Status'].map(h=>`<th style="padding:8px;">${h}</th>`).join('')}</tr></thead><tbody>${p.items.map(i=>{const x=Math.max(0,i.requested-i.received),issue=x>0||i.damaged>0;return `<tr><td style="padding:8px;border-top:1px solid #e7eee7;font-weight:900;">${i.name}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${i.requested}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${i.received}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${x}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${i.damaged}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${issue?pill('Variance Found','red'):pill('Matched')}</td></tr>`}).join('')}</tbody></table></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">${button('Notify Head Of Operations',"showToast('Head Of Operations informed.')",'gold')}${button('Download PDF','downloadVariancePDF()')}</div></div>`}
function drawVarianceCharts(){const p=purchaseOrders.find(x=>x.id===state.selectedPO);if(!p||typeof Chart==='undefined')return;if(state.varianceChart)state.varianceChart.destroy();if(state.qualityChart)state.qualityChart.destroy();const a=document.getElementById('varianceChart'),b=document.getElementById('qualityChart');if(!a||!b)return;state.varianceChart=new Chart(a,{type:'bar',data:{labels:p.items.map(i=>i.name),datasets:[{label:'Received',data:p.items.map(i=>i.received)},{label:'Short',data:p.items.map(i=>Math.max(0,i.requested-i.received))},{label:'Damaged',data:p.items.map(i=>i.damaged)}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});state.qualityChart=new Chart(b,{type:'doughnut',data:{labels:['Healthy Received','Damaged','Short'],datasets:[{data:[Math.max(0,totalReceived(p)-totalDamaged(p)),totalDamaged(p),totalShort(p)]}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}})}
async function downloadVariancePDF(){if(typeof html2canvas==='undefined'||!window.jspdf){showToast('PDF libraries not loaded.',true);return}const t=document.getElementById('varianceReport');showToast('Preparing PDF...');const c=await html2canvas(t,{scale:1.5,useCORS:true}),img=c.toDataURL('image/png'),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),iw=pw-14,ih=c.height*iw/c.width;let left=ih,pos=7;pdf.addImage(img,'PNG',7,pos,iw,ih);left-=ph;while(left>0){pos=left-ih+7;pdf.addPage();pdf.addImage(img,'PNG',7,pos,iw,ih);left-=ph}pdf.save(state.selectedPO+'_variance_report.pdf');showToast('Variance PDF downloaded.')}
function openProfile(){
  const body = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;">
      ${modalInfoCard('Employee ID',supervisor.employeeId,'🆔')}
      ${modalInfoCard('Phone',supervisor.phone,'📞')}
      ${modalInfoCard('Email',supervisor.email,'✉')}
      ${modalInfoCard('Base Farm',supervisor.farm,'📍')}
      ${modalInfoCard('Joining Date',supervisor.joined,'📅')}
      ${modalInfoCard('Status',supervisor.status,'✅')}

    ${modalFooter([
      modalAction('Logout','logout()','red','width:100%;'),

    ])}`;
  openModal(`<div style="background:transparent;border-radius:28px;overflow:visible;">${modalHero('Supervisor Profile',supervisor.name,supervisor.role,modalBadge(supervisor.status))}${modalSurface(body)}</div>`,'860px');
}
function logout(){closeModal();state.loggedIn=false;render()}function renderLoggedOut(){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;"><div style="width:min(390px,100%);background:#fff;border:1px solid #e2ebe3;border-radius:20px;padding:22px;text-align:center;box-shadow:0 16px 38px rgba(0,20,0,.08);"><div style="font-size:38px;">🌿</div><div style="font-size:20px;color:#1a4d2a;font-weight:950;margin-top:7px;">Supervisor Session Ended</div><div style="font-size:12px;color:#718176;line-height:1.5;margin-top:5px;">This is a prototype logout screen.</div><div style="margin-top:12px;">${button('Login Again',"state.loggedIn=true;state.view='workorders';render()")}</div></div></div>`}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(supervisorDrawerOpen){
      supervisorDrawerOpen=false;
      render();
    }else{
      closeModal();
    }
  }
});

window.addEventListener('resize',()=>{
  const nextMobile=window.innerWidth<900;

  if(nextMobile!==supervisorMobile){
    supervisorMobile=nextMobile;
    supervisorDrawerOpen=false;
    render();
  }
});

render();
</script>
