function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN");}
function showToast(msg,error=false){
  const t=document.getElementById("toast");
  t.textContent=(error?"⚠ ":"✓ ")+msg;
  t.style.background=error?"#b42331":"#173f27";
  t.style.opacity="1";t.style.transform="translateY(0)";
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.style.opacity="0";t.style.transform="translateY(70px)"},2300);
}
function openModal(content,width="820px"){
  const m=document.getElementById("modal"),b=document.getElementById("modalBox");
  b.style.width=`min(${width},100%)`;
  b.innerHTML=content;m.style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none";document.getElementById("modalBox").innerHTML="";}
function btn(label,onclick,tone="green",extra=""){
  const bg=tone==="gold"?"#d9a928":tone==="light"?"#fff":tone==="red"?"#fff0ef":"#173f27";
  const color=tone==="gold"?"#273121":tone==="light"?"#173f27":tone==="red"?"#b42331":"#fff";
  const border=tone==="light"?"1px solid #d8e4da":tone==="red"?"1px solid #f2d1cf":"none";
  return `<button onclick="${onclick}" style="border:${border};background:${bg};color:${color};border-radius:10px;padding:9px 11px;font-size:9px;font-weight:900;cursor:pointer;white-space:nowrap;${extra}">${label}</button>`;
}
function pill(text,tone="green"){
  const map={
    green:["#e8f6ec","#17643a"],gold:["#fff5d9","#846300"],red:["#ffe9e8","#b42331"],
    blue:["#eaf4ff","#1363a5"],gray:["#f0f3f0","#5f7064"],purple:["#f0e8ff","#6a3da5"]
  };
  const c=map[tone]||map.green;
  return `<span style="display:inline-flex;align-items:center;padding:5px 7px;border-radius:999px;background:${c[0]};color:${c[1]};font-size:8px;font-weight:900;white-space:nowrap;">${esc(text)}</span>`;
}
function statusPill(s){
  const x=String(s);
  if(/halt|fail|variance|attention|damage/i.test(x))return pill(x,"red");
  if(/pending|draft|partial|not started/i.test(x))return pill(x,"gold");
  if(/assigned|transit|sent|received/i.test(x))return pill(x,"blue");
  if(/final|complete|active|allocated|paid|accepted|delivered/i.test(x))return pill(x,"green");
  return pill(x,"gray");
}

  if(state.view==="b2b")content=b2bView();
  if(state.view==="reviews")content=reviewsView();
  if(state.view==="rfid")content=rfidView();

function openQuotationForm(rfq){
  openModal(modalHead("Register Quotation",rfq||"Select RFQ")+`<div style="padding:14px;"><label style="${labelStyle()}">RFQ</label><select id="qtRFQ" style="${inputStyle()}">${procurements.map(p=>`<option ${p.rfq===rfq?"selected":""}>${p.rfq}</option>`).join("")}</select><label style="${labelStyle()}margin-top:8px;">Vendor</label><select id="qtVendor" style="${inputStyle()}">${vendors.map(v=>`<option>${v.name}</option>`).join("")}</select><label style="${labelStyle()}margin-top:8px;">Capacity</label><input id="qtCapacity" value="500 units" style="${inputStyle()}"><label style="${labelStyle()}margin-top:8px;">Quoted Price</label><input id="qtPrice" type="number" value="90000" style="${inputStyle()}"><label style="${labelStyle()}margin-top:8px;">Delivery Date</label><input id="qtDate" type="date" value="2026-08-22" style="${inputStyle()}"><div style="margin-top:10px;">${btn("Register Quotation","saveQuotation()")}</div></div>`);
}
function saveQuotation(){
  const rfq=document.getElementById("qtRFQ").value;
  quotations.push({id:"QT-"+rfq.slice(-3)+"-"+String.fromCharCode(65+quotations.filter(x=>x.rfq===rfq).length),rfq,vendor:document.getElementById("qtVendor").value,capacity:document.getElementById("qtCapacity").value,price:Number(document.getElementById("qtPrice").value||0),delivery:document.getElementById("qtDate").value,status:"Received"});
  const p=procurements.find(x=>x.rfq===rfq);if(p)p.status="Quotations Received";
  closeModal();render();showToast("Quotation registered.");
}
function quotationCompareTab(){
  const rfqs=[...new Set(quotations.map(x=>x.rfq))];
  return card(`${sectionHeader("Quotation Comparison & Finalization")}
    <div style="display:grid;gap:9px;">${rfqs.map(rfq=>{
      const q=quotations.filter(x=>x.rfq===rfq),min=Math.min(...q.map(x=>x.price));
      return `<div style="border:1px solid #e2eae3;border-radius:12px;padding:10px;background:#fbfdfb;"><div style="font-size:11px;color:#173f27;font-weight:950;margin-bottom:7px;">${rfq}</div><div style="display:grid;gap:6px;">${q.map(x=>`<div style="background:#fff;border:${x.price===min?"1px solid #bcd8c1":"1px solid #e6ece6"};border-radius:10px;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><strong style="font-size:9px;color:#173f27;">${x.vendor}</strong><div style="font-size:7px;color:#829087;margin-top:3px;">Capacity ${x.capacity} · Delivery ${x.delivery}</div></div><div style="display:flex;align-items:center;gap:6px;"><strong style="font-size:11px;color:#173f27;">${money(x.price)}</strong>${x.price===min?pill("Lowest","green"):""}${btn(x.status==="Finalized"?"Finalized":"Finalize",`finalizeQuotation('${x.id}')`,x.status==="Finalized"?"light":"gold")}</div></div>`).join("")}</div></div>`;
    }).join("")}</div>`);
}
function finalizeQuotation(id){
  const q=quotations.find(x=>x.id===id);quotations.filter(x=>x.rfq===q.rfq).forEach(x=>x.status=x.id===id?"Finalized":"Not Selected");
  const p=procurements.find(x=>x.rfq===q.rfq);if(p)p.status="PO Finalized";
  if(!purchaseOrders.some(x=>x.rfq===q.rfq))purchaseOrders.unshift({id:"PO-"+(704+purchaseOrders.length),rfq:q.rfq,vendor:q.vendor,farm:"Kamshet",amount:q.price,status:"Finalized",date:new Date().toLocaleDateString("en-GB")});
  render();showToast("Quotation finalized and PO created.");
}

  return card(`${sectionHeader("B2C Review Dashboard")}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:9px;">${metric("⭐","Reviewed Orders",rated.length)}${metric("★","Average Rating",avg)}${metric("🧾","Bills",b2cOrders.filter(x=>x.bill!=="Draft").length)}${metric("🚚","Pending Delivery",b2cOrders.filter(x=>x.delivery!=="Delivered").length)}</div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:9px;">${metric("⭐","Total Reviews",customerReviews.length)}${metric("🌿","Product Avg",avg("product"))}${metric("🏪","Display Avg",avg("display"))}${metric("👤","Supervisor Avg",avg("supervisor"))}</div>
    <input value="${esc(state.reviewSearch)}" oninput="state.reviewSearch=this.value;render()" placeholder="Search bill, customer, supervisor..." style="${inputStyle()}margin-bottom:8px;">
    <div style="display:grid;gap:7px;">${rows.map(r=>`<div style="border:1px solid #e2eae3;border-radius:11px;padding:10px;background:#fbfdfb;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><strong style="font-size:9px;color:#173f27;">${r.bill} · ${r.customer}</strong><span style="font-size:8px;color:#839087;">${r.date}</span></div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;">${pill("Product ★"+r.product,"gold")}${pill("Display ★"+r.display,"gold")}${pill(r.supervisorName+" ★"+r.supervisor,"green")}</div><div style="font-size:8px;color:#718176;line-height:1.5;margin-top:6px;">“${esc(r.comment)}”</div></div>`).join("")}</div>`);
}

function rfidView(){
  return card(`${sectionHeader("RFID Plant Identification","Individual and group RFID identification.")}
    ${tabs([["individual","Individual RFID"],["group","Group RFID"]],state.rfidMode,"setRFIDMode")}
    ${state.rfidMode==="individual"?individualRFID():groupRFID()}`);
}
function setRFIDMode(x){state.rfidMode=x;render();}
function individualRFID(){
  const d=individualPlants[state.rfidCode];
  return `<div style="border:1px solid #e2eae3;border-radius:12px;padding:10px;background:#fbfdfb;"><div style="display:flex;gap:6px;flex-wrap:wrap;"><input id="rfidInput" value="${esc(state.rfidCode)}" placeholder="OM-KAMSHET-0234" style="${inputStyle()}flex:1;min-width:170px;">${btn("Simulate Scan","simulateRFID()","gold")}${btn("Search","searchRFID()")}</div>${d?`<div style="margin-top:9px;background:#fff;border:1px solid #e2eae3;border-radius:11px;padding:10px;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><div style="font-size:14px;color:#173f27;font-weight:950;">${d.name}</div><div style="font-size:8px;color:#829087;margin-top:3px;">${d.botanical} · ${d.rfid}</div></div>${pill("Health "+d.score+"%","green")}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;margin-top:8px;">${detail("Plant ID",d.plantId)}${detail("Location",d.farm+" · "+d.block)}${detail("Batch / Row",d.batch+" · "+d.row)}${detail("Stage",d.stage)}${detail("Height",d.height)}${detail("Width",d.width)}${detail("Age",d.age)}${detail("Container",d.container)}${detail("Propagation",d.propagation)}${detail("Grade",d.grade)}${detail("Sellable",d.sellable)}${detail("Moisture",d.moisture)}${detail("Fertilisation",d.fertilisation)}${detail("Pest",d.pest)}${detail("Next Action",d.next)}</div></div>`:""}</div>`;
}
function simulateRFID(){state.rfidCode=Object.keys(individualPlants)[Math.floor(Math.random()*Object.keys(individualPlants).length)];render();showToast(state.rfidCode+" detected.");}
function searchRFID(){const v=document.getElementById("rfidInput").value.trim().toUpperCase();if(!individualPlants[v]){showToast("Individual RFID not found.",true);return;}state.rfidCode=v;render();}
function groupRFID(){
  const d=groupPlants[state.groupCode];
  return `<div style="border:1px solid #e2eae3;border-radius:12px;padding:10px;background:#fbfdfb;"><div style="display:flex;gap:6px;flex-wrap:wrap;"><input id="groupInput" value="${esc(state.groupCode)}" placeholder="GRP-KAMSHET-1001" style="${inputStyle()}flex:1;min-width:170px;">${btn("Simulate Scan","simulateGroup()","gold")}${btn("Search","searchGroup()")}</div>${d?`<div style="margin-top:9px;background:#fff;border:1px solid #e2eae3;border-radius:11px;padding:10px;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><div style="font-size:14px;color:#173f27;font-weight:950;">${d.plant} · ${d.qty} Plants</div><div style="font-size:8px;color:#829087;margin-top:3px;">${d.rfid} · ${d.mapping}</div></div>${pill(d.health+" "+d.score+"%","green")}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:8px;">${detail("Farm / Block",d.farm+" · "+d.block)}${detail("Stage",d.stage)}${detail("Batch",d.batch)}${detail("Grow Bag",d.bag)}${detail("Total",d.qty)}${detail("Available",d.available)}${detail("Reserved",d.reserved)}${detail("Under Care",d.care)}${detail("Mapped On",d.mapped)}</div></div>`:""}</div>`;
}
function simulateGroup(){state.groupCode=Object.keys(groupPlants)[Math.floor(Math.random()*Object.keys(groupPlants).length)];render();showToast(state.groupCode+" detected.");}
function searchGroup(){const v=document.getElementById("groupInput").value.trim().toUpperCase();if(!groupPlants[v]){showToast("Group RFID not found.",true);return;}state.groupCode=v;render();}

function inventoryView(){
  const f=state.inventoryFilters;
  const filtered=inventoryRows.filter(r=>(f.farm==="All"||r.farm===f.farm)&&(f.plant==="All"||r.plant===f.plant)&&(f.stage==="All"||r.stage===f.stage)&&(f.bag==="All"||r.bag===f.bag)&&(f.block==="All"||r.block===f.block));
  const total=filtered.reduce((s,r)=>s+r.available,0);
  return card(`${sectionHeader("Plant Inventory Check","Filter by farm, plant, stage, grow bag and block.")}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:8px;">
      ${filterSelect("farm",["All",...new Set(inventoryRows.map(x=>x.farm))])}
      ${filterSelect("plant",["All",...new Set(inventoryRows.map(x=>x.plant))])}
      ${filterSelect("stage",["All","Sapling","Child","Adult"])}
      ${filterSelect("bag",["All",...new Set(inventoryRows.map(x=>x.bag))])}
      ${filterSelect("block",["All","Block A","Block B","Block C"])}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:8px;">${metric("🔎","Matches",filtered.length)}${metric("🌿","Available",total)}${metric("🏡","Farms",new Set(filtered.map(x=>x.farm)).size)}${metric("🪴","Plants",new Set(filtered.map(x=>x.plant)).size)}</div>
    ${tableWrap(["Farm","Plant","Stage","Grow Bag","Block","Available","Reserved","Under Care"],filtered.slice(0,120).map(r=>`<tr>${td(r.farm,true)}${td(r.plant)}${td(r.stage)}${td(r.bag)}${td(r.block)}${td("<strong>"+r.available+"</strong>")}${td(r.reserved)}${td(r.care)}</tr>`).join(""),"760px")}`);
}
function filterSelect(key,options){
  return `<select onchange="state.inventoryFilters.${key}=this.value;render()" style="${inputStyle()}">${options.map(x=>`<option ${state.inventoryFilters[key]===x?"selected":""}>${x}</option>`).join("")}</select>`;
}

function vendorQuotesView(){
  const q=state.quotationSearch.toLowerCase();
  const rows=vendorQuotesSent.filter(x=>!q||[x.rfq,x.vendor,x.location,x.items,x.status].join(" ").toLowerCase().includes(q));
  return card(`${sectionHeader("Vendor Portal · Quotations Sent","HOOP sees RFQs/quotation opportunities sent to vendors.")}
    <input value="${esc(state.quotationSearch)}" oninput="state.quotationSearch=this.value;render()" placeholder="Search RFQ or vendor..." style="${inputStyle()}margin-bottom:8px;">
    ${tableWrap(["RFQ","Vendor","Location","Requested Items","Sent On","Required By","Status"],rows.map(x=>`<tr>${td(x.rfq,true)}${td(x.vendor)}${td(x.location)}${td(x.items)}${td(x.sent)}${td(x.required)}${td(statusPill(x.status))}</tr>`).join(""),"900px")}`);
}

function vendorsView(){
  const items=[["register","Register Vendor"],["analytics","Analytics"],["history","PO History"],["listing","Vendor Listing"],["access","Vendor Access"]];
  return `${tabs(items,state.vendorTab,"setVendorTab")}${vendorTabContent()}`;
}
function vendorTabContent(){
  if(state.vendorTab==="analytics")return vendorAnalytics();
  if(state.vendorTab==="history")return vendorHistory();
  if(state.vendorTab==="listing")return vendorListing();
  if(state.vendorTab==="access")return vendorAccess();
  return vendorRegister();
}
function vendorRegister(){
  return card(`${sectionHeader("Register Vendor")}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;">
      <input id="vName" placeholder="Vendor legal name" style="${inputStyle()}">
      <input id="vTrade" placeholder="Trade name" style="${inputStyle()}">
      <input id="vLocation" placeholder="City, State" style="${inputStyle()}">
      <input id="vCategory" placeholder="Category" style="${inputStyle()}">
      <input id="vPhone" placeholder="Phone" style="${inputStyle()}">
      <input id="vEmail" placeholder="Email" style="${inputStyle()}">
    </div><div style="margin-top:9px;">${btn("Register Vendor","saveVendor()")}</div>`);
}
function saveVendor(){
  const name=document.getElementById("vName").value.trim();if(!name){showToast("Enter vendor name.",true);return;}
  vendors.push({id:"VEN-"+String(vendors.length+1).padStart(3,"0"),name,trade:document.getElementById("vTrade").value||name,location:document.getElementById("vLocation").value||"—",category:document.getElementById("vCategory").value||"General",phone:document.getElementById("vPhone").value||"—",email:document.getElementById("vEmail").value||"—",rating:0,access:false,last:"No transaction"});
  render();showToast("Vendor registered.");
}
function vendorAnalytics(){
  const totals={};vendorPurchases.forEach(p=>{totals[p.vendor]=(totals[p.vendor]||0)+p.cost});
  return card(`${sectionHeader("Vendor Analytics")}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:9px;">${metric("🏷","Vendors",vendors.length)}${metric("🧾","Purchase Records",vendorPurchases.length)}${metric("💰","Purchase Value",money(vendorPurchases.reduce((s,p)=>s+p.cost,0)))}${metric("★","Avg Rating",(vendors.reduce((s,v)=>s+v.rating,0)/vendors.length).toFixed(1))}</div>
    <div style="display:grid;gap:7px;">${vendors.map(v=>{const val=totals[v.name]||0,max=Math.max(...Object.values(totals),1),pct=Math.round(val/max*100);return `<div style="border:1px solid #e2eae3;border-radius:10px;padding:9px;"><div style="display:flex;justify-content:space-between;gap:8px;"><strong style="font-size:9px;color:#173f27;">${v.name}</strong><span style="font-size:8px;color:#718176;">★ ${v.rating} · ${money(val)}</span></div><div style="height:7px;background:#edf1ed;border-radius:999px;overflow:hidden;margin-top:7px;"><div style="height:100%;width:${pct}%;background:#173f27;border-radius:999px;"></div></div></div>`}).join("")}</div>`);
}
function vendorHistory(){
  const rows=vendorPurchases.map(p=>`<tr>${td(p.po,true)}${td(p.vendor)}${td(p.plant)}${td(p.qty)}${td(money(p.cost))}${td(p.delivery)}${td(statusPill(p.status))}</tr>`).join("");
  return card(`${sectionHeader("Purchase Order History")}${tableWrap(["PO","Vendor","Product","Qty","Cost","Delivery","Status"],rows,"760px")}`);
}
function vendorListing(){
  const q=state.vendorSearch.toLowerCase(),list=vendors.filter(v=>!q||[v.name,v.trade,v.location,v.category].join(" ").toLowerCase().includes(q));
  return card(`${sectionHeader("Vendor Listing")}
    <input value="${esc(state.vendorSearch)}" oninput="state.vendorSearch=this.value;render()" placeholder="Search vendor..." style="${inputStyle()}margin-bottom:8px;">
    <div style="display:grid;gap:7px;">${list.map(v=>`<div style="border:1px solid #e2eae3;border-radius:11px;padding:10px;background:#fbfdfb;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><strong style="font-size:10px;color:#173f27;">${v.name}</strong><div style="font-size:7px;color:#829087;margin-top:3px;">${v.trade} · ${v.location}</div></div>${pill("★ "+v.rating,"gold")}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:5px;margin-top:7px;">${detail("Category",v.category)}${detail("Phone",v.phone)}${detail("Email",v.email)}${detail("Last Transaction",v.last)}</div></div>`).join("")}</div>`);
}
function vendorAccess(){
  return card(`${sectionHeader("Vendor Access","Add/delete access option from the vendor master.")}
    <div style="display:grid;gap:7px;">${vendors.map(v=>`<div style="border:1px solid #e2eae3;border-radius:11px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><strong style="font-size:9px;color:#173f27;">${v.name}</strong><div style="font-size:7px;color:#829087;margin-top:3px;">${v.id} · ${v.email}</div></div><div style="display:flex;align-items:center;gap:6px;">${v.access?pill("Access Granted","green"):pill("Access Disabled","red")}${btn(v.access?"Remove Access":"Grant Access",`toggleVendorAccess('${v.id}')`,v.access?"red":"green")}${btn("Delete",`deleteVendor('${v.id}')`,"light")}</div></div>`).join("")}</div>`);
}
function toggleVendorAccess(id){const v=vendors.find(x=>x.id===id);v.access=!v.access;render();showToast(v.name+" access "+(v.access?"granted.":"removed."));}
function deleteVendor(id){const i=vendors.findIndex(x=>x.id===id);if(i>=0){const n=vendors[i].name;vendors.splice(i,1);render();showToast(n+" removed from vendor list.");}}

function varianceView(){
  return card(`${sectionHeader("Propagation & Acquisition · Variance Report","Purchase-order variance after packing-slip receipt.")}
    <div style="display:grid;gap:9px;">${varianceReports.map(v=>`<div style="border:1px solid #e2eae3;border-radius:12px;padding:10px;background:#fbfdfb;"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><div style="font-size:11px;color:#173f27;font-weight:950;">${v.po} · ${v.vendor}</div><div style="font-size:8px;color:#829087;margin-top:3px;">${v.comment}</div></div>${statusPill(v.status)}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:8px;">${detail("Requested",v.requested)}${detail("Received",v.received)}${detail("Short",v.short)}${detail("Damaged",v.damaged)}${detail("Fulfilment",v.fulfilment+"%")}</div><div style="height:8px;background:#edf1ed;border-radius:999px;overflow:hidden;margin-top:8px;"><div style="height:100%;width:${Math.max(0,Math.min(100,v.fulfilment))}%;background:${v.fulfilment<90?"#b42331":"#173f27"};border-radius:999px;"></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${btn("View Details",`openVariance('${v.po}')`,"light")}${btn("Notify Head / Record Action",`showToast('Variance action recorded for ${v.po}.')`,"gold")}</div></div>`).join("")}</div>`);
}
function openVariance(po){const v=varianceReports.find(x=>x.po===po);openModal(modalHead("Variance Report",po)+`<div style="padding:14px;"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px;">${detail("Vendor",v.vendor)}${detail("Requested",v.requested)}${detail("Received",v.received)}${detail("Short",v.short)}${detail("Damaged",v.damaged)}${detail("Fulfilment",v.fulfilment+"%")}${detail("Status",v.status)}${detail("Comment",v.comment)}</div></div>`);}

function modalHead(title,sub){
  return `<div style="background:linear-gradient(145deg,#173f27,#245b38);color:#fff;padding:14px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:9px;"><div><div style="font-size:16px;font-weight:950;">${esc(title)}</div><div style="font-size:8px;color:rgba(255,255,255,.75);margin-top:3px;">${esc(sub||"")}</div></div><button onclick="closeModal()" style="border:none;background:rgba(255,255,255,.12);color:#fff;width:31px;height:31px;border-radius:9px;font-size:17px;cursor:pointer;">×</button></div>`;
}
function inputStyle(){return "width:100%;box-sizing:border-box;border:1px solid #dbe6dc;border-radius:10px;padding:9px 10px;background:#fff;color:#1f2f25;font:inherit;font-size:9px;outline:none;";}
function labelStyle(){return "display:block;font-size:8px;color:#173f27;font-weight:900;";}
function openProfile(){
  openModal(modalHead("Head of Operations Profile",hoop.name)+`<div style="padding:14px;"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;">${detail("Employee ID",hoop.employeeId)}${detail("Role",hoop.role)}${detail("Phone",hoop.phone)}${detail("Email",hoop.email)}${detail("Base",hoop.base)}${detail("Status",hoop.status)}</div><div style="margin-top:11px;">${btn("Logout","logout()","red")}</div></div>`);
}
function logout(){closeModal();state.loggedIn=false;render();}
function renderLoggedOut(){
  document.getElementById("app").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;"><div style="width:min(420px,100%);background:#fff;border:1px solid #e2eae3;border-radius:18px;padding:22px;text-align:center;"><div style="font-size:38px;">🌿</div><div style="font-size:18px;color:#173f27;font-weight:950;margin-top:7px;">Operations Session Ended</div><div style="font-size:9px;color:#718176;margin-top:5px;">Prototype logout screen.</div><div style="margin-top:12px;">${btn("Login Again","state.loggedIn=true;state.view='home';render()")}</div></div></div>`;
}

window.addEventListener("resize",()=>{
  const m=window.innerWidth<900;
  if(m!==state.mobile){state.mobile=m;state.drawer=false;render();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(state.drawer){state.drawer=false;render();}else closeModal();}});
render();
</script>
</body>
</html>
