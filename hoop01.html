function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN");}
function showToast(msg,error=false){
  const t=document.getElementById("toast");
  t.textContent=(error?"⚠ ":"✓ ")+msg;
  t.style.background=error?"#b42331":"#173f27";
  t.style.opacity="1";t.style.transform="translateY(0)";
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.style.opacity="0";t.style.transform="translateY(70px)"},2300);
}
function openModal(content,width="820px"){
  const m=document.getElementById("modal"),b=document.getElementById("modalBox");
  b.style.width=`min(${width},100%)`;
  b.innerHTML=content;m.style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none";document.getElementById("modalBox").innerHTML="";}
function btn(label,onclick,tone="green",extra=""){
  const bg=tone==="gold"?"#d9a928":tone==="light"?"#fff":tone==="red"?"#fff0ef":"#173f27";
  const color=tone==="gold"?"#273121":tone==="light"?"#173f27":tone==="red"?"#b42331":"#fff";
  const border=tone==="light"?"1px solid #d8e4da":tone==="red"?"1px solid #f2d1cf":"none";
  return `<button onclick="${onclick}" style="border:${border};background:${bg};color:${color};border-radius:10px;padding:9px 11px;font-size:9px;font-weight:900;cursor:pointer;white-space:nowrap;${extra}">${label}</button>`;
}
function pill(text,tone="green"){
  const map={
    green:["#e8f6ec","#17643a"],gold:["#fff5d9","#846300"],red:["#ffe9e8","#b42331"],
    blue:["#eaf4ff","#1363a5"],gray:["#f0f3f0","#5f7064"],purple:["#f0e8ff","#6a3da5"]
  };
  const c=map[tone]||map.green;
  return `<span style="display:inline-flex;align-items:center;padding:5px 7px;border-radius:999px;background:${c[0]};color:${c[1]};font-size:8px;font-weight:900;white-space:nowrap;">${esc(text)}</span>`;
}
function statusPill(s){
  const x=String(s);
  if(/halt|fail|variance|attention|damage/i.test(x))return pill(x,"red");
  if(/pending|draft|partial|not started/i.test(x))return pill(x,"gold");
  if(/assigned|transit|sent|received/i.test(x))return pill(x,"blue");
  if(/final|complete|active|allocated|paid|accepted|delivered/i.test(x))return pill(x,"green");
  return pill(x,"gray");
}

}

function productionCheckRow(checked,label,action){
  return `<label style="display:flex;align-items:center;gap:8px;border:1px solid ${checked?"#cfe0d2":"#e7ece7"};background:${checked?"#edf5ef":"#fff"};border-radius:9px;padding:8px;cursor:pointer;font-size:8px;color:#173f27;font-weight:850;">
    <input type="checkbox" ${checked?"checked":""} onchange="${action}" style="width:15px;height:15px;accent-color:#173f27;margin:0;flex:0 0 15px;">
    <span>${label}</span>
  </label>`;
}

function toggleProductionPlant(name){
  if(state.prodPlants.includes(name)){
    if(state.prodPlants.length===1){showToast("Keep at least one plant variety selected.",true);return;}
    state.prodPlants=state.prodPlants.filter(x=>x!==name);
  }else{
    state.prodPlants.push(name);
  }
  state.prodRfids=state.prodRfids.filter(id=>productionMatchingUnits().some(u=>u.rfid===id));
  render();
}

function toggleProductionStage(stage){
  if(state.prodStages.includes(stage)){
    if(state.prodStages.length===1){showToast("Keep at least one stage selected.",true);return;}
    state.prodStages=state.prodStages.filter(x=>x!==stage);
  }else{
    state.prodStages.push(stage);
  }
  state.prodRfids=state.prodRfids.filter(id=>productionMatchingUnits().some(u=>u.rfid===id));
  render();
}

function productionMatchingUnits(){
  const block=prodBlockData();
  const units=[];

  state.prodPlants.forEach(name=>{
    const p=block.plants.find(x=>x.name===name);
    if(!p)return;

    state.prodStages.forEach(stage=>{
      const key=stage.toLowerCase();
      const count=Number(p[key]||0);
      const farmCode=state.prodFarm.substring(0,3).toUpperCase();
      const plantCode=name.replace(/[^A-Za-z]/g,"").substring(0,4).toUpperCase();
      const stageCode=stage.substring(0,3).toUpperCase();

      for(let i=1;i<=count;i++){
        units.push({
          serial:i,
          plant:name,
          stage,
          rfid:`RFID-${farmCode}-${state.prodBlock}-${plantCode}-${stageCode}-${String(i).padStart(3,"0")}`
        });
      }
    });
  });

  return units;
}

  if(state.prodRfids.includes(rfid)){
    state.prodRfids=state.prodRfids.filter(x=>x!==rfid);
  }else{
    state.prodRfids.push(rfid);
  }
  render();
}

function assignProductionWorkOrder(){
  if(!state.prodRfids.length){
    showToast("Select at least one RFID plant before assigning.",true);
    state.productionTab="plants";
    render();
    return;
  }

  if(!state.prodSupervisors.length){
    showToast("Select at least one supervisor.",true);
    return;
  }

  if(!state.prodActions.length){
    showToast("Select at least one production action.",true);
    return;
  }

  if(!state.prodForm.start || !state.prodForm.end){
    showToast("Select start and end dates.",true);
    return;
  }

  if(new Date(state.prodForm.end)<new Date(state.prodForm.start)){
    showToast("End date cannot be before start date.",true);
    return;
  }

  if(!String(state.prodForm.time).trim()){
    showToast("Enter estimated time.",true);
    return;
  }

  const selected=productionMatchingUnits().filter(x=>state.prodRfids.includes(x.rfid));
  const plants=[...new Set(selected.map(x=>x.plant))];
  const stages=[...new Set(selected.map(x=>x.stage))];
  const id="WO-2026-"+String(productionWorkOrderCounter).padStart(4,"0");
  productionWorkOrderCounter++;

  let voucher="-";

  if(state.prodActions.includes("Update Location")){
    voucher="TV-2026-"+String(productionVoucherCounter).padStart(3,"0");
    productionVoucherCounter++;

    productionDeliveries.unshift({
      id:"DEL-PROD-"+String(productionDeliveries.length+3).padStart(3,"0"),
      wo:id,
      type:"Plant Location Transfer",
      from:state.prodFarm+" · Block "+state.prodBlock,
      to:state.prodForm.toFarm+" · "+(state.prodForm.toBlock||"New Production Location"),
      load:state.prodRfids.length+" RFID plants",
      driver:state.prodForm.driver,
      status:state.prodForm.trip==="Planned"?"Driver Assigned":state.prodForm.trip,
      time:"Scheduled from "+state.prodForm.start+" to "+state.prodForm.end,
      voucher
    });
  }

  const assignedAt=new Date().toLocaleString("en-IN",{
    day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"
  });

  workOrders.unshift({
    id,
    assigned:assignedAt,
    assignedAt,
    farm:state.prodFarm,
    block:"Block "+state.prodBlock,
    plants:plants.join(", "),
    plantsArr:plants,
    stage:stages.join(" / "),
    stagesArr:stages,
    qty:state.prodRfids.length,
    count:state.prodRfids.length,
    supervisor:state.prodSupervisors.join(", "),
    supervisors:[...state.prodSupervisors],
    action:state.prodActions.join(" + "),
    actions:[...state.prodActions],
    start:state.prodForm.start,
    startDate:state.prodForm.start,
    end:state.prodForm.end,
    endDate:state.prodForm.end,
    estimatedTime:state.prodForm.time,
    status:"In Progress",
    eff:0,
    efficiency:null,
    material:state.prodForm.material,
    materialAllocation:state.prodForm.material,
    rfids:[...state.prodRfids],
    outcome:state.prodForm.outcome,
    remarks:state.prodForm.remarks||"No additional remarks.",
    voucher,
    supervisorMessage:"Work order assigned. Supervisor update is awaited after execution begins.",
    completionDateTime:"Pending",
    flagged:false,
    revoked:false
  });

  state.prodRfids=[];
  state.productionTab="workorders";
  render();
  showToast(id+" assigned successfully.");
}

function prodOrder(w){
  const supervisorsArr=w.supervisors || String(w.supervisor||"").split(",").map(x=>x.trim()).filter(Boolean);
  const actionsArr=w.actions || String(w.action||"").split("+").map(x=>x.trim()).filter(Boolean);
  const plantsArr=w.plantsArr || String(w.plants||"").split(",").map(x=>x.trim()).filter(Boolean);
  const stagesArr=w.stagesArr || String(w.stage||"").split("/").map(x=>x.trim()).filter(Boolean);

  return {
    ...w,
    assignedAt:w.assignedAt||w.assigned||"—",
    supervisors:supervisorsArr,
    actions:actionsArr,
    plantsArr,
    stagesArr,
    count:Number(w.count??w.qty??0),
    rfids:w.rfids || productionMockRfids(w),
    startDate:w.startDate||w.start||"—",
    endDate:w.endDate||w.end||"—",
    estimatedTime:w.estimatedTime||"Not Set",
    outcome:w.outcome||defaultProductionOutcome(w.status),
    remarks:w.remarks||"No additional remarks.",
    materialAllocation:w.materialAllocation||w.material||"Pending",
    voucher:w.voucher||"-",
    supervisorMessage:w.supervisorMessage||defaultSupervisorMessage(w),
    completionDateTime:w.completionDateTime||(w.status==="Completed"?"Completed":"Pending"),
    efficiency:typeof w.efficiency==="number"?w.efficiency:(typeof w.eff==="number"?w.eff:null),
    flagged:Boolean(w.flagged),
    revoked:Boolean(w.revoked)
  };
}

function productionMockRfids(w){
  const plant=(String(w.plants||"Plant").split(",")[0]||"Plant").replace(/[^A-Za-z]/g,"").substring(0,4).toUpperCase();
  const farm=String(w.farm||"FAR").substring(0,3).toUpperCase();
  const stage=(String(w.stage||"SAP").split("/")[0]||"SAP").replace(/[^A-Za-z]/g,"").substring(0,3).toUpperCase();
  const count=Math.min(Number(w.qty||4),4);

  return Array.from({length:count},(_,i)=>`RFID-${farm}-${String(w.block||"A").replace(/[^A-Z0-9]/gi,"").slice(-1)}-${plant}-${stage}-${String(i+1).padStart(3,"0")}`);
}

function defaultProductionOutcome(status){
  if(status==="Completed")return "Production work completed";
  if(status==="Halted")return "Work held for operational clearance";
  if(status==="Attention")return "Supervisor intervention required";
  return "Production activity to be completed";
}

function defaultSupervisorMessage(w){
  if(w.status==="Completed")return "Work completed and recorded by the assigned supervisor.";
  if(w.status==="Halted")return "Work is halted pending operational clearance.";
  if(w.status==="Attention")return "Supervisor has marked this work order for attention.";
  return "Supervisor execution update is pending.";
}

function revokeProductionWO(id){
  const w=workOrders.find(x=>x.id===id);
  if(!w || w.revoked)return;

  w.revoked=true;
  w.status="Revoked";
  w.supervisorMessage="Work order revoked by HOOP. No further execution is permitted under this work-order number.";
  w.completionDateTime="Revoked: "+new Date().toLocaleString("en-IN");
  w.eff=0;
  w.efficiency=0;
  render();
  showToast(id+" revoked.");
}

function redoProductionWO(id){
  const source=prodOrder(workOrders.find(x=>x.id===id));
  if(!source)return;

  const newId="WO-2026-"+String(productionWorkOrderCounter).padStart(4,"0");
  productionWorkOrderCounter++;

  workOrders.unshift({
    ...workOrders.find(x=>x.id===id),
    id:newId,
    assigned:new Date().toLocaleString("en-IN"),
    assignedAt:new Date().toLocaleString("en-IN"),
    status:"In Progress",
    supervisorMessage:"Redo created from "+source.id+". Supervisors must repeat the work and submit a fresh completion update.",
    completionDateTime:"Pending",
    eff:0,
    efficiency:null,
    flagged:false,
    revoked:false,
    rfids:[...source.rfids],
    supervisors:[...source.supervisors],
    actions:[...source.actions],
    plantsArr:[...source.plantsArr],
    stagesArr:[...source.stagesArr]
  });

  render();
  showToast(newId+" created as redo of "+source.id+".");
}

function materialStatusPill(status){
  const s=String(status||"");
  if(s==="Completed" || s.includes("Quotation") || s.includes("Allocated"))return pill(s,"green");
  if(s==="In-Progress" || s==="RFQ Sent" || s.includes("Transfer"))return pill(s,"blue");
  if(s==="Halted" || s.includes("Short"))return pill(s,"red");
  if(s==="Attention" || s==="Pending")return pill(s,"gold");
  if(s.includes("PO"))return pill(s,"purple");
  return pill(s,"gray");
}

function materialSuggestedRequirements(workOrder){
  const qty=workOrder.quantity;
  const hasAdult=workOrder.stages.includes("Adult");
  const hasChild=workOrder.stages.includes("Child");

  return {
    "RM-001":Math.ceil(qty/(hasAdult?8:hasChild?10:12)),
    "RM-002":workOrder.stages.includes("Sapling")?Math.ceil(qty*.65):0,
    "RM-003":hasChild?Math.ceil(qty*.55):0,
    "RM-004":hasAdult?Math.ceil(qty*.55):0,
    "RM-005":Math.max(1,Math.ceil(qty/50)),
    "RM-006":Math.ceil(qty/28),
    "RM-007":Math.ceil(qty*.42),
    "RM-008":qty
  };
}

function materialResetSuggested(){
  const wo=materialSelectedWO();
  if(!wo)return;

  const suggested=materialSuggestedRequirements(wo);

  materialMimoRawMaterials.forEach(item=>{
    const el=document.getElementById("materialNeed-"+item.id);
    if(el)el.value=suggested[item.id]||0;
  });

  showToast("Suggested material quantities restored.");
}

function materialCreateAllocation(){
  const wo=materialSelectedWO();
  if(!wo)return;

  const requirements=materialMimoRawMaterials.map(item=>({
    id:item.id,
    name:item.name,
    category:item.category,
    unit:item.unit,
    rate:item.rate,
    qty:Number(document.getElementById("materialNeed-"+item.id)?.value||0)
  })).filter(x=>x.qty>0);

  if(!requirements.length){
    showToast("Enter at least one material requirement.",true);
    return;
  }

  let record=materialCurrentAllocation();

  if(record){
    record.requirements=requirements;
    record.updatedOn=new Date().toLocaleString("en-IN");
  }else{
    record={
      id:`MA-2026-${String(materialMimoAllocationCounter).padStart(3,"0")}`,
      workOrderId:wo.id,
      farm:wo.farm,
      block:wo.block,
      createdOn:new Date().toLocaleString("en-IN"),
      updatedOn:new Date().toLocaleString("en-IN"),
      requirements
    };

    materialMimoAllocations.unshift(record);
    materialMimoAllocationCounter++;
  }

  wo.allocationStatus="Partially Allocated";
  state.materialDecisionTab="availability";
  state.materialTab="availability";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
  showToast(record.id+" saved for "+wo.id+".");
}

function materialAllocationRows(){
  const wo=materialSelectedWO();
  const allocation=materialCurrentAllocation();

  if(!wo || !allocation)return [];

  return allocation.requirements.map(row=>{
    const destinationStock=Number(materialMimoStock[wo.farm][row.id]||0);
    const afterDestination=Math.max(row.qty-destinationStock,0);
    const otherStock=materialOtherFarmStock(row.id,wo.farm);
    const transferQty=Math.min(afterDestination,otherStock);
    const procurementQty=Math.max(afterDestination-transferQty,0);

    return {
      ...row,
      destinationStock,
      otherStock,
      transferQty,
      procurementQty
    };
  });
}

  if(record){
    record.details=details;
    record.updatedOn=new Date().toLocaleString("en-IN");
    record.status=record.rfqNo?"RFQ Sent":"Procurement Saved";
  }else{
    record={
      id:`PR-2026-${String(materialMimoProcurementCounter).padStart(3,"0")}`,
      workOrderId:wo.id,
      allocationId:allocation.id,
      farm:wo.farm,
      block:wo.block,
      details,
      status:"Procurement Saved",
      rfqNo:null,
      createdOn:new Date().toLocaleString("en-IN")

  wo.allocationStatus="Pending";
  state.materialTab="procurement";

  showToast(record.id+" saved with editable quantities.");

function materialReadonlyField(label,value){
  return `<label style="${labelStyle()}">${label}

  </label>`;

function materialCalculateQuotationTotal(){
  let subtotal=0;

  state.materialQuoteDraftItems.forEach(item=>{
    const qty=Number(document.getElementById("materialOfferQty-"+item.id)?.value||0);
    const rate=Number(document.getElementById("materialOfferRate-"+item.id)?.value||0);
    const line=qty*rate;
    subtotal+=line;

    const field=document.getElementById("materialOfferLine-"+item.id);
    if(field)field.value=money(line);
  });

  const transport=Number(document.getElementById("materialQuoteTransport")?.value||0);
  const taxPercent=Number(document.getElementById("materialQuoteTax")?.value||0);
  const tax=subtotal*taxPercent/100;
  const total=subtotal+tax+transport;

  const totalEl=document.getElementById("materialQuoteGrandTotal");
  const breakEl=document.getElementById("materialQuoteBreakup");

  if(totalEl)totalEl.textContent=money(total);
  if(breakEl)breakEl.textContent=`Subtotal ${money(subtotal)} + Tax ${money(tax)} + Transport ${money(transport)}`;

  return {subtotal,taxPercent,tax,transport,total};
}

  if(!vendorName || !days){

    return;
  }

  const offered=state.materialQuoteDraftItems.map(item=>({
    id:item.id,
    name:item.name,
    unit:item.unit,
    requiredQty:item.qty,
    offeredQty:Number(document.getElementById("materialOfferQty-"+item.id)?.value||0),
    unitPrice:Number(document.getElementById("materialOfferRate-"+item.id)?.value||0)
  }));

  const totals=materialCalculateQuotationTotal();

  materialMimoQuotations.unshift({
    id:`QR-2026-${String(materialMimoQuotationCounter).padStart(3,"0")}`,
    workOrderId:p.workOrderId,
    procurementId:p.id,
    rfqNo:p.rfqNo,
    vendorQuotationNo:document.getElementById("materialVendorQuoteNo")?.value.trim()||"Not Provided",
    vendor:{
      name:vendorName,
      contactPerson:document.getElementById("materialVendorContact")?.value.trim()||"",

      email:document.getElementById("materialVendorEmail")?.value.trim()||"",
      gst:document.getElementById("materialVendorGst")?.value.trim()||""
    },
    quotationDate:document.getElementById("materialQuoteDate")?.value||"",
    validUntil:document.getElementById("materialQuoteValid")?.value||"",
    deliveryDays:days,
    deliveryLocation:p.farm+" · "+p.block,
    status:document.getElementById("materialQuoteStatus")?.value||"Received",
    remarks:document.getElementById("materialQuoteRemarks")?.value.trim()||"No additional remarks",
    offered,
    ...totals,
    createdOn:new Date().toLocaleString("en-IN")
  });

  materialMimoQuotationCounter++;
  p.status="Quotation Received";
  state.materialActiveProcurementId=null;
  state.materialQuoteDraftItems=[];
  state.materialTab="comparison";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
  showToast("Quotation received and registered for "+p.rfqNo+".");
}

function materialFinalizeQuotation(quotationId){
  const q=materialMimoQuotations.find(x=>x.id===quotationId);
  if(!q)return;

  if(materialMimoPurchaseOrders.some(po=>po.quotationId===quotationId)){
    showToast("Purchase order already created for this quotation.",true);
    return;
  }

  const poNo=`PO-2026-${String(materialMimoPoCounter).padStart(3,"0")}`;
  materialMimoPoCounter++;

  materialMimoPurchaseOrders.unshift({
    id:poNo,
    quotationId:q.id,
    workOrderId:q.workOrderId,
    procurementId:q.procurementId,
    rfqNo:q.rfqNo,
    vendor:q.vendor.name,
    amount:q.total,
    details:q.offered,
    status:"PO Created",
    createdOn:new Date().toLocaleString("en-IN")
  });

  const p=materialMimoProcurements.find(x=>x.id===q.procurementId);
  if(p)p.status="PO Created: "+poNo;

  const wo=materialMimoWorkOrders.find(x=>x.id===q.workOrderId);
  if(wo)wo.allocationStatus="Allocated";

  q.status="Finalized";
  render();
  showToast(poNo+" created for "+q.workOrderId+".");
}

  const po=materialMimoPurchaseOrders.find(x=>x.id===poId);

function b2bBuildStockAllocation(inquiry,item){
  const assignedStock=Number(b2bFarmStock[inquiry.farm][item.stockId]||0),usedFromAssigned=Math.min(item.qty,assignedStock);let remaining=Math.max(item.qty-assignedStock,0);
  const otherFarmAllocations=b2bFarms.filter(f=>f!==inquiry.farm).map(f=>{const available=Number(b2bFarmStock[f][item.stockId]||0),suggested=Math.min(remaining,available);remaining=Math.max(remaining-suggested,0);return {farm:f,available,suggested};});
  const otherStockTotal=otherFarmAllocations.reduce((s,x)=>s+x.available,0),transferable=otherFarmAllocations.reduce((s,x)=>s+x.suggested,0),internalAvailable=assignedStock+otherStockTotal,shortfall=Math.max(item.qty-internalAvailable,0);
  return {assignedStock,usedFromAssigned,otherFarmAllocations,otherStockTotal,transferable,internalAvailable,shortfall};
}

function b2bToggleAllQuotationRows(shouldSelect){const i=b2bGetInquiry(state.b2bQuotationContext.inquiryId);if(!i)return;i.items.forEach((x,index)=>{const c=document.getElementById("b2b-quote-select-"+index);if(c){c.checked=shouldSelect;b2bToggleQuoteRow(index,false);}});b2bUpdateQuotationCalculations();}

    ${td(`<span style="font-weight:950;color:#173f27;">${o.id}</span>`,true)}
    ${td(`<span style="font-weight:850;color:#6733a6;">${o.quotationVersionId}</span>${v?`<div style="font-size:7px;color:#718176;margin-top:4px;">Version ${v.versionNo}</div>`:""}`)}${td(o.inquiryId)}${td(esc(i?i.company:""))}${td(`<strong style="color:#173f27;">${money(o.total)}</strong>`)}
    ${td(`<div style="font-size:8px;line-height:1.55;">${b2bPaymentStatusPill(o)}<div style="margin-top:5px;"><strong>Terms:</strong> ${esc(o.paymentTerms||"Not recorded")}</div><div><strong>Received:</strong> ${money(got)}</div><div><strong>Pending:</strong> ${money(due)}</div>${btn("💳 "+paymentButton,`b2bOpenPaymentModal('${o.id}')`,"gold","margin-top:7px;")}</div>`)}
    ${td(`<select onchange="b2bAssignOrderSupervisor('${o.id}',this.value)" style="${inputStyle()}min-width:130px;"><option value="">Select supervisor</option>${b2bSupervisors.map(x=>`<option ${o.supervisor===x?"selected":""}>${x}</option>`).join("")}</select>`)}
    ${td(`<select onchange="b2bAssignOrderDriver('${o.id}',this.value)" style="${inputStyle()}min-width:120px;"><option value="">Select driver</option>${b2bDrivers.map(x=>`<option ${o.driver===x?"selected":""}>${x}</option>`).join("")}</select>`)}
    ${td(`<div>${b2bOrderStatusPill(o.status)}</div><select onchange="b2bHandleOrderStatusSelection('${o.id}',this.value)" style="${inputStyle()}min-width:125px;margin-top:6px;">${b2bOrderStatuses.map(x=>`<option ${o.status===x?"selected":""}>${x}</option>`).join("")}</select>${o.statusReason?`<div style="font-size:7px;color:#b42331;font-weight:800;line-height:1.4;margin-top:5px;"><strong>Reason:</strong> ${esc(o.statusReason)}</div>`:""}${["Failed","Variance"].includes(o.status)?btn("✎ Edit Reason",`b2bOpenOrderStatusModal('${o.id}','${o.status}')`,"light","margin-top:6px;"):""}`)}
    ${td(esc(v?v.finalizedAt:o.createdAt))}${td(btn("👁 View",`b2bViewQuotationVersion('${o.quotationVersionId}')`,"light"))}
  </tr>`;}).join("");
  return `${card(`${sectionHeader("Orders","Every finalized quotation becomes an order. Record payments, assign supervisor and driver, and track completion or exceptions.")}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;margin-bottom:9px;">${metric("🧾","Total Active Orders",active.length)}${metric("💰","Payment Received",money(received))}${metric("⌛","Pending Balance",money(pending))}${metric("✓","Completed Orders",completed)}</div>${tableWrap(["Order No.","Finalized Quotation","Inquiry No.","Customer","Order Value","Payment","Assign Supervisor","Assign Driver","Order Status","Finalized On","View Quotation"],rows||`<tr><td colspan="11" style="padding:20px;text-align:center;color:#718176;">No orders are available yet. Finalize a quotation to create an order.</td></tr>`,"1820px")}`)}`;
}
function b2bPaymentStatusPill(o){const r=b2bPaymentReceived(o),p=b2bPendingBalance(o);if(r<=0)return pill("Not Received","red");if(p<=0)return pill("Fully Paid","green");return pill("Partially Paid","gold");}
function b2bOrderStatusPill(s){if(s==="Completed")return pill("Completed","green");if(s==="Failed")return pill("Failed","red");if(s==="Variance")return pill("Variance","gold");return pill("In Progress","blue");}
function b2bAssignOrderSupervisor(id,name){const o=b2bGetOrder(id);if(!o)return;o.supervisor=name;o.updatedAt=b2bTimestamp();showToast(name?name+" assigned as supervisor for "+o.id+".":"Supervisor assignment cleared for "+o.id+".");}
function b2bAssignOrderDriver(id,name){const o=b2bGetOrder(id);if(!o)return;o.driver=name;o.updatedAt=b2bTimestamp();showToast(name?name+" assigned as driver for "+o.id+".":"Driver assignment cleared for "+o.id+".");}

function b2bOpenPaymentModal(id){
  const o=b2bGetOrder(id);if(!o)return;const i=b2bGetInquiry(o.inquiryId),received=b2bPaymentReceived(o),pending=b2bPendingBalance(o);state.b2bActivePaymentOrderId=id;
  openModal(modalHead("Record Order Payment",o.id+" · "+(i?i.company:"Customer"))+`<div style="padding:14px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;">
      <div style="background:#f8faf8;border:1px solid #e2eae3;border-radius:12px;padding:10px;"><div style="font-size:10px;color:#173f27;font-weight:950;margin-bottom:8px;">Order Details</div>${b2bProfileRow("Order Number",o.id)}${b2bProfileRow("Quotation",o.quotationVersionId)}${b2bProfileRow("Inquiry",o.inquiryId)}${b2bProfileRow("Customer",i?i.company:"")}</div>
      <label style="${labelStyle()}">Quotation Payment Terms *<textarea id="b2bPaymentTerms" placeholder="e.g. 50% advance, 40% before dispatch and 10% after delivery" style="${inputStyle()}min-height:110px;margin-top:5px;">${esc(o.paymentTerms||"")}</textarea></label>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;margin-top:9px;">${metric("₹","Total Order Value",money(o.total))}${metric("✓","Total Payment Received",money(received))}${metric("⌛","Pending Balance",money(pending))}</div>
    <div style="font-size:10px;color:#173f27;font-weight:950;margin:12px 0 7px;">Add Payment Entry</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:7px;">
      <label style="${labelStyle()}">Payment Type<select id="b2bPaymentType" style="${inputStyle()}margin-top:5px;"><option>Advance Payment</option><option>Part Payment</option><option>Final Payment</option><option>Other Payment</option></select></label>
      <label style="${labelStyle()}">Amount Received (₹)<input id="b2bPaymentAmount" type="number" min="0" max="${pending}" step="0.01" placeholder="Enter amount" style="${inputStyle()}margin-top:5px;"></label>
      <label style="${labelStyle()}">Payment Date<input id="b2bPaymentDate" type="date" value="${b2bToday()}" style="${inputStyle()}margin-top:5px;"></label>
      <label style="${labelStyle()}">Payment Mode<select id="b2bPaymentMode" style="${inputStyle()}margin-top:5px;"><option>Bank Transfer</option><option>UPI</option><option>Cash</option><option>Cheque</option><option>Other</option></select></label>
      <label style="${labelStyle()}">Reference Number<input id="b2bPaymentReference" placeholder="UTR / cheque / receipt number" style="${inputStyle()}margin-top:5px;"></label>
      <label style="${labelStyle()}">Payment Note<input id="b2bPaymentNote" placeholder="e.g. 50% advance received" style="${inputStyle()}margin-top:5px;"></label>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">${btn("💾 Save Terms & Payment","b2bSaveOrderPayment()")}${btn("Close","closeModal()","light")}</div>
    <div style="font-size:10px;color:#173f27;font-weight:950;margin:13px 0 7px;">Payment History</div>
    ${tableWrap(["Payment ID","Type","Date","Amount","Mode","Reference","Note","Recorded At"],(o.payments||[]).length?(o.payments||[]).slice().reverse().map(p=>`<tr>${td(p.id,true)}${td(p.type)}${td(p.date)}${td(`<strong style="color:#173f27;">${money(p.amount)}</strong>`)}${td(p.mode)}${td(esc(p.reference||"Not provided"))}${td(esc(p.note||"No note"))}${td(esc(p.recordedAt))}</tr>`).join(""):`<tr><td colspan="8" style="padding:18px;text-align:center;color:#718176;">No payments have been recorded for this order yet.</td></tr>`,"950px")}
  </div>`,"980px");
}
function b2bSaveOrderPayment(){
  const o=b2bGetOrder(state.b2bActivePaymentOrderId);if(!o)return;const terms=document.getElementById("b2bPaymentTerms").value.trim(),amount=Number(document.getElementById("b2bPaymentAmount").value||0),type=document.getElementById("b2bPaymentType").value,date=document.getElementById("b2bPaymentDate").value,mode=document.getElementById("b2bPaymentMode").value,reference=document.getElementById("b2bPaymentReference").value.trim(),note=document.getElementById("b2bPaymentNote").value.trim(),pending=b2bPendingBalance(o);
  if(!terms){showToast("Please enter the quotation payment terms.",true);return;}if(amount<0){showToast("Payment amount cannot be negative.",true);return;}if(amount>pending){showToast("Payment amount cannot be greater than the pending order balance.",true);return;}if(amount>0&&!date){showToast("Please select the payment date.",true);return;}
  o.paymentTerms=terms;o.updatedAt=b2bTimestamp();if(amount>0){b2bPaymentSeq++;o.payments.push({id:"PAY-2026-"+String(b2bPaymentSeq).padStart(3,"0"),type,amount,date,mode,reference,note,recordedAt:b2bTimestamp()});}
  closeModal();render();showToast(amount>0?money(amount)+" payment recorded for "+o.id+".":"Payment terms saved for "+o.id+".");
}
function b2bHandleOrderStatusSelection(id,status){const o=b2bGetOrder(id);if(!o)return;if(status==="Failed"||status==="Variance"){b2bOpenOrderStatusModal(id,status);return;}o.status=status;o.statusReason="";o.updatedAt=b2bTimestamp();render();showToast(o.id+" status updated to "+status+".");}
function b2bOpenOrderStatusModal(id,status){const o=b2bGetOrder(id);if(!o)return;const i=b2bGetInquiry(o.inquiryId);state.b2bOrderStatusContext={orderId:id,status};const variance=status==="Variance",placeholder=variance?"e.g. 3 Tomato Trees were damaged, so delivered quantity changed from 70 to 67.":"e.g. Delivery failed because the customer site was closed or the vehicle broke down.";openModal(modalHead(status+" Reason",o.id)+`<div style="padding:14px;"><div style="background:#f8faf8;border:1px solid #e2eae3;border-radius:11px;padding:10px;">${b2bProfileRow("Order Number",o.id)}${b2bProfileRow("Customer",i?i.company:"")}${b2bProfileRow("Selected Status",status)}</div><label style="${labelStyle()}margin-top:9px;">${variance?"Reason for Variance *":"Failure Reason *"}<textarea id="b2bOrderStatusReason" placeholder="${placeholder}" style="${inputStyle()}min-height:85px;margin-top:5px;">${esc(o.status===status?o.statusReason:"")}</textarea></label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">${btn("✓ Save Status & Reason","b2bSaveOrderStatusReason()")}${btn("Cancel","closeModal();render()","light")}</div></div>`);}
function b2bSaveOrderStatusReason(){const o=b2bGetOrder(state.b2bOrderStatusContext.orderId),reason=document.getElementById("b2bOrderStatusReason").value.trim();if(!o)return;if(!reason){showToast("Please enter the reason for "+state.b2bOrderStatusContext.status.toLowerCase()+".",true);return;}o.status=state.b2bOrderStatusContext.status;o.statusReason=reason;o.updatedAt=b2bTimestamp();closeModal();render();showToast(o.id+" updated to "+o.status+" with reason.");}

}

function decodeExactCustomerReviewMIMO6HTML(){
  const binary=atob(EXACT_CUSTOMER_REVIEW_MIMO6_HTML_BASE64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }
  return new TextDecoder("utf-8").decode(bytes);
}

function mountExactCustomerReviewMIMO6(){
  const frame=document.getElementById("exactCustomerReviewMIMO6Frame");
  if(!frame)return;

  const exactHTML=decodeExactCustomerReviewMIMO6HTML();

  frame.onload=function(){
    let resizeQueued=false;
    const resizeFrame=function(){
      if(resizeQueued)return;
      resizeQueued=true;
      requestAnimationFrame(function(){
        resizeQueued=false;
        try{
          const doc=frame.contentDocument;
          if(!doc)return;
          const body=doc.body;
          const html=doc.documentElement;
          const height=Math.max(
            body ? body.scrollHeight : 0,
            body ? body.offsetHeight : 0,
            html ? html.clientHeight : 0,
            html ? html.scrollHeight : 0,
            html ? html.offsetHeight : 0
          );
          if(height)frame.style.height=Math.max(height,720)+"px";
        }catch(error){
          frame.style.height="calc(100vh - 80px)";
        }
      });
    };

    resizeFrame();
    setTimeout(resizeFrame,100);
    setTimeout(resizeFrame,500);
    setTimeout(resizeFrame,1200);

    try{
      const doc=frame.contentDocument;
      if(doc && doc.body){
        const observer=new MutationObserver(resizeFrame);
        observer.observe(doc.body,{childList:true,subtree:true,attributes:true,characterData:true});

        if(typeof ResizeObserver!=="undefined"){
          const sizeObserver=new ResizeObserver(resizeFrame);
          sizeObserver.observe(doc.documentElement);
          sizeObserver.observe(doc.body);
          frame._reviewSizeObserver=sizeObserver;
        }

        frame._reviewMutationObserver=observer;
        if(frame.contentWindow){
          frame.contentWindow.addEventListener("resize",resizeFrame);
          frame.contentWindow.addEventListener("load",resizeFrame);
        }
      }
    }catch(error){
      // Fallback keeps the embedded dashboard usable with its own scrolling.
    }
  };

  frame.srcdoc=exactHTML;
}

function reviewsView(){
  setTimeout(mountExactCustomerReviewMIMO6,0);
  return `
    <div style="width:100%;min-width:0;margin:0;padding:0;background:transparent;overflow:hidden;">
      <iframe
        id="exactCustomerReviewMIMO6Frame"
        title="OM Nursery Customer Review Dashboard"
        style="display:block;width:100%;min-width:0;min-height:720px;height:calc(100vh - 80px);border:0;margin:0;padding:0;background:#f4f7f5;border-radius:0;overflow:auto;"
      ></iframe>
    </div>

function decodeExactRFIDIdentificationHTML(){
  const binary=atob(EXACT_RFID_IDENTIFICATION_HTML_BASE64);
  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i]=binary.charCodeAt(i);
  }

  return new TextDecoder("utf-8").decode(bytes);
}

function mountExactRFIDIdentification(){
  const frame=document.getElementById("exactRFIDIdentificationFrame");
  if(!frame)return;

  const exactHTML=decodeExactRFIDIdentificationHTML();

  frame.onload=function(){
    const resizeFrame=function(){
      try{
        const doc=frame.contentDocument;
        if(!doc)return;

        const body=doc.body;
        const html=doc.documentElement;
        const height=Math.max(
          body ? body.scrollHeight : 0,
          body ? body.offsetHeight : 0,
          html ? html.clientHeight : 0,
          html ? html.scrollHeight : 0,
          html ? html.offsetHeight : 0
        );

        if(height){
          frame.style.height=Math.max(height,720)+"px";
        }
      }catch(error){
        frame.style.height="calc(100vh - 80px)";
      }
    };

    resizeFrame();

    try{
      const doc=frame.contentDocument;
      if(doc && doc.body){
        const observer=new MutationObserver(function(){
          requestAnimationFrame(resizeFrame);
        });

        observer.observe(doc.body,{
          childList:true,
          subtree:true,
          attributes:true,
          characterData:true
        });

        if(frame.contentWindow){
          frame.contentWindow.addEventListener("resize",resizeFrame);
          frame.contentWindow.addEventListener("load",resizeFrame);
        }
      }
    }catch(error){
      // The exact RFID page remains fully usable with its own scrolling if auto-resize is unavailable.
    }
  };

  frame.srcdoc=exactHTML;
}

function rfidView(){
  setTimeout(mountExactRFIDIdentification,0);

  return `

          padding:0;

          overflow:auto;
        "
      ></iframe>
    </div>
  `;
}

function decodeBase64Utf8(base64){
  try{
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }catch(error){
    try{
      return decodeURIComponent(Array.prototype.map.call(atob(base64),function(c){
        return "%"+("00"+c.charCodeAt(0).toString(16)).slice(-2);
      }).join(""));
    }catch(fallbackError){
      console.error("Unable to decode embedded module HTML",fallbackError);
      return "<div style=\"padding:24px;font-family:Arial;color:#b42331\">Unable to load Plant Inventory module.</div>";
    }
  }
}

function mountPlantInventoryMIMO8(){
  const frame=document.getElementById("plantInventoryMIMO8Frame");
  if(!frame || frame.dataset.loaded==="1")return;
  frame.dataset.loaded="1";
  const exactHTML=decodeBase64Utf8(EXACT_PLANT_INVENTORY_MIMO8_BASE64);
  frame.onload=function(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const resizeFrame=()=>{
        try{
          const body=doc.body,html=doc.documentElement;
          const h=Math.max(body?body.scrollHeight:0,html?html.scrollHeight:0,720);
          frame.style.height=Math.min(Math.max(h,720),7200)+"px";
        }catch(error){}
      };
      resizeFrame();
      setTimeout(resizeFrame,80);
      setTimeout(resizeFrame,400);
      const observer=new MutationObserver(resizeFrame);
      observer.observe(doc.documentElement,{subtree:true,childList:true,attributes:true});
      frame._inventoryMutationObserver=observer;
      if(typeof ResizeObserver!=="undefined"){
        const ro=new ResizeObserver(resizeFrame);
        ro.observe(doc.documentElement);
        if(doc.body)ro.observe(doc.body);
        frame._inventorySizeObserver=ro;
      }
      if(frame.contentWindow)frame.contentWindow.addEventListener("resize",resizeFrame);
    }catch(error){}
  };
  frame.srcdoc=exactHTML;
}

      <div style="display:grid;grid-template-columns:repeat(${state.mobile?2:4},minmax(0,1fr));gap:${state.mobile?"7px":"12px"};margin-bottom:18px;">
        ${detail("Requested Qty",v.requested)}${detail("Received Qty",v.received)}${detail("Short Qty",v.short)}${detail("Damaged Qty",v.damaged)}
      </div>

      <div style="display:grid;grid-template-columns:${state.mobile?"1fr":"1fr 1fr"};gap:12px;margin-bottom:18px;">
        <div style="background:#fff;border:1px solid #e6eee6;border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(0,20,0,.04);min-width:0;">
          <div style="margin-bottom:12px;color:#1a4d2a;font-size:14px;font-weight:950;">Received vs Short vs Damaged</div>${varianceBars(v)}
        </div>
        <div style="background:#fff;border:1px solid #e6eee6;border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(0,20,0,.04);min-width:0;">
          <div style="margin-bottom:12px;color:#1a4d2a;font-size:14px;font-weight:950;">Stock Quality Split</div>${varianceDonut(v)}
          <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:8px;font-weight:900;color:#657469;"><span>🟢 Healthy ${healthy}</span><span>🟡 Damaged ${v.damaged}</span><span>🔴 Short ${v.short}</span></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:${state.mobile?"1fr":"1fr 1fr"};gap:12px;margin-bottom:18px;">
        <div style="background:#f8fbf8;border:1px solid #e1eee1;border-radius:18px;padding:16px;">
          <div style="margin:0 0 10px;color:#1a4d2a;font-size:14px;font-weight:950;">Variance Summary</div>
          <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e4eee4;font-size:10px;font-weight:850;"><span>Fulfilment Rate</span><span>${v.fulfilment}%</span></div>
          <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e4eee4;font-size:10px;font-weight:850;"><span>Damage Rate</span><span style="color:${Number(damageRate)>5?'#b42331':'#1a7a3b'};">${damageRate}%</span></div>
          <div style="display:flex;justify-content:space-between;padding:9px 0;font-size:10px;font-weight:850;"><span>Healthy Stock Received</span><span>${healthy}</span></div>
        </div>
        <div style="background:#f8fbf8;border:1px solid #e1eee1;border-radius:18px;padding:16px;">
          <div style="margin:0 0 10px;color:#1a4d2a;font-size:14px;font-weight:950;">Supervisor Comment</div>
          <div style="margin:0;color:#5a6f5a;line-height:1.65;font-size:10px;font-weight:700;">${esc(v.comment||"No comment submitted yet.")}</div>
        </div>
      </div>

      ${state.mobile ? `<div style="display:grid;gap:8px;">${itemRows.map(r=>`<div style="border:1px solid #e6eee6;border-radius:14px;padding:12px;background:#fff;"><div style="font-size:11px;font-weight:950;color:#173f27;margin-bottom:8px;">${r[0]}</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;">${detail("Requested",r[1])}${detail("Received",r[2])}${detail("Short",r[3])}${detail("Damaged",r[4])}</div><div style="margin-top:8px;">${pill((r[3]||r[4])?"Variance Found":"Matched",(r[3]||r[4])?"red":"green")}</div></div>`).join("")}</div>` : tableWrap(["Stock","Requested","Received","Short","Damaged","Status"],itemRows.map(r=>`<tr>${td(esc(r[0]),true)}${td(r[1])}${td(r[2])}${td(`<span style="color:${r[3]?'#b42331':'#1a7a3b'};font-weight:900;">${r[3]}</span>`)}${td(`<span style="color:${r[4]?'#b42331':'#1a7a3b'};font-weight:900;">${r[4]}</span>`)}${td(statusPill((r[3]||r[4])?"Variance Found":"Matched"))}</tr>`).join(""),"760px")}
    </section>
  </div>`;
}

function openVariance(po){const v=varianceReports.find(x=>x.po===po);openModal(modalHead("Variance Report",po)+`<div style="padding:14px;"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:7px;">${detail("Vendor",v.vendor)}${detail("Requested",v.requested)}${detail("Received",v.received)}${detail("Short",v.short)}${detail("Damaged",v.damaged)}${detail("Fulfilment",v.fulfilment+"%")}${detail("Status",v.status)}${detail("Comment",v.comment)}</div></div>`);}

function modalHead(title,sub){
  return `<div style="background:linear-gradient(145deg,#173f27,#245b38);color:#fff;padding:14px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:9px;"><div><div style="font-size:16px;font-weight:950;">${esc(title)}</div><div style="font-size:8px;color:rgba(255,255,255,.75);margin-top:3px;">${esc(sub||"")}</div></div><button onclick="closeModal()" style="border:none;background:rgba(255,255,255,.12);color:#fff;width:31px;height:31px;border-radius:9px;font-size:17px;cursor:pointer;">×</button></div>`;
}
function inputStyle(){return "width:100%;box-sizing:border-box;border:1px solid #dbe6dc;border-radius:10px;padding:9px 10px;background:#fff;color:#1f2f25;font:inherit;font-size:9px;outline:none;";}
function labelStyle(){return "display:block;font-size:8px;color:#173f27;font-weight:900;";}
function openProfile(){
  openModal(modalHead("Head of Operations Profile",hoop.name)+`<div style="padding:14px;"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;">${detail("Employee ID",hoop.employeeId)}${detail("Role",hoop.role)}${detail("Phone",hoop.phone)}${detail("Email",hoop.email)}${detail("Base",hoop.base)}${detail("Status",hoop.status)}</div><div style="margin-top:11px;">${btn("Logout","logout()","red")}</div></div>`);
}
function logout(){closeModal();state.loggedIn=false;render();}
function renderLoggedOut(){
  document.getElementById("app").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;"><div style="width:min(420px,100%);background:#fff;border:1px solid #e2eae3;border-radius:18px;padding:22px;text-align:center;"><div style="font-size:38px;">🌿</div><div style="font-size:18px;color:#173f27;font-weight:950;margin-top:7px;">Operations Session Ended</div><div style="font-size:9px;color:#718176;margin-top:5px;">Prototype logout screen.</div><div style="margin-top:12px;">${btn("Login Again","state.loggedIn=true;state.view='home';render()")}</div></div></div>`;
}

  if(m!==state.mobile){state.mobile=m;state.drawer=false;render();}
});
