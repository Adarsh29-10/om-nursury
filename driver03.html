<html>
<head>

<body style="margin:0;background:#f4f7f5;color:#1e2e24;font-family:Inter,Arial,sans-serif;min-height:100vh;">

  <div id="app"></div>

  <!-- ISSUE MODAL -->
  <div id="issueModal"
       onclick="if(event.target===this) closeIssueModal()"
       style="display:none;position:fixed;inset:0;background:rgba(8,28,17,.65);backdrop-filter:blur(7px);z-index:9999;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;">

    <div style="width:min(520px,100%);background:#fff;border-radius:26px;box-shadow:0 30px 90px rgba(0,20,0,.32);overflow:hidden;">

      <div style="padding:21px 22px;background:linear-gradient(145deg,#8f201f,#b42331);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;">
        <div>
          <div style="font-size:18px;font-weight:900;">⚠ Report Delivery Issue</div>
          <div id="issueTaskNumber" style="font-size:11px;color:rgba(255,255,255,.8);margin-top:4px;"></div>
        </div>

        <button onclick="closeIssueModal()"
                style="border:none;width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.13);color:#fff;font-size:20px;cursor:pointer;">
          ×
        </button>
      </div>

      <div style="padding:22px;">

        <label style="display:block;color:#1a4d2a;font-size:13px;font-weight:850;margin-bottom:7px;">
          What is the issue?
        </label>

        <select id="issueReason"
                style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:14px;padding:13px 14px;background:#fff;color:#1e2e24;font:inherit;font-size:14px;font-weight:650;outline:none;margin-bottom:16px;">
          <option value="">Select issue</option>
          <option>Traffic / Delivery Delay</option>
          <option>Vehicle Breakdown</option>
          <option>Customer Not Available</option>
          <option>Wrong / Incomplete Address</option>
          <option>Plant / Material Damage</option>
          <option>Pickup Not Ready</option>
          <option>Unable to Contact Customer</option>
          <option>Other</option>
        </select>

        <label style="display:block;color:#1a4d2a;font-size:13px;font-weight:850;margin-bottom:7px;">
          Short Note
        </label>

        <textarea id="issueNote"
                  placeholder="Tell the supervisor what happened..."
                  style="width:100%;min-height:100px;resize:vertical;box-sizing:border-box;border:1px solid #dbe8db;border-radius:14px;padding:13px 14px;background:#fff;color:#1e2e24;font:inherit;font-size:14px;font-weight:600;outline:none;"></textarea>

        <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">

          <button onclick="closeIssueModal()"
                  style="flex:1;min-width:130px;border:1px solid #dbe8db;background:#fff;color:#1a4d2a;border-radius:999px;padding:13px 18px;font-weight:850;cursor:pointer;">
            Cancel
          </button>

          <button onclick="submitIssue()"
                  style="flex:1;min-width:180px;border:none;background:#b42331;color:#fff;border-radius:999px;padding:13px 18px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(180,35,49,.2);">
            Submit Issue

        </div>
      </div>
    </div>

    const statusSequence = [
      "Assigned",
      "Going to Pickup",
      "At Pickup",
      "Picked Up",
      "In Transit",
      "Delivered"
    ];


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function myTasks() {
      return state.tasks.
      filter(task => task.driverId === currentDriver.id);
    }


    function filteredTasks() {

      let tasks = myTasks();

      if (state.filter === "active") {
        tasks = tasks.filter(task =>
          task.status !== "Delivered"
        );
      }

      if (state.filter === "completed") {
        tasks = tasks.filter(task =>
          task.status === "Delivered"
        );
      }

      if (state.filter === "issue") {
        tasks = tasks.filter(task =>
          task.status === "Issue"
        );
      }

      return tasks;
    }


    function statusMeta(status) {

      const map = {

        "Assigned": {
          bg: "#fff4d8",
          color: "#8b6500",
          icon: "📌",
          label: "Assigned"
        },

        "Going to Pickup": {
          bg: "#e6f3ff",
          color: "#1363a5",
          icon: "🚚",
          label: "Going to Pickup"
        },

        "At Pickup": {
          bg: "#efe5ff",
          color: "#6733a6",
          icon: "📍",
          label: "At Pickup"
        },

        "Picked Up": {
          bg: "#e8f5ea",
          color: "#17643a",
          icon: "📦",
          label: "Picked Up"
        },

        "In Transit": {
          bg: "#e6f3ff",
          color: "#135d84",
          icon: "🚚",
          label: "In Transit"
        },

        "Delivered": {
          bg: "#dcf7ea",
          color: "#0f7a45",
          icon: "✅",
          label: "Delivered"
        },

        "Issue": {
          bg: "#ffe3e6",
          color: "#b42331",
          icon: "⚠",
          label: "Issue Reported"
        }

      };

      return map[status] || map["Assigned"];
    }


    function priorityStyle(priority) {

      if (priority === "High") {
        return {
          bg: "#fff0ef",
          color: "#b42331",
          icon: "●"
        };
      }

      return {
        bg: "#eef6ef",
        color: "#1a4d2a",
        icon: "●"
      };
    }


    function nextAction(status) {

      if (status === "Assigned") {
        return {
          label: "Start Trip",
          icon: "🚚",
          next: "Going to Pickup"
        };
      }

      if (status === "Going to Pickup") {
        return {
          label: "I Reached Pickup",
          icon: "📍",
          next: "At Pickup"
        };
      }

      if (status === "At Pickup") {
        return {
          label: "Confirm Pickup",
          icon: "📦",
          next: "Picked Up"
        };
      }

      if (status === "Picked Up") {
        return {
          label: "Start Delivery",
          icon: "🚚",
          next: "In Transit"
        };
      }

      if (status === "In Transit") {
        return {
          label: "Mark Delivered",
          icon: "✅",
          next: "Delivered"
        };
      }

      if (status === "Issue") {
        return {
          label: "Resume Delivery",
          icon: "↻",
          next: null
        };
      }

      return null;
    }


    function progressPercent(task) {

      if (task.status === "Delivered") {
        return 100;
      }

      if (task.status === "Issue") {
        const status = task.previousStatus || "Assigned";
        const index = statusSequence.indexOf(status);
        return Math.max(8, (index / (statusSequence.length - 1)) * 100);
      }

      const index = statusSequence.indexOf(task.status);

      if (index < 0) {
        return 0;
      }

      return (index / (statusSequence.length - 1)) * 100;
    }


    function currentTime() {

      return new Date().toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }


    function showToast(message, error = false) {

      const toast = document.getElementById("toast");

      toast.textContent = (error ? "⚠ " : "✓ ") + message;

      toast.style.background = error ? "#b42331" : "#1a4d2a";

      toast.style.opacity = "1";
      toast.style.transform = "translateY(0)";

      clearTimeout(toast.timer);

      toast.timer = setTimeout(() => {

        toast.style.opacity = "0";
        toast.style.transform = "translateY(70px)";

      }, 2600);
    }

      state.currentView = "dashboard";
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    }


    function logoutDriver() {
      closeIssueModal();
      closeDetails();
      state.loggedIn = false;
      state.currentView = "dashboard";
      render();
      showToast("Logged out successfully.");
    }


    function loginDriver() {
      state.loggedIn = true;
      state.currentView = "dashboard";
      render();
      showToast("Welcome back, " + currentDriver.shortName + ".");
    }



    function openVehicleModal(taskId) {

      const task = state.tasks.find(item =>
        item.id === taskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;
      }

      state.vehicleTaskId = taskId;

      document.getElementById("vehicleTaskLabel").textContent =
        task.title + " · " + task.id;

      document.getElementById("tripVehicleNumber").value =
        task.tripVehicle ? task.tripVehicle.number : "";

      document.getElementById("tripVehicleCompany").value =
        task.tripVehicle ? task.tripVehicle.company : "";

      document.getElementById("vehicleModal").style.display = "flex";

      setTimeout(() => {
        document.getElementById("tripVehicleNumber").focus();
      }, 50);
    }


    function closeVehicleModal() {
      state.vehicleTaskId = null;
      document.getElementById("vehicleModal").style.display = "none";
    }


    function confirmVehicleAndStartTrip() {

      const task = state.tasks.find(item =>
        item.id === state.vehicleTaskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        closeVehicleModal();
        return;
      }

      const number = document.getElementById("tripVehicleNumber").value.trim().toUpperCase();
      const company = document.getElementById("tripVehicleCompany").value.trim();

      if (!number || !company) {
        showToast("Enter vehicle number and company / model.", true);
        return;
      }

      task.tripVehicle = {
        number,
        company,
        savedAt: currentTime()
      };

      task.status = "Going to Pickup";

      task.history.push({
        status: "Going to Pickup · Vehicle " + number,
        time: currentTime()
      });

      closeVehicleModal();
      render();
      showToast("Vehicle saved. Trip started.");
    }


    function advanceTask(taskId) {

      const task = state.tasks.find(item =>
        item.id === taskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;
      }

      if (task.status === "Assigned") {
        openVehicleModal(taskId);
        return;
      }


      if (task.status === "Issue") {

        task.status = task.previousStatus || "Assigned";
        task.previousStatus = null;
        task.issue = null;

        task.history.push({
          status: "Issue Resolved / Delivery Resumed",
          time: currentTime()
        });

        render();

        showToast(
          task.id + " delivery resumed."
        );

        return;
      }


      const currentIndex = statusSequence.indexOf(task.status);

      if (currentIndex === -1 ||
          currentIndex >= statusSequence.length - 1) {
        return;
      }


      task.status = statusSequence[currentIndex + 1];

      task.history.push({
        status: task.status,
        time: currentTime()
      });


      render();


      if (task.status === "Delivered") {

        showToast(
          task.reference + " marked as delivered."
        );

      } else {

        showToast(
          "Status updated to " + task.status + "."
        );
      }
    }


    function openIssueModal(taskId) {

      const task = state.tasks.find(item =>
        item.id === taskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;
      }

      state.issueTaskId = taskId;

      document.getElementById("issueTaskNumber").textContent =
        task.id + " · " + task.reference;

      document.getElementById("issueReason").value = "";
      document.getElementById("issueNote").value = "";

      document.getElementById("issueModal").style.display = "flex";
    }


    function closeIssueModal() {

      state.issueTaskId = null;

      document.getElementById("issueModal").style.display = "none";
    }


    function submitIssue() {

      const reason =
        document.getElementById("issueReason").value;

      const note =
        document.getElementById("issueNote").value.trim();


      if (!reason) {

        showToast(
          "Please select the issue.",
          true
        );

        return;
      }


      const task = state.tasks.find(item =>
        item.id === state.issueTaskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;
      }


      if (task.status !== "Issue") {
        task.previousStatus = task.status;
      }


      task.status = "Issue";

      task.issue = {
        reason: reason,
        note: note,
        reportedAt: currentTime()
      };


      task.history.push({
        status: "Issue Reported · " + reason,
        time: currentTime()
      });


      closeIssueModal();

      render();

      showToast(
        "Issue reported to supervisor.",
        true
      );
    }


    function openRoute(taskId) {

      const task = state.tasks.find(item =>
        item.id === taskId &&
        item.driverId === currentDriver.id
      );

      if (!task) {
        return;
      }


      const destination =
        encodeURIComponent(task.deliveryAddress);


      window.open(
        "https://www.google.com/maps/search/?api=1&query=" +
        destination,
        "_blank"
      );
    }


    function callNumber(number) {

      const safeNumber =
        String(number || "").replace(/[^\d+]/g, "");

      if (!safeNumber) {

        showToast(
          "Contact number is not available.",
          true
        );

        return;
      }

      window.location.href = "tel:" + safeNumber;
    }

            font-weight:900;
            margin-top:5px;
            word-break:break-word;

    function closeDetails() {

      state.detailTaskId = null;

      document.getElementById("detailModal").style.display = "none";
    }


    document.addEventListener("keydown", function(event) {

      if (event.key === "Escape") {

        closeIssueModal();
        closeDetails();
      }
    });


    render();

  </script>

</body>
