function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function nowText(){return new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}function myWO(){return workOrders.filter(w=>w.supervisors.includes(supervisor.shortName))}function myB2B(){return b2bOrders.filter(o=>o.supervisor===supervisor.shortName)}
function showToast(msg,error=false){const t=document.getElementById('toast');t.textContent=(error?'⚠ ':'✓ ')+msg;t.style.background=error?'#b42331':'#1a4d2a';t.style.opacity='1';t.style.transform='translateY(0)';clearTimeout(t._timer);t._timer=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(70px)'},2500)}
function openModal(html,width='820px'){const m=document.getElementById('modal'),b=document.getElementById('modalBox');b.style.width=`min(${width},100%)`;b.innerHTML=html;m.style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('modalBox').innerHTML=''}
function headerBlock(title,sub,icon){return `<div style="margin-bottom:16px;"><div style="font-size:10px;color:#9a7512;font-weight:900;text-transform:uppercase;letter-spacing:.08em;">${icon} SUPERVISOR WORKSPACE</div><div style="font-size:22px;color:#1a4d2a;font-weight:950;margin-top:5px;">${title}</div><div style="font-size:11px;color:#6c7e71;line-height:1.55;margin-top:5px;">${sub}</div></div>`}function sectionCard(c){return `<section style="background:#fff;border:1px solid #e2ece3;border-radius:22px;padding:15px;box-shadow:0 8px 24px rgba(0,20,0,.05);margin-bottom:14px;">${c}</section>`}
function pill(text,tone='green'){const c=tone==='red'?['#ffe3e6','#b42331']:tone==='gold'?['#fff4d8','#7a5c00']:tone==='blue'?['#e6f3ff','#1363a5']:['#e8f5ea','#17643a'];return `<span style="display:inline-flex;padding:5px 8px;border-radius:999px;background:${c[0]};color:${c[1]};font-size:9px;font-weight:900;white-space:nowrap;">${esc(text)}</span>`}function statusPill(s){const red=['Halted','Attention','Failed','Variance'].some(x=>String(s).includes(x)),blue=['In-Progress','In Transit','Driver Assigned'].some(x=>String(s).includes(x)),gold=['Pending','Partially','Assigned'].some(x=>String(s).includes(x));return pill(s,red?'red':blue?'blue':gold?'gold':'green')}
function button(label,onclick,tone='green',extra=''){const bg=tone==='red'?'#b42331':tone==='gold'?'#f5c542':tone==='light'?'#fff':'#1a4d2a',color=tone==='gold'?'#1e2e24':tone==='light'?'#1a4d2a':'#fff',border=tone==='light'?'1px solid #d8e5d9':'none';return `<button onclick="${onclick}" style="border:${border};background:${bg};color:${color};border-radius:999px;padding:9px 12px;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap;${extra}">${label}</button>`}
function navBtn(id,icon,label){const active=state.view===id;return `<button onclick="state.view='${id}';render()" style="border:${active?'1px solid #1a4d2a':'1px solid transparent'};background:${active?'#1a4d2a':'#f4f7f5'};color:${active?'#fff':'#47604e'};border-radius:13px;padding:10px 12px;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap;flex:0 0 auto;">${icon} ${label}</button>`}
function metric(icon,label,value,note){return `<div style="background:#fff;border:1px solid #e2ece3;border-radius:17px;padding:13px;min-height:80px;box-shadow:0 7px 18px rgba(0,20,0,.04);"><div style="font-size:10px;color:#718176;font-weight:800;">${icon} ${label}</div><div style="font-size:22px;color:#1a4d2a;font-weight:950;margin-top:11px;">${value}</div><div style="font-size:8px;color:#8a978d;margin-top:3px;">${note}</div></div>`}
function detail(label,value){return `<div style="border:1px solid #e2ebe3;border-radius:12px;padding:10px;background:#fbfdfb;"><div style="font-size:8px;color:#829085;font-weight:900;text-transform:uppercase;">${label}</div><div style="font-size:11px;color:#294631;font-weight:900;margin-top:4px;word-break:break-word;">${esc(value)}</div></div>`}
function renderTop(){const activeWO=myWO().filter(w=>w.status!=='Completed').length;return `<div style="position:sticky;top:0;z-index:200;background:rgba(244,247,245,.96);backdrop-filter:blur(10px);padding:9px 0 7px;"><div style="background:#fff;border:1px solid #e1ebe2;border-radius:17px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 8px 24px rgba(0,20,0,.06);"><div style="display:flex;align-items:center;gap:9px;min-width:0;"><div style="width:36px;height:36px;min-width:36px;border-radius:11px;background:#1a4d2a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;">🌿</div><div style="min-width:0;"><div style="font-size:8px;color:#728176;font-weight:800;">OM NURSERY · SUPERVISOR</div><div style="font-size:14px;color:#1a4d2a;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Hello, ${esc(supervisor.shortName)} 👋</div></div></div><div style="display:flex;gap:6px;align-items:center;"><span style="background:#eef6ef;color:#1a4d2a;border-radius:999px;padding:6px 8px;font-size:8px;font-weight:900;">${activeWO} Active WO</span>${button('👤 Profile','openProfile()','light')}</div></div><div style="display:flex;gap:5px;overflow-x:auto;padding:7px 1px 1px;scrollbar-width:none;">${navBtn('dashboard','⌂','Home')}${navBtn('workorders','🧾','Work Orders')}${navBtn('material','📦','Material')}${navBtn('rfidadd','🏷','RFID Add')}${navBtn('b2b','🤝','B2B Orders')}${navBtn('identify','📡','RFID Identify')}${navBtn('po','🚚','PO Receiving')}</div></div>`}
function render(){if(!state.loggedIn){renderLoggedOut();return}let c=dashboardView();if(state.view==='workorders')c=workOrdersView();if(state.view==='material')c=materialView();if(state.view==='rfidadd')c=rfidAdditionView();if(state.view==='b2b')c=b2bView();if(state.view==='identify')c=identifyView();if(state.view==='po')c=poView();document.getElementById('app').innerHTML=`<div style="width:min(1200px,calc(100% - 16px));margin:0 auto;padding:0 0 30px;box-sizing:border-box;">${renderTop()}${c}</div>`;if(state.view==='po')setTimeout(drawVarianceCharts,80)}
function dashboardView(){const mine=myWO(),b2b=myB2B();return `<div style="background:linear-gradient(145deg,#1a4d2a,#2d6e3e);border-radius:21px;padding:18px;margin:7px 0 14px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 34px rgba(0,20,0,.14);"><div style="position:absolute;right:-10px;bottom:-35px;font-size:110px;opacity:.08;">🌿</div><div style="position:relative;z-index:2;"><div style="font-size:9px;color:#f5c542;font-weight:900;">TODAY'S SUPERVISOR WORK</div><div style="font-size:24px;font-weight:950;margin-top:4px;">Your assigned work in one place</div><div style="font-size:11px;line-height:1.55;color:rgba(255,255,255,.82);margin-top:6px;max-width:760px;">Work orders, materials, RFID operations, B2B deliveries and purchase receiving are grouped here according to the supervisor role.</div></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:14px;">${metric('🧾','My Work Orders',mine.length,'Assigned to Ramesh')}${metric('⚠','Needs Attention',mine.filter(w=>['Halted','Attention'].includes(w.status)).length,'Work exceptions')}${metric('🏷','RFID Mapped',state.individualLogs.length+state.groupLogs.length,'This session')}${metric('🤝','B2B Orders',b2b.length,'Assigned orders')}${metric('🚚','Open PO',purchaseOrders.filter(p=>p.status!=='Received').length,'Receiving pending')}</div>${sectionCard(`${headerBlock('Assigned Work Orders','Only work orders assigned to you are surfaced here.','🧾')}<div style="display:grid;gap:8px;">${mine.map(w=>`<div style="border:1px solid #e2ebe3;border-radius:14px;padding:11px;background:#fbfdfb;"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><div style="font-size:12px;font-weight:950;color:#1a4d2a;">${w.id} · ${w.plants.join(', ')}</div><div style="font-size:9px;color:#758379;margin-top:3px;">${w.farm} · ${w.block} · ${w.quantity} plants · ${w.startDate} → ${w.endDate}</div></div>${statusPill(w.status)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;">${button('View Work Order',`openWorkOrder('${w.id}')`,'light')}${w.status!=='Completed'?button('Update Status',`openWOStatus('${w.id}')`):''}</div></div>`).join('')}</div>`)}${sectionCard(`${headerBlock('Quick Actions','Jump directly to your operational actions.','⚡')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:7px;">${button('📦 Material Allocation',"state.view='material';render()",'green','width:100%;')}${button('🏷 RFID Inventory Add',"state.view='rfidadd';render()",'green','width:100%;')}${button('📡 Identify Plant',"state.view='identify';render()",'green','width:100%;')}${button('🚚 Receive Purchase',"state.view='po';render()",'green','width:100%;')}</div>`)}`}
function workOrdersView(){

  return sectionCard(`
    ${headerBlock(
      'Work Order Status',
      'Supervisor work-order status table. The Material Requirement column only shows whether your material requirement has been submitted. Stock availability and internal transfer information are not available in this role.',
      '🧾'
    )}

    <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;">
      ${['All','In-Progress','Completed','Halted','Attention'].map(s=>
        button(s,`state.woStatusFilter='${s}';render()`,state.woStatusFilter===s?'green':'light')
      ).join('')}
    </div>

    <div style="overflow-x:auto;border:1px solid #e1ebe2;border-radius:14px;-webkit-overflow-scrolling:touch;">
      <table style="border-collapse:collapse;width:100%;min-width:1080px;font-size:10px;">
        <thead>
          <tr style="background:#edf5ef;color:#1a4d2a;text-align:left;">
            ${[
              'Work Order',
              'Assigned On',
              'Farm / Block',
              'Plants & Stage',
              'Actions',
              'Schedule',
              'Work Status',
              'Efficiency',
              'Material Requirement',
              'Action'
            ].map(h=>`<th style="padding:10px;border-bottom:1px solid #d7e5d9;white-space:nowrap;">${h}</th>`).join('')}
          </tr>
        </thead>

        <tbody>
          ${rows.map(w=>`
            <tr>
              <td style="padding:10px;border-bottom:1px solid #e7eee7;font-weight:950;color:#1a4d2a;white-space:nowrap;">${w.id}</td>
              <td style="padding:10px;border-bottom:1px solid #e7eee7;white-space:nowrap;">${w.assignedOn}</td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;">
                <strong>${w.farm}</strong><br>${w.block}
              </td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;">
                <strong>${w.plants.join(', ')}</strong><br>
                ${w.stages.join(', ')} · ${w.quantity}
              </td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;">
                ${w.actions.join('<br>')}
              </td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;white-space:nowrap;">
                ${w.startDate} → ${w.endDate}<br>${w.estimatedTime}
              </td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;">
                ${statusPill(w.status)}
                <div style="max-width:210px;color:#6c7e71;margin-top:4px;line-height:1.4;">${w.message}</div>
              </td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;font-weight:900;">
                ${w.efficiency}%
              </td>

              <td style="padding:10px;border-bottom:1px solid #e7eee7;">

function suggestedReq(w){
  const q=w.quantity;
  const adult=w.stages.includes('Adult');
  const child=w.stages.includes('Child');

  return {
    'RM-001':Math.ceil(q/(adult?8:child?10:12)),
    'RM-002':w.stages.includes('Sapling')?Math.ceil(q*.65):0,
    'RM-003':child?Math.ceil(q*.55):0,
    'RM-004':adult?Math.ceil(q*.55):0,
    'RM-005':Math.max(1,Math.ceil(q/50)),
    'RM-006':Math.ceil(q/28),
    'RM-007':Math.ceil(q*.42),
    'RM-008':q
  };
}

function syncAllocationInputs(id){
  const d={};

  rawMaterials.forEach(m=>{
    d[m.id]=Math.max(
      0,
      Number(document.getElementById('req-'+m.id)?.value||0)
    );
  });

  state.allocationDraft[id]=d;
  return d;
}

function saveAllocation(id){
  const w=workOrders.find(x=>x.id===id);
  const d=syncAllocationInputs(id);

  const selected=rawMaterials.filter(
    m=>Number(d[m.id]||0)>0
  );

  if(!selected.length){
    showToast('Enter at least one material quantity before submitting.',true);
    return;
  }

  w.allocationStatus='Requirement Submitted';
  w.materialRequirementUpdatedAt=nowText();

  closeModal();
  render();

  showToast(
    id+' material requirement submitted to HO / Admin.'
  );
}

function openDriverAssign(id){const o=b2bOrders.find(x=>x.id===id);openModal(`<div style="padding:16px;"><div style="display:flex;justify-content:space-between;"><div><div style="font-size:17px;color:#1a4d2a;font-weight:950;">Assign Delivery Driver</div><div style="font-size:10px;color:#718176;margin-top:3px;">${o.id} · ${o.company}</div></div>${button('×','closeModal()','light')}</div><select id="b2bDriver" style="width:100%;border:1px solid #dbe8db;border-radius:10px;padding:9px;margin-top:12px;background:#fff;"><option value="">Select Driver</option>${drivers.map(d=>`<option ${d===o.driver?'selected':''}>${d}</option>`).join('')}</select><div style="margin-top:11px;">${button('Save Driver',`saveB2BDriver('${id}')`)}</div></div>`)}function saveB2BDriver(id){const o=b2bOrders.find(x=>x.id===id),d=document.getElementById('b2bDriver').value;if(!d){showToast('Select driver.',true);return}o.driver=d;o.deliveryStatus='Driver Assigned';closeModal();render();showToast(d+' assigned to '+id)}
function openDeliveryStatus(id){const o=b2bOrders.find(x=>x.id===id);openModal(`<div style="padding:16px;"><div style="display:flex;justify-content:space-between;"><div><div style="font-size:17px;color:#1a4d2a;font-weight:950;">Order & Delivery Status</div><div style="font-size:10px;color:#718176;margin-top:3px;">${o.id}</div></div>${button('×','closeModal()','light')}</div><label style="display:block;font-size:9px;color:#1a4d2a;font-weight:900;margin-top:12px;">Order Status</label><select id="newOrderStatus" style="width:100%;border:1px solid #dbe8db;border-radius:9px;padding:9px;margin-top:4px;background:#fff;">${['In Progress','Completed','Failed','Variance'].map(s=>`<option ${s===o.orderStatus?'selected':''}>${s}</option>`).join('')}</select><label style="display:block;font-size:9px;color:#1a4d2a;font-weight:900;margin-top:9px;">Delivery Status</label><select id="newDeliveryStatus" style="width:100%;border:1px solid #dbe8db;border-radius:9px;padding:9px;margin-top:4px;background:#fff;">${['Pending Assignment','Driver Assigned','In Transit','Delivered','Failed','Variance'].map(s=>`<option ${s===o.deliveryStatus?'selected':''}>${s}</option>`).join('')}</select><div style="margin-top:11px;">${button('Save Status',`saveDeliveryStatus('${id}')`)}</div></div>`)}function saveDeliveryStatus(id){const o=b2bOrders.find(x=>x.id===id);o.orderStatus=document.getElementById('newOrderStatus').value;o.deliveryStatus=document.getElementById('newDeliveryStatus').value;closeModal();render();showToast(id+' updated.')}

function individualIdentify(){const d=plantDatabase[state.currentIndividualCode];return `<div style="border:1px solid #e2ebe3;border-radius:14px;padding:11px;background:#fbfdfb;"><div style="font-size:12px;color:#1a4d2a;font-weight:950;">Individual RFID Scan</div><div style="font-size:9px;color:#718176;margin-top:3px;">Simulate a scan or enter an individual RFID code.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;"><input id="individualIdentifyInput" value="${esc(state.currentIndividualCode)}" placeholder="OM-KAMSHET-0234" style="flex:1;min-width:160px;border:1px solid #dbe8db;border-radius:999px;padding:9px 11px;">${button('Simulate Scan','simulateIndividualScan()','gold')}${button('Search','searchIndividual()')}</div>${d?renderIndividualDetails(d):''}${renderRecentIndividual()}</div>`}

function renderIndividualDetails(d){return `<div style="margin-top:11px;border:1px solid #dfe9df;border-radius:13px;background:#fff;padding:11px;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><div style="font-size:15px;color:#1a4d2a;font-weight:950;">${d.name}</div><div style="font-size:9px;color:#748276;margin-top:2px;">${d.botanicalName} · ${d.rfid}</div></div>${pill(d.inspected?'Inspected':'Verified')}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px;margin-top:9px;">${detail('Plant ID',d.plantId)}${detail('Location',d.farm+' · '+d.block)}${detail('Batch / Row',d.batch+' · '+d.row)}${detail('Stage',d.stage)}${detail('Height',d.height)}${detail('Width',d.width)}${detail('Age',d.age)}${detail('Container',d.container)}${detail('Propagation',d.propagation)}${detail('Grade',d.grade)}${detail('Sellable',d.sellable)}${detail('Health',d.health+' · '+d.healthScore+'%')}${detail('Moisture',d.moisture)}${detail('Fertilisation',d.fertilisation)}${detail('Pruning',d.pruning)}${detail('Pest',d.pest)}${detail('Next Action',d.nextAction)}${detail('Owner',d.owner)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;">${button('✓ Mark Inspected',`markIndividualInspected('${d.rfid}')`,'gold')}${button('🖨 Print Plant Details',`printIdentification('individual','${d.rfid}')`,'light')}</div></div>`}
function markIndividualInspected(c){plantDatabase[c].inspected=true;render();showToast(c+' marked inspected.')}function renderRecentIndividual(){return `<div style="margin-top:11px;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;">Recent Individual Scans</div><div style="display:grid;gap:5px;margin-top:6px;">${state.individualScans.length?state.individualScans.slice(0,6).map(s=>`<div style="padding:7px 8px;border:1px solid #e3ece5;border-radius:9px;background:#fff;font-size:9px;display:flex;justify-content:space-between;gap:7px;"><strong>${s.code}</strong><span style="color:#829085;">${s.time}</span></div>`).join(''):`<div style="font-size:9px;color:#829085;">No scans yet.</div>`}</div>${state.individualScans.length?`<div style="margin-top:6px;">${button('Clear History','state.individualScans=[];render()','light')}</div>`:''}</div>`}

function renderGroupDetails(d){return `<div style="margin-top:11px;border:1px solid #dfe9df;border-radius:13px;background:#fff;padding:11px;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div><div style="font-size:15px;color:#1a4d2a;font-weight:950;">${d.plant} · ${d.qty} Plants</div><div style="font-size:9px;color:#748276;margin-top:2px;">${d.rfid} · ${d.mappingId}</div></div>${pill(d.inspected?'Group Inspected':'Group Verified')}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:9px;">${detail('Farm / Block',d.farm+' · '+d.block)}${detail('Stage',d.stage)}${detail('Batch',d.batch)}${detail('Grow Bag',d.bag)}${detail('Total',d.qty)}${detail('Available',d.available)}${detail('Reserved',d.reserved)}${detail('Under Care',d.care)}${detail('Mapped On',d.mappedOn)}${detail('Mapped By',d.mappedBy)}${detail('Irrigation',d.irrigation)}${detail('Fertiliser',d.fertiliser)}${detail('Health',d.health+' · '+d.healthScore+'%')}</div><div style="margin-top:9px;padding:8px;border-radius:10px;background:#eef6ef;color:#1a4d2a;font-size:9px;font-weight:750;">Representative units belong to the same group RFID; they are not separate individual RFID tags.</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;">${button('✓ Mark Group Inspected',`markGroupInspected('${d.rfid}')`,'gold')}${button('🖨 Print Group Details',`printIdentification('group','${d.rfid}')`,'light')}</div></div>`}
function markGroupInspected(c){groupDatabase[c].inspected=true;render();showToast(c+' group marked inspected.')}function renderRecentGroup(){return `<div style="margin-top:11px;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;">Recent Group Scans</div><div style="display:grid;gap:5px;margin-top:6px;">${state.groupScans.length?state.groupScans.slice(0,6).map(s=>`<div style="padding:7px 8px;border:1px solid #e3ece5;border-radius:9px;background:#fff;font-size:9px;display:flex;justify-content:space-between;gap:7px;"><strong>${s.code}</strong><span style="color:#829085;">${s.time}</span></div>`).join(''):`<div style="font-size:9px;color:#829085;">No group scans yet.</div>`}</div>${state.groupScans.length?`<div style="margin-top:6px;">${button('Clear Group History','state.groupScans=[];render()','light')}</div>`:''}</div>`}
function printIdentification(type,code){const d=type==='group'?groupDatabase[code]:plantDatabase[code],w=window.open('','_blank');if(!w){showToast('Pop-up blocked by browser.',true);return}w.document.write(`<html><body style="font-family:Arial;padding:30px;"><h2>OM Nursery · ${type==='group'?'Group RFID':'Plant RFID'} Details</h2><pre style="white-space:pre-wrap;font-family:Arial;">${esc(JSON.stringify(d,null,2))}</pre><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function totalRequested(p){return p.items.reduce((s,i)=>s+Number(i.requested||0),0)}function totalReceived(p){return p.items.reduce((s,i)=>s+Number(i.received||0),0)}function totalDamaged(p){return p.items.reduce((s,i)=>s+Number(i.damaged||0),0)}function totalShort(p){return p.items.reduce((s,i)=>s+Math.max(0,Number(i.requested||0)-Number(i.received||0)),0)}
function poView(){const p=purchaseOrders.find(x=>x.id===state.selectedPO);return `${sectionCard(`${headerBlock('Purchase Order Receiving','Purchase order list and details from Propagation & Acquisition. Select a PO to record packing slip quantities and review variance.','🚚')}<div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;">${purchaseOrders.map(x=>`<button onclick="state.selectedPO='${x.id}';state.amountsUnlocked=false;render()" style="min-width:155px;text-align:left;border:${x.id===state.selectedPO?'2px solid #1a4d2a':'1px solid #e1ebe2'};background:${x.id===state.selectedPO?'#f1f8f1':'#fff'};border-radius:12px;padding:9px;cursor:pointer;"><strong style="font-size:10px;color:#1a4d2a;">${x.id}</strong><div style="font-size:8px;color:#728176;margin-top:3px;">${x.vendor.name}</div><div style="margin-top:5px;">${statusPill(x.status)}</div></button>`).join('')}</div>`) }${sectionCard(renderPODetails(p))}${sectionCard(renderPackingSlip(p))}${sectionCard(renderVariance(p))}`}
function renderPODetails(p){return `${headerBlock('Purchase Order Details',`${p.id} · ${p.requisitionNo} · ${p.vendor.name}`,'🧾')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px;">${detail('Farm',p.farm)}${detail('Order Date',p.orderDate)}${detail('Expected Delivery',p.expectedDelivery)}${detail('PO Amount',state.amountsUnlocked?money(p.amount):'₹••••••')}</div><div style="display:flex;gap:6px;margin-top:8px;">${button(state.amountsUnlocked?'Amount Unlocked':'View PO Amount','openAmountAccess()','gold')}</div><div style="margin-top:10px;padding:10px;border:1px solid #e2ebe3;border-radius:12px;background:#f8fbf8;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;">Vendor Details</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:6px;">${detail('Vendor',p.vendor.name)}${detail('Location',p.vendor.location)}${detail('GST',p.vendor.gst)}${detail('Contact',p.vendor.contact)}</div></div><div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px;">${p.items.map(i=>`<div style="border:1px solid #e2ebe3;border-radius:11px;padding:9px;background:#fff;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;">${i.name}</div><div style="font-size:8px;color:#829085;margin-top:2px;">${i.category}</div><div style="font-size:9px;margin-top:6px;">Requested <strong>${i.requested}</strong> · Received <strong>${i.received}</strong> · Damaged <strong style="color:#b42331;">${i.damaged}</strong></div></div>`).join('')}</div>`}
function openAmountAccess(){openModal(`<div style="padding:18px;text-align:center;"><div style="font-size:34px;">🔐</div><div style="font-size:18px;color:#1a4d2a;font-weight:950;margin-top:4px;">Amount Access</div><div style="font-size:10px;color:#718176;margin-top:4px;">Enter password to unmask PO amount.</div><input id="amountPass" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:10px;padding:10px;margin-top:12px;"><div style="display:flex;gap:6px;justify-content:center;margin-top:10px;">${button('Show Amounts','unlockAmount()')}${button('Cancel','closeModal()','light')}</div></div>`,'430px')}function unlockAmount(){if(document.getElementById('amountPass').value!=='fundsroom'){showToast('Incorrect password.',true);return}state.amountsUnlocked=true;closeModal();render();showToast('PO amount unlocked.')}
function renderPackingSlip(p){return `${headerBlock('Packing Slip Entry',`Record actual received and damaged quantity for ${p.id}.`,'📄')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:7px;">${p.items.map(i=>`<div style="border:1px solid #e2ebe3;border-radius:12px;padding:9px;background:#fbfdfb;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;">${i.name}</div><div style="font-size:8px;color:#829085;margin-top:2px;">Requested ${i.requested}</div><label style="display:block;font-size:8px;color:#1a4d2a;font-weight:900;margin-top:6px;">Actually Received<input id="recv-${i.id}" type="number" min="0" value="${i.received}" style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:8px;padding:7px;margin-top:3px;"></label><label style="display:block;font-size:8px;color:#1a4d2a;font-weight:900;margin-top:5px;">Damaged Qty<input id="dam-${i.id}" type="number" min="0" value="${i.damaged}" style="width:100%;box-sizing:border-box;border:1px solid #dbe8db;border-radius:8px;padding:7px;margin-top:3px;"></label></div>`).join('')}</div><label style="display:block;font-size:9px;color:#1a4d2a;font-weight:900;margin-top:9px;">Supervisor Comment<textarea id="poComment" style="width:100%;min-height:70px;box-sizing:border-box;border:1px solid #dbe8db;border-radius:9px;padding:9px;margin-top:4px;">${esc(p.comment)}</textarea></label><div style="margin-top:9px;">${button('Submit Packing Slip','submitPackingSlip()')}</div>`}
function submitPackingSlip(){const p=purchaseOrders.find(x=>x.id===state.selectedPO);p.items.forEach(i=>{i.received=Number(document.getElementById('recv-'+i.id).value||0);i.damaged=Number(document.getElementById('dam-'+i.id).value||0)});p.comment=document.getElementById('poComment').value.trim();p.status=totalShort(p)===0?'Received':'Partially Received';render();showToast('Packing slip submitted; variance updated.')}
function renderVariance(p){const req=totalRequested(p),rec=totalReceived(p),dam=totalDamaged(p),sh=totalShort(p),healthy=Math.max(0,rec-dam),ful=req?((rec/req)*100).toFixed(1):'0.0',dr=rec?((dam/rec)*100).toFixed(1):'0.0';return `<div id="varianceReport">${headerBlock('Variance Report',`${p.id} · ${p.vendor.name}`,'📊')}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;">${metric('📋','Requested',req,'Total requested')}${metric('📦','Received',rec,'Actual received')}${metric('⚠','Short',sh,'Not received')}${metric('💥','Damaged',dam,'Damaged stock')}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:10px;"><div style="border:1px solid #e2ebe3;border-radius:12px;padding:9px;background:#fff;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;margin-bottom:5px;">Received vs Short vs Damaged</div><canvas id="varianceChart" height="170"></canvas></div><div style="border:1px solid #e2ebe3;border-radius:12px;padding:9px;background:#fff;"><div style="font-size:10px;color:#1a4d2a;font-weight:950;margin-bottom:5px;">Stock Quality Split</div><canvas id="qualityChart" height="170"></canvas></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:10px;">${detail('Fulfilment Rate',ful+'%')}${detail('Damage Rate',dr+'%')}${detail('Healthy Stock',healthy)}${detail('Supervisor Comment',p.comment||'No comment')}</div><div style="overflow-x:auto;border:1px solid #e2ebe3;border-radius:12px;margin-top:10px;"><table style="width:100%;min-width:600px;border-collapse:collapse;font-size:9px;"><thead><tr style="background:#edf5ef;color:#1a4d2a;text-align:left;">${['Stock','Requested','Received','Short','Damaged','Status'].map(h=>`<th style="padding:8px;">${h}</th>`).join('')}</tr></thead><tbody>${p.items.map(i=>{const x=Math.max(0,i.requested-i.received),issue=x>0||i.damaged>0;return `<tr><td style="padding:8px;border-top:1px solid #e7eee7;font-weight:900;">${i.name}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${i.requested}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${i.received}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${x}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${i.damaged}</td><td style="padding:8px;border-top:1px solid #e7eee7;">${issue?pill('Variance Found','red'):pill('Matched')}</td></tr>`}).join('')}</tbody></table></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">${button('Notify Head Of Operations',"showToast('Head Of Operations informed.')",'gold')}${button('Download PDF','downloadVariancePDF()')}</div></div>`}
function drawVarianceCharts(){const p=purchaseOrders.find(x=>x.id===state.selectedPO);if(!p||typeof Chart==='undefined')return;if(state.varianceChart)state.varianceChart.destroy();if(state.qualityChart)state.qualityChart.destroy();const a=document.getElementById('varianceChart'),b=document.getElementById('qualityChart');if(!a||!b)return;state.varianceChart=new Chart(a,{type:'bar',data:{labels:p.items.map(i=>i.name),datasets:[{label:'Received',data:p.items.map(i=>i.received)},{label:'Short',data:p.items.map(i=>Math.max(0,i.requested-i.received))},{label:'Damaged',data:p.items.map(i=>i.damaged)}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});state.qualityChart=new Chart(b,{type:'doughnut',data:{labels:['Healthy Received','Damaged','Short'],datasets:[{data:[Math.max(0,totalReceived(p)-totalDamaged(p)),totalDamaged(p),totalShort(p)]}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}})}
async function downloadVariancePDF(){if(typeof html2canvas==='undefined'||!window.jspdf){showToast('PDF libraries not loaded.',true);return}const t=document.getElementById('varianceReport');showToast('Preparing PDF...');const c=await html2canvas(t,{scale:1.5,useCORS:true}),img=c.toDataURL('image/png'),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),iw=pw-14,ih=c.height*iw/c.width;let left=ih,pos=7;pdf.addImage(img,'PNG',7,pos,iw,ih);left-=ph;while(left>0){pos=left-ih+7;pdf.addPage();pdf.addImage(img,'PNG',7,pos,iw,ih);left-=ph}pdf.save(state.selectedPO+'_variance_report.pdf');showToast('Variance PDF downloaded.')}
function openProfile(){openModal(`<div style="padding:15px;background:linear-gradient(145deg,#1a4d2a,#2d6e3e);color:#fff;display:flex;justify-content:space-between;gap:8px;"><div><div style="font-size:9px;color:#f5c542;font-weight:900;">SUPERVISOR PROFILE</div><div style="font-size:19px;font-weight:950;margin-top:3px;">${supervisor.name}</div><div style="font-size:9px;color:rgba(255,255,255,.78);margin-top:3px;">${supervisor.role}</div></div>${button('×','closeModal()','light')}</div><div style="padding:14px;"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px;">${detail('Employee ID',supervisor.employeeId)}${detail('Phone',supervisor.phone)}${detail('Email',supervisor.email)}${detail('Base Farm',supervisor.farm)}${detail('Joining Date',supervisor.joined)}${detail('Status',supervisor.status)}</div><div style="margin-top:12px;">${button('Logout','logout()','red')}</div></div>`)}function logout(){closeModal();state.loggedIn=false;render()}function renderLoggedOut(){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;"><div style="width:min(390px,100%);background:#fff;border:1px solid #e2ebe3;border-radius:20px;padding:22px;text-align:center;box-shadow:0 16px 38px rgba(0,20,0,.08);"><div style="font-size:38px;">🌿</div><div style="font-size:20px;color:#1a4d2a;font-weight:950;margin-top:7px;">Supervisor Session Ended</div><div style="font-size:10px;color:#718176;line-height:1.5;margin-top:5px;">This is a prototype logout screen.</div><div style="margin-top:12px;">${button('Login Again',"state.loggedIn=true;state.view='dashboard';render()")}</div></div></div>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
