        </div>

          <div style="padding:8px 11px;border-radius:10px;background:#fff;border:1px solid #dfe7df;font-size:11px;"><span style="color:#728176;">Matching Vendors:</span> <strong>${unique(rows.map(x=>x.vendor)).length}</strong></div>

    function analyticsTab(){
      /*
        DYNAMIC ANALYTICS SOURCE
        ------------------------
        Nothing in this section stores a separate/static vendor score.
        Every render reads directly from:
          1) state.vendors          -> live Behavior + Delivery Time ratings
          2) state.purchases        -> live purchase / delivery history
          3) state.acceptedRequests -> live RFQ acceptance data
      */
      const rows=state.purchases;
      const plants=unique(rows.map(x=>x.plant));
      const benchmarkByPlant={};

      plants.forEach(plant=>{
        const pr=rows.filter(x=>x.plant===plant);
        benchmarkByPlant[plant]={ bestRate:pr.length ? Math.min(...pr.map(x=>x.rate)) : 0 };
      });

      const vendorStats=state.vendors.map(vendorMaster=>{
        const vr=rows.filter(x=>x.vendor===vendorMaster.name);
        const spend=vr.reduce((s,x)=>s+x.total,0);
        const qty=vr.reduce((s,x)=>s+x.qty,0);
        const avgRate=vr.length ? vr.reduce((s,x)=>s+x.rate,0)/vr.length : 0;
        const avgDelay=vr.length ? vr.reduce((s,x)=>s+(x.deliveryDays||0),0)/vr.length : 0;
        const onTimePct=vr.length ? Math.round(vr.filter(x=>(x.deliveryDays||0)<=0).length/vr.length*100) : 0;
        const avoidable=vr.reduce((s,x)=>s+((x.rate-(benchmarkByPlant[x.plant]?.bestRate||x.rate))*x.qty),0);

        // LIVE rating values from the Vendor tab only.
        const behaviorRating=Number(vendorMaster.behaviorRating||0);
        const deliveryTimeRating=Number(vendorMaster.deliveryTimeRating||0);
        const hasRating=behaviorRating>0 && deliveryTimeRating>0;
        const overallRating=hasRating ? Number(((behaviorRating+deliveryTimeRating)/2).toFixed(1)) : 0;
        const score=hasRating ? Math.round((overallRating/5)*100) : 0;

        return {
          vendor:vendorMaster.name,
          vendorId:vendorMaster.id,
          location:vendorMaster.location,
          orders:vr.length,
          qty,spend,avgRate,avgDelay,onTimePct,avoidable,
          behaviorRating,deliveryTimeRating,overallRating,score,hasRating
        };
      }).sort((a,b)=>{
        if(a.hasRating!==b.hasRating) return a.hasRating ? -1 : 1;
        return b.score-a.score || b.orders-a.orders;
      });

      const ratedVendors=vendorStats.filter(v=>v.hasRating);
      const leader=ratedVendors[0] || null;
      const purchaseVendors=vendorStats.filter(v=>v.orders>0);
      const bestDelivery=purchaseVendors.length ? purchaseVendors.slice().sort((a,b)=>b.onTimePct-a.onTimePct || a.avgDelay-b.avgDelay)[0] : null;

      const totalVendors=state.vendors.length;
      const acceptedVendorNames=unique(state.acceptedRequests.filter(x=>x.status==='Accepted').map(x=>x.vendor));
      const acceptedVendorCount=acceptedVendorNames.length;
      const acceptanceRate=totalVendors ? Math.round((acceptedVendorCount/totalVendors)*100) : 0;
      const vendorsWithPurchases=unique(state.purchases.map(x=>x.vendor)).length;
      const vendorsWithoutPurchases=Math.max(0,totalVendors-vendorsWithPurchases);
      const avgVendorRating=ratedVendors.length ? (ratedVendors.reduce((s,v)=>s+v.overallRating,0)/ratedVendors.length).toFixed(1) : '0.0';
      const maxSpend=Math.max(...vendorStats.map(x=>x.spend),1);
      const maxAvoidable=Math.max(...vendorStats.map(x=>x.avoidable),1);

      const toggleButton=(view,label,icon)=>{
        const active=state.analyticsView===view;
        return `<button onclick="state.analyticsView='${view}';render()" style="border:1px solid ${active?'#1a4d2a':'#d7e2d7'};background:${active?'#1a4d2a':'#fff'};color:${active?'#fff':'#1a4d2a'};border-radius:10px;padding:9px 13px;font-size:12px;font-weight:900;cursor:pointer;">${icon} ${label}</button>`;
      };

      const chartView=`
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;">
          <div style="border:1px solid #e1eee1;border-radius:14px;background:#fff;padding:16px;">
            <div style="font-size:14px;font-weight:950;color:#1a4d2a;">Vendor Spend Comparison</div>
            <div style="font-size:11px;color:#7c8b80;margin-top:3px;margin-bottom:15px;">Calculated live from Purchase History</div>
            <div style="display:grid;gap:13px;">
              ${vendorStats.map(v=>`<div>
                <div style="display:flex;justify-content:space-between;gap:12px;font-size:11px;margin-bottom:5px;"><span style="font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;">${v.vendor}</span><strong>${money(v.spend)}</strong></div>
                <div style="height:10px;background:#edf3ed;border-radius:999px;overflow:hidden;"><div style="height:100%;width:${v.spend?Math.max(8,(v.spend/maxSpend)*100):0}%;background:#2e7d4f;border-radius:999px;"></div></div>
              </div>`).join('')}
            </div>
          </div>

          <div style="border:1px solid #e1eee1;border-radius:14px;background:#fff;padding:16px;">
            <div style="font-size:14px;font-weight:950;color:#1a4d2a;">On-Time Delivery</div>
            <div style="font-size:11px;color:#7c8b80;margin-top:3px;margin-bottom:15px;">Calculated live from promised vs delivered dates</div>
            <div style="display:grid;gap:13px;">
              ${vendorStats.map(v=>`<div>
                <div style="display:flex;justify-content:space-between;gap:12px;font-size:11px;margin-bottom:5px;"><span style="font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;">${v.vendor}</span><strong>${v.orders?v.onTimePct+'%':'No purchases'}</strong></div>
                <div style="height:10px;background:#edf3ed;border-radius:999px;overflow:hidden;"><div style="height:100%;width:${v.orders?v.onTimePct:0}%;background:${v.onTimePct>=75?'#2e7d4f':'#d7a91d'};border-radius:999px;"></div></div>
              </div>`).join('')}
            </div>
          </div>

          <div style="border:1px solid #e1eee1;border-radius:14px;background:#fff;padding:16px;">
            <div style="font-size:14px;font-weight:950;color:#1a4d2a;">Live Vendor Rating Score</div>
            <div style="font-size:11px;color:#7c8b80;margin-top:3px;margin-bottom:15px;">Behavior + Delivery Time ratings submitted from Vendors tab</div>
            <div style="display:grid;gap:13px;">
              ${vendorStats.map(v=>`<div>
                <div style="display:flex;justify-content:space-between;gap:12px;font-size:11px;margin-bottom:5px;">
                  <span style="font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%;">${v.vendor}</span>
                  <strong>${v.hasRating?v.score+'/100 · '+v.behaviorRating+'/5 + '+v.deliveryTimeRating+'/5':'Not Rated'}</strong>
                </div>
                <div style="height:10px;background:#edf3ed;border-radius:999px;overflow:hidden;"><div style="height:100%;width:${v.hasRating?v.score:0}%;background:#1a4d2a;border-radius:999px;transition:width .25s ease;"></div></div>
              </div>`).join('')}
            </div>
          </div>

          <div style="border:1px solid #eadf9b;border-radius:14px;background:#fffdf3;padding:16px;">
            <div style="font-size:14px;font-weight:950;color:#514415;">Extra Cost vs Best Historical Rate</div>
            <div style="font-size:11px;color:#85784b;margin-top:3px;margin-bottom:15px;">Calculated live from Purchase History</div>
            <div style="display:grid;gap:13px;">
              ${vendorStats.map(v=>`<div>
                <div style="display:flex;justify-content:space-between;gap:12px;font-size:11px;margin-bottom:5px;"><span style="font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;">${v.vendor}</span><strong>${money(Math.round(v.avoidable))}</strong></div>
                <div style="height:10px;background:#f4edd0;border-radius:999px;overflow:hidden;"><div style="height:100%;width:${v.avoidable===0?0:Math.max(8,(v.avoidable/maxAvoidable)*100)}%;background:#d7a91d;border-radius:999px;"></div></div>
              </div>`).join('')}
            </div>
          </div>
        </div>`;

      const tableView=`
        <div style="overflow:auto;border:1px solid #e0e8df;border-radius:18px;background:#fff;box-shadow:0 4px 16px rgba(19,55,30,.045);">
          <table style="width:100%;border-collapse:separate;border-spacing:0;min-width:1180px;">
            <thead><tr style="background:#edf5ef;color:#1a4d2a;font-size:11px;text-align:left;">${['Rank','Vendor','Location','Orders','Qty','Spend','Avg Delivery','On-Time','Behavior Rating','Delivery Time Rating','Live Score'].map(h=>`<th style="padding:12px 13px;border-bottom:1px solid #dbe6dc;white-space:nowrap;">${h}</th>`).join('')}</tr></thead>
            <tbody>${vendorStats.map((v,i)=>`<tr style="font-size:12px;background:#fff;">
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;font-weight:950;">#${i+1}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;font-weight:900;">${v.vendor}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;">📍 ${v.location}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;">${v.orders}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;">${v.qty.toLocaleString('en-IN')}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;font-weight:900;">${money(v.spend)}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;">${v.orders?deliveryLabel(v.avgDelay):'-'}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;">${v.orders?`<span style="background:${v.onTimePct>=75?'#dcfce7':'#fff3cd'};color:${v.onTimePct>=75?'#166534':'#7a5c00'};border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;">${v.onTimePct}%</span>`:'-'}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;font-weight:850;">${v.hasRating?v.behaviorRating+' / 5':'Not Rated'}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;font-weight:850;">${v.hasRating?v.deliveryTimeRating+' / 5':'Not Rated'}</td>
              <td style="padding:12px 13px;border-bottom:1px solid #e3ece5;"><span style="display:inline-block;min-width:62px;text-align:center;background:${v.hasRating?'#1a4d2a':'#eef2ee'};color:${v.hasRating?'#fff':'#748276'};border-radius:8px;padding:6px 8px;font-weight:950;">${v.hasRating?v.score:'N/A'}</span></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`;

      return `<div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;">
          <div><div style="font-size:24px;font-weight:800;color:#1a4d2a;">Vendor Analytics</div><div style="font-size:13px;color:#5a6f5a;font-weight:560;line-height:1.55;margin-top:6px;">All analytics below are calculated from the current JS data in Vendors, Purchase History and quotation records. Rating scores are not stored separately.</div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">${toggleButton('chart','Chart View','📊')}${toggleButton('table','Table View','▦')}</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px;">
          ${analyticsMetric('Total Vendors',totalVendors,'Live from Vendor Master','#eef5ff')}
          ${analyticsMetric('Accepted Quotations',acceptedVendorCount,'Live accepted RFQ vendors','#eef6ef')}
          ${analyticsMetric('Acceptance Rate',acceptanceRate+'%',acceptedVendorCount+' of '+totalVendors+' vendors','#fff4d8')}
          ${analyticsMetric('Vendors with Purchases',vendorsWithPurchases,vendorsWithoutPurchases+' vendor(s) without purchase history','#f5f1ff')}
          ${analyticsMetric('Average Vendor Rating',avgVendorRating+' / 5',ratedVendors.length+' rated vendor(s)','#fff7e8')}
          ${analyticsMetric('Best Overall Vendor',leader?leader.vendor:'No rated vendor yet',leader?leader.score+' / 100 live score':'Submit vendor ratings','#eef6ef')}
          ${analyticsMetric('Best Delivery',bestDelivery?bestDelivery.vendor:'No purchase data',bestDelivery?bestDelivery.onTimePct+'% on-time':'-','#eef5ff')}
        </div>

        <div style="padding:13px 15px;border:1px solid ${leader?'#cfe3d3':'#e4e9e4'};background:${leader?'#f4fbf5':'#f8faf8'};border-radius:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;">
          <div style="font-size:20px;">${leader?'🏆':'⭐'}</div>
          <div><div style="font-size:13px;font-weight:950;color:#1a4d2a;">${leader?'Live Final Result: '+leader.vendor:'No vendor ratings submitted yet'}</div><div style="font-size:11px;color:#66776b;margin-top:3px;line-height:1.55;">${leader?`Current score <strong>${leader.score}/100</strong> from <strong>${leader.behaviorRating}/5 Behavior</strong> and <strong>${leader.deliveryTimeRating}/5 Delivery Time</strong>. Change either rating in the Vendors tab and this result recalculates immediately.`:'Rate a vendor from the Vendors tab. The Analytics score will be generated from those submitted ratings.'}</div></div>
        </div>

        ${state.analyticsView==='table' ? tableView : chartView}
      </div>`;
    }

    function analyticsMetric(label,value,sub,bg){ return `<div style="padding:14px;border:1px solid #e1eee1;border-radius:14px;background:${bg};"><div style="font-size:10px;color:#6f7f73;font-weight:900;text-transform:uppercase;letter-spacing:.45px;">${label}</div><div style="font-size:16px;font-weight:950;color:#1a4d2a;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${value}">${value}</div><div style="font-size:10px;color:#7e8b81;margin-top:4px;">${sub}</div></div>`; }
    function deliveryLabel(days){ if(days<0) return `${Math.abs(days).toFixed(1)} day early`; if(days===0) return 'On time'; return `${days.toFixed(1)} day late`; }
    function deliveryBadge(days){ const good=days<=0; return `<span style="background:${good?'#dcfce7':'#fff3cd'};color:${good?'#166534':'#7a5c00'};border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;">${days<0?Math.abs(days)+'d early':days===0?'On time':days+'d late'}</span>`; }

    function multiSelectDropdown(type,label,options,selected){
      const isPlant=type==='plants';
      const title=!selected.length ? `All ${isPlant?'Plants':'Vendors'}` : selected.length===1 ? selected[0] : `${selected.length} ${isPlant?'Plants':'Vendors'} Selected`;
      return `<label style="display:grid;gap:7px;font-size:12px;font-weight:850;color:#405844;">${label} <span style="font-size:10px;color:#809084;font-weight:700;">Multi-select</span>
        <details style="position:relative;">
          <summary style="list-style:none;width:100%;box-sizing:border-box;border:1px solid #d6e1d6;border-radius:11px;padding:10px 36px 10px 12px;background:#fff;color:#173321;font-size:12px;font-weight:800;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            ${title}<span style="position:absolute;right:12px;top:9px;color:#6e7f72;">▾</span>
          </summary>
          <div onclick="event.stopPropagation()" style="position:absolute;z-index:50;top:44px;left:0;width:100%;min-width:265px;background:#fff;border:1px solid #dbe5da;border-radius:12px;box-shadow:0 16px 36px rgba(30,70,40,.14);padding:8px;box-sizing:border-box;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 3px 7px;">
              <span style="font-size:10px;color:#7a897d;font-weight:800;">${selected.length ? selected.length+' selected' : 'No restriction'}</span>
              <button type="button" onclick="clearAdvancedSelection('${type}');event.preventDefault();event.stopPropagation();" style="border:none;background:#f4f8f4;color:#1a4d2a;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:900;cursor:pointer;">Show All</button>
            </div>
            <div style="max-height:220px;overflow:auto;display:grid;gap:2px;">
              ${options.map(o=>`<label style="display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:750;color:#314a38;" onmouseover="this.style.background='#f4f8f4'" onmouseout="this.style.background='transparent'">
                <input type="checkbox" ${selected.includes(o)?'checked':''} onchange="toggleAdvancedSelection('${type}',decodeURIComponent('${encodeURIComponent(o)}'),this.checked);event.stopPropagation();" style="width:15px;height:15px;accent-color:#1a4d2a;cursor:pointer;"> <span>${o}</span>
              </label>`).join('')}
            </div>
            <div style="padding-top:7px;border-top:1px solid #e3ece5;margin-top:5px;font-size:10px;color:#78867b;line-height:1.4;">Select multiple ${isPlant?'plants':'vendors'}. The table updates immediately.</div>
          </div>
        </details>
      </label>`;
    }

    function toggleAdvancedSelection(type,value,checked){
      const key=type==='plants'?'advancedPlants':'advancedVendors';
      if(checked){
        if(!state[key].includes(value)) state[key]=[...state[key],value];
      }else{
        state[key]=state[key].filter(x=>x!==value);
      }
      refreshAdvancedViewOnly();
    }

    function clearAdvancedSelection(type){
      const key=type==='plants'?'advancedPlants':'advancedVendors';
      state[key]=[];
      refreshAdvancedViewOnly();
    }

    function refreshAdvancedViewOnly(){
      render();
      setTimeout(()=>{
        const details=document.querySelectorAll('details');
      },0);
    }

    function advancedRows(){
      return state.purchases.filter(x=>(!state.advancedPlants.length||state.advancedPlants.includes(x.plant))&&(!state.advancedVendors.length||state.advancedVendors.includes(x.vendor))&&(state.advancedLocation==='all'||x.location===state.advancedLocation)&&(state.advancedFarm==='all'||x.farm===state.advancedFarm));
    }

    function selectBox(id,label,value,options,onchange){ return `<label style="display:grid;gap:7px;font-size:12px;font-weight:850;color:#405844;">${label}<select id="${id}" onchange="${onchange}" style="width:100%;border:1px solid #d6e1d6;border-radius:12px;padding:12px 14px;background:#fff;color:#173321;font:inherit;outline:none;">${options.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o==='all'?'All':o}</option>`).join('')}</select></label>`; }


    function parseVendorDate(iso){
      if(!iso) return null;
      const d=new Date(iso+'T00:00:00');
      return isNaN(d.getTime())?null:d;
    }

    function vendorPurchaseStats(vendorName){
      const rows=state.purchases.filter(x=>x.vendor===vendorName);
      return {
        count: rows.length,
        value: rows.reduce((sum,x)=>sum+x.total,0),
        qty: rows.reduce((sum,x)=>sum+x.qty,0)
      };
    }

    function formatVendorDate(iso){
      if(!iso) return 'No purchase yet';
      const d=parseVendorDate(iso);
      if(!d) return iso;
      return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    }

    function filteredVendors(){
      const q=state.vendorSearch.toLowerCase().trim();
      const now=new Date('2026-08-13T00:00:00');
      return state.vendors.filter(v=>{
        const searchable=[v.id,v.name,v.trade,v.location,v.category,v.contact,v.phone,v.email,...v.supplied].join(' ').toLowerCase();
        if(q && !searchable.includes(q)) return false;

        if(state.vendorTxnFilter==='none') return !v.recentTransaction;
        if(state.vendorTxnFilter!=='all'){
          if(!v.recentTransaction) return false;
          const d=parseVendorDate(v.recentTransaction);
          const days=Math.floor((now-d)/(1000*60*60*24));
          if(state.vendorTxnFilter==='30') return days<=30;
          if(state.vendorTxnFilter==='60') return days<=60;
          if(state.vendorTxnFilter==='90') return days<=90;
        }
        return true;
      });
    }

    function ratingStars(value,interactive=false,ratingType='overall'){
      let html='';
      for(let i=1;i<=5;i++){
        const filled=i<=value;
        if(interactive){
          const handler=ratingType==='behavior' ? `state.tempBehaviorRating=${i};render()` : `state.tempDeliveryTimeRating=${i};render()`;
          html+=`<button type="button" onclick="${handler}" aria-label="${i} star" style="border:none;background:transparent;padding:2px 3px;cursor:pointer;font-size:34px;line-height:1;color:${filled?'#f5b301':'#d5ddd6'};">★</button>`;
        }else{
          html+=`<span style="font-size:14px;color:${filled?'#f5b301':'#d5ddd6'};">★</span>`;
        }
      }
      return html;
    }

    function vendorsTab(){
      const rows=filteredVendors();
      return `<div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;">
          <div>
            <div style="font-size:24px;font-weight:800;color:#1a4d2a;">All Vendors</div>
            <div style="font-size:13px;color:#5a6f5a;font-weight:560;line-height:1.55;margin-top:6px;">Search vendors, review recent transactions and open complete vendor information when required.</div>
          </div>
          <div style="font-size:11px;font-weight:900;color:#1a4d2a;background:#eef6ef;border:1px solid #d4e8d8;border-radius:12px;padding:9px 14px;">${rows.length} vendor(s)</div>
        </div>

        <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:15px;padding:13px;background:#f8fbf8;border:1px solid #e1eee1;border-radius:14px;">
          <div style="flex:1 1 320px;">
            <div style="font-size:10px;font-weight:900;color:#6f7d72;margin:0 0 6px 2px;text-transform:uppercase;">Search Vendor</div>
            <div style="position:relative;">
              <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;">🔎</span>
              <input oninput="state.vendorSearch=this.value;render()" value="${state.vendorSearch}" placeholder="Search vendor, contact, category, location..." style="width:100%;box-sizing:border-box;border:1px solid #d5e0d5;border-radius:12px;padding:12px 14px 10px 36px;font:inherit;background:#fff;outline:none;" />
            </div>
          </div>

          <div style="min-width:245px;flex:0 1 280px;">
            <div style="font-size:10px;font-weight:900;color:#6f7d72;margin:0 0 6px 2px;text-transform:uppercase;">Recent Transactions</div>
            <select onchange="state.vendorTxnFilter=this.value;render()" style="width:100%;box-sizing:border-box;border:1px solid #d5e0d5;border-radius:12px;padding:12px 14px;font:inherit;background:#fff;outline:none;">
              <option value="all" ${state.vendorTxnFilter==='all'?'selected':''}>All Vendors</option>
              <option value="30" ${state.vendorTxnFilter==='30'?'selected':''}>Purchased in last 30 days</option>
              <option value="60" ${state.vendorTxnFilter==='60'?'selected':''}>Purchased in last 60 days</option>
              <option value="90" ${state.vendorTxnFilter==='90'?'selected':''}>Purchased in last 90 days</option>
              <option value="none" ${state.vendorTxnFilter==='none'?'selected':''}>No purchase transaction yet</option>
            </select>
          </div>

          <button onclick="state.vendorSearch='';state.vendorTxnFilter='all';render()" style="border:1px solid #d4dfd4;background:#fff;color:#1a4d2a;border-radius:40px;padding:10px 18px;font-weight:900;cursor:pointer;height:40px;">Reset</button>
        </div>

        <div style="overflow:auto;border:1px solid #dce7de;border-radius:18px;box-shadow:0 4px 16px rgba(19,55,30,.045);">
          <table style="width:100%;border-collapse:separate;border-spacing:0;min-width:1230px;">
            <thead>
              <tr style="background:#edf5ef;color:#1a4d2a;font-size:12px;text-align:left;">
                ${['Vendor','Location','Category','Contact','Purchases','Purchase Value','Last Transaction','Rating','Status','Actions'].map(h=>`<th style="padding:13px 14px;border-bottom:1px solid #cdddcf;">${h}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows.map(v=>{
                const st=vendorPurchaseStats(v.name);
                return `<tr style="font-size:13px;background:#fff;" onmouseover="this.style.background='#fbfdfb'" onmouseout="this.style.background='#fff'">
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">
                    <div style="font-weight:950;color:#1a4d2a;">${v.name}</div>
                    <div style="font-size:11px;color:#819084;margin-top:3px;">${v.id} · ${v.trade}</div>
                  </td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">📍 ${v.location}</td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">${v.category}</td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">
                    <div style="font-weight:850;">${v.contact}</div>
                    <div style="font-size:11px;color:#7c897e;margin-top:3px;">${v.phone}</div>
                  </td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;font-weight:900;">${st.count}</td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;font-weight:900;">${money(st.value)}</td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">
                    <div style="font-weight:850;">${formatVendorDate(v.recentTransaction)}</div>
                    <div style="font-size:11px;color:#829085;margin-top:3px;">${v.recentTransaction?'Recent purchase':'—'}</div>
                  </td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">
                    <div style="white-space:nowrap;">${ratingStars(v.rating)}</div>
                    <div style="font-size:10px;color:#7d8b80;margin-top:3px;">${v.rating ? v.rating+' / 5 · '+v.ratingCount+' rating(s)' : 'Not rated'}</div>
                  </td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;"><span style="background:#dcfce7;color:#166534;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;">${v.status}</span></td>
                  <td style="padding:14px;border-bottom:1px solid #e3ece5;">
                    <div style="display:flex;gap:7px;white-space:nowrap;">
                      <button onclick="openVendor('${v.id}')" style="border:1px solid #cfe0d1;background:#fff;color:#1a4d2a;border-radius:12px;padding:9px 14px;font-weight:900;cursor:pointer;">View Details</button>
                      <button onclick="openRating('${v.id}')" style="border:1px solid #f5c542;background:#fff4d8;color:#725a00;border-radius:12px;padding:9px 14px;font-weight:900;cursor:pointer;">★ Rate Vendor</button>
                    </div>
                  </td>
                </tr>`;
              }).join('') : `<tr><td colspan="10" style="padding:34px;text-align:center;color:#768479;font-size:13px;">No vendors found for the selected search/filter.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    function filteredVendorAccess(){
      return state.vendors.filter(v=>state.vendorAccessFilter==='all'||String(v.accessStatus||'Denied').toLowerCase()===state.vendorAccessFilter);
    }

    function setVendorAccess(id,status){
      const vendor=state.vendors.find(v=>v.id===id);
      if(!vendor) return;
      vendor.accessStatus=status;
      vendor.accessUpdatedAt=new Date().toISOString();
      render();
    }

    function vendorAccessTab(){
      const rows=filteredVendorAccess();
      const grantedCount=state.vendors.filter(v=>(v.accessStatus||'Denied')==='Granted').length;
      const deniedCount=state.vendors.length-grantedCount;
      return `<div>
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;">
          <div>
            <div style="font-size:24px;font-weight:800;color:#1a4d2a;">Vendor Access</div>
            <div style="font-size:13px;color:#5a6f5a;font-weight:560;line-height:1.55;margin-top:6px;">Control which registered vendors can access the Vendor Module. Access can be granted or denied directly from this table.</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <span style="background:#dcf7ea;color:#0f7a45;border:1px solid #cbead9;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;">${grantedCount} Access Granted</span>
            <span style="background:#ffe3e6;color:#b42331;border:1px solid #f2c9cf;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;">${deniedCount} Access Denied</span>
          </div>
        </div>

        <div style="display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:16px 18px;background:#f8fbf8;border:1px solid #e4ece5;border-radius:18px;margin-bottom:20px;">
          <div style="min-width:250px;">
            <div style="font-size:10px;font-weight:900;color:#54705b;margin:0 0 7px 2px;text-transform:uppercase;letter-spacing:.035em;">Access Filter</div>
            <select onchange="state.vendorAccessFilter=this.value;render()" style="width:100%;min-height:46px;border:1px solid #dbe8db;border-radius:12px;padding:11px 14px;background:#fff;color:#1e2e24;font:inherit;font-weight:650;outline:none;">
              <option value="all" ${state.vendorAccessFilter==='all'?'selected':''}>All Vendors</option>
              <option value="granted" ${state.vendorAccessFilter==='granted'?'selected':''}>Access Granted</option>
              <option value="denied" ${state.vendorAccessFilter==='denied'?'selected':''}>Access Denied</option>
            </select>
          </div>
          <button onclick="state.vendorAccessFilter='all';render()" style="border:1px solid #d4dfd4;background:#fff;color:#1a4d2a;border-radius:40px;padding:11px 18px;font-weight:900;cursor:pointer;min-height:46px;">Reset Filter</button>
          <div style="margin-left:auto;font-size:11px;font-weight:900;color:#1a4d2a;background:#eef6ef;border:1px solid #d4e8d8;border-radius:12px;padding:9px 14px;">${rows.length} vendor(s)</div>
        </div>

        <div style="overflow:auto;border:1px solid #dce7de;border-radius:18px;box-shadow:0 4px 16px rgba(19,55,30,.045);background:#fff;">
          <table style="width:100%;border-collapse:separate;border-spacing:0;min-width:980px;">
            <thead>
              <tr style="background:#edf5ef;color:#1a4d2a;font-size:12px;text-align:left;">
                ${['Vendor Name','Business Name','Location','Access Status','Actions'].map(h=>`<th style="padding:16px 18px;border-bottom:1px solid #cdddcf;text-transform:uppercase;letter-spacing:.035em;white-space:nowrap;">${h}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows.map(v=>{
                const granted=(v.accessStatus||'Denied')==='Granted';
                return `<tr style="font-size:13px;background:#fff;" onmouseover="this.style.background='#f8fbf8'" onmouseout="this.style.background='#fff'">
                  <td style="padding:18px;border-bottom:1px solid #e3ece5;"><div style="font-weight:900;color:#1a4d2a;">${v.name}</div><div style="font-size:11px;color:#7b897d;margin-top:4px;">${v.id}</div></td>
                  <td style="padding:18px;border-bottom:1px solid #e3ece5;font-weight:750;">${v.trade}</td>
                  <td style="padding:18px;border-bottom:1px solid #e3ece5;">📍 ${v.location}</td>
                  <td style="padding:18px;border-bottom:1px solid #e3ece5;"><span style="display:inline-flex;align-items:center;gap:6px;background:${granted?'#dcf7ea':'#ffe3e6'};color:${granted?'#0f7a45':'#b42331'};border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900;">${granted?'✓ Access Granted':'× Access Denied'}</span></td>
                  <td style="padding:18px;border-bottom:1px solid #e3ece5;">
                    <div style="display:flex;gap:9px;align-items:center;white-space:nowrap;">
                      <button onclick="setVendorAccess('${v.id}','Granted')" ${granted?'disabled':''} style="border:none;background:${granted?'#dbe6dd':'#1a4d2a'};color:${granted?'#829085':'#fff'};border-radius:40px;padding:9px 16px;font-weight:900;cursor:${granted?'not-allowed':'pointer'};box-shadow:${granted?'none':'0 8px 16px rgba(26,77,42,.16)'};">✓ Give Access</button>
                      <button onclick="setVendorAccess('${v.id}','Denied')" ${!granted?'disabled':''} style="border:1px solid ${!granted?'#ead5d8':'#efc3ca'};background:${!granted?'#f4eeee':'#ffe3e6'};color:${!granted?'#9b7a80':'#b42331'};border-radius:40px;padding:9px 16px;font-weight:900;cursor:${!granted?'not-allowed':'pointer'};">× Deny Access</button>
                    </div>
                  </td>
                </tr>`;
              }).join('') : `<tr><td colspan="5" style="padding:36px;text-align:center;color:#718175;font-size:13px;">No vendors match the selected access filter.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    function openVendor(id){
      state.selectedPurchase=null;
      state.ratingVendor=null;
      state.selectedVendor=state.vendors.find(v=>v.id===id)||null;
      render();
    }

    function openRating(id){
      state.selectedPurchase=null;
      state.selectedVendor=null;
      state.ratingVendor=state.vendors.find(v=>v.id===id)||null;
      state.tempBehaviorRating=state.ratingVendor ? Number(state.ratingVendor.behaviorRating||0) : 0;
      state.tempDeliveryTimeRating=state.ratingVendor ? Number(state.ratingVendor.deliveryTimeRating||0) : 0;
      state.tempRating=state.ratingVendor ? Number(state.ratingVendor.rating||0) : 0;
      render();
    }

    function closeAnyModal(){
      state.selectedPurchase=null;
      state.selectedVendor=null;
      state.ratingVendor=null;
      state.tempRating=0;
      state.tempBehaviorRating=0;
      state.tempDeliveryTimeRating=0;
      render();
    }

    function submitVendorRating(){
      if(!state.ratingVendor || !state.tempBehaviorRating || !state.tempDeliveryTimeRating) return;
      const v=state.vendors.find(x=>x.id===state.ratingVendor.id);
      if(v){
        // Single source of truth: update Vendor Master state.
        v.behaviorRating=Number(state.tempBehaviorRating);
        v.deliveryTimeRating=Number(state.tempDeliveryTimeRating);
        v.rating=Number(((v.behaviorRating+v.deliveryTimeRating)/2).toFixed(1));
        v.ratingCount=(v.ratingCount||0)+1;
        v.lastRatedAt=new Date().toISOString();
      }

      // Clear modal state only. Keep the user on the current tab; Analytics reads this same live vendor state when opened.
      state.ratingVendor=null;
      state.tempRating=0;
      state.tempBehaviorRating=0;
      state.tempDeliveryTimeRating=0;
      render();
    }

    function vendorDetailsModal(v){
      const st=vendorPurchaseStats(v.name);
      const vendorPurchases=state.purchases.filter(x=>x.vendor===v.name);
      return `<div onclick="if(event.target===this)closeAnyModal()" style="position:fixed;inset:0;background:rgba(10,31,18,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid #e6eee6;border-radius:28px;box-shadow:0 30px 90px rgba(0,20,0,.32);">
          <div style="padding:22px 24px;background:linear-gradient(145deg,#1a4d2a 0%,#2d6e3e 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;">
            <div><div style="font-size:17px;font-weight:950;">Vendor Details</div><div style="font-size:11px;color:#cfe1d3;margin-top:3px;">${v.id} · ${v.name}</div></div>
            <button onclick="closeAnyModal()" style="border:none;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:18px;">×</button>
          </div>
          <div style="padding:20px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:15px;border:1px solid #e1eee1;background:#f8fbf8;border-radius:14px;margin-bottom:15px;">
              <div>
                <div style="font-size:24px;font-weight:800;color:#1a4d2a;color:#1a4d2a;">${v.name}</div>
                <div style="font-size:13px;color:#5a6f5a;font-weight:560;line-height:1.55;margin-top:6px;">${v.trade} · ${v.category}</div>
              </div>
              <div style="text-align:right;">
                <div>${ratingStars(v.rating)}</div>
                <div style="font-size:11px;color:#748276;margin-top:4px;">${v.rating ? v.rating+' / 5 overall · '+v.ratingCount+' rating(s)' : 'No rating yet'}</div><div style="font-size:10px;color:#829085;margin-top:3px;">Behavior: ${v.behaviorRating||0}/5 · Delivery Time: ${v.deliveryTimeRating||0}/5</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">
              ${[
                ['Contact Person',v.contact],['Phone',v.phone],['Email',v.email],['Location',v.location],
                ['GSTIN',v.gst],['Payment Terms',v.paymentTerms],['Vendor Since',v.joined],['Status',v.status],
                ['Total Purchases',st.count],['Total Purchase Value',money(st.value)],['Total Quantity Purchased',st.qty.toLocaleString('en-IN')],['Last Transaction',formatVendorDate(v.recentTransaction)]
              ].map(([a,b])=>`<div style="padding:12px;border:1px solid #e3ebe2;border-radius:12px;background:#fbfdfb;"><div style="font-size:10px;color:#7b897d;font-weight:850;text-transform:uppercase;">${a}</div><div style="font-size:13px;font-weight:900;margin-top:5px;word-break:break-word;">${b}</div></div>`).join('')}
            </div>

            <div style="margin-top:10px;padding:12px;border:1px solid #e3ebe2;border-radius:12px;background:#fbfdfb;">
              <div style="font-size:10px;color:#7b897d;font-weight:850;text-transform:uppercase;">Full Address</div>
              <div style="font-size:13px;font-weight:900;margin-top:5px;">${v.address}</div>
            </div>

            <div style="margin-top:10px;padding:12px;border:1px solid #e3ebe2;border-radius:12px;background:#fbfdfb;">
              <div style="font-size:10px;color:#7b897d;font-weight:850;text-transform:uppercase;">Supplies / Products</div>
              <div style="margin-top:6px;">${v.supplied.map(x=>`<span style="display:inline-block;background:#eef7ef;border:1px solid #d8eadb;border-radius:8px;padding:5px 8px;margin:2px;font-size:11px;font-weight:850;">${x}</span>`).join('')}</div>
            </div>

            <div style="margin-top:16px;">
              <div style="font-size:13px;font-weight:950;margin-bottom:8px;">Recent Purchase Records</div>
              <div style="overflow:auto;border:1px solid #e3ebe2;border-radius:12px;">
                <table style="width:100%;border-collapse:collapse;min-width:600px;">
                  <thead><tr style="background:#edf5ef;color:#1a4d2a;font-size:11px;text-align:left;">${['PO','Date','Product','Qty','Value','Status'].map(h=>`<th style="padding:10px;border-bottom:1px solid #cdddcf;">${h}</th>`).join('')}</tr></thead>
                  <tbody>${vendorPurchases.length?vendorPurchases.map(r=>`<tr style="font-size:12px;"><td style="padding:10px;border-bottom:1px solid #e3ece5;font-weight:900;color:#1a4d2a;">${r.po}</td><td style="padding:10px;border-bottom:1px solid #e3ece5;">${r.date}</td><td style="padding:10px;border-bottom:1px solid #e3ece5;">${r.plant}</td><td style="padding:10px;border-bottom:1px solid #e3ece5;">${r.qty.toLocaleString('en-IN')}</td><td style="padding:10px;border-bottom:1px solid #e3ece5;font-weight:850;">${money(r.total)}</td><td style="padding:10px;border-bottom:1px solid #e3ece5;">${r.status}</td></tr>`).join(''):`<tr><td colspan="6" style="padding:20px;text-align:center;color:#7a887d;">No purchase transactions available.</td></tr>`}</tbody>
                </table>
              </div>
            </div>

            <div style="display:flex;justify-content:flex-end;gap:9px;margin-top:16px;">
              <button onclick="closeAnyModal();openRating('${v.id}')" style="border:1px solid #f5c542;background:#fff4d8;color:#725a00;border-radius:10px;padding:9px 13px;font-weight:900;cursor:pointer;">★ Rate Vendor</button>
              <button onclick="closeAnyModal()" style="border:none;background:#1a4d2a;color:#fff;border-radius:10px;padding:9px 14px;font-weight:900;cursor:pointer;">Close</button>
            </div>
          </div>
        </div>
      </div>`;
    }

    function ratingModal(v){
      const bothSelected=state.tempBehaviorRating>0 && state.tempDeliveryTimeRating>0;
      return `<div onclick="if(event.target===this)closeAnyModal()" style="position:fixed;inset:0;background:rgba(10,31,18,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;">
        <div style="width:min(560px,100%);background:#fff;border:1px solid #e6eee6;border-radius:28px;box-shadow:0 30px 90px rgba(0,20,0,.32);overflow:hidden;">
          <div style="padding:22px 24px;background:linear-gradient(145deg,#1a4d2a 0%,#2d6e3e 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;">
            <div><div style="font-size:17px;font-weight:950;">Rate Vendor</div><div style="font-size:11px;color:#cfe1d3;margin-top:3px;">${v.name}</div></div>
            <button onclick="closeAnyModal()" style="border:none;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:18px;">×</button>
          </div>
          <div style="padding:24px;">
            <div style="font-size:14px;font-weight:950;color:#243f2e;text-align:center;">Rate vendor performance</div>
            <div style="font-size:12px;color:#7a887d;margin-top:5px;text-align:center;">Both ratings are required. Submit saves the vendor rating data and Analytics will use the updated values when you open that tab.</div>

            <div style="margin-top:20px;padding:18px;border:1px solid #e1eee1;background:#f8fbf8;border-radius:18px;">
              <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><div style="font-size:13px;font-weight:900;color:#1a4d2a;">Behavior Rating</div><div style="font-size:11px;color:#748276;margin-top:3px;">Communication, professionalism and cooperation</div></div><div style="font-size:12px;font-weight:900;color:#725a00;">${state.tempBehaviorRating?state.tempBehaviorRating+'/5':'Not rated'}</div></div>
              <div style="display:flex;justify-content:center;gap:5px;margin-top:12px;">${ratingStars(state.tempBehaviorRating,true,'behavior')}</div>
            </div>

            <div style="margin-top:12px;padding:18px;border:1px solid #e1eee1;background:#f8fbf8;border-radius:18px;">
              <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;"><div><div style="font-size:13px;font-weight:900;color:#1a4d2a;">Delivery Time Rating</div><div style="font-size:11px;color:#748276;margin-top:3px;">Timeliness and adherence to committed delivery schedule</div></div><div style="font-size:12px;font-weight:900;color:#725a00;">${state.tempDeliveryTimeRating?state.tempDeliveryTimeRating+'/5':'Not rated'}</div></div>
              <div style="display:flex;justify-content:center;gap:5px;margin-top:12px;">${ratingStars(state.tempDeliveryTimeRating,true,'delivery')}</div>
            </div>

            ${bothSelected?`<div style="margin-top:14px;padding:12px 14px;border-radius:14px;background:#eef6ef;border:1px solid #d7e8da;color:#1a4d2a;font-size:12px;font-weight:850;text-align:center;">Analytics Score Preview: ${Math.round(((state.tempBehaviorRating+state.tempDeliveryTimeRating)/10)*100)} / 100</div>`:''}

            <div style="display:flex;justify-content:center;gap:9px;margin-top:22px;">
              <button onclick="closeAnyModal()" style="border:1px solid #d5dfd5;background:#fff;color:#425646;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer;">Cancel</button>
              ${bothSelected?`<button onclick="submitVendorRating()" style="border:none;background:#1a4d2a;color:#fff;border-radius:10px;padding:10px 18px;font-weight:900;cursor:pointer;">Submit Ratings</button>`:''}
            </div>
          </div>
        </div>
      </div>`;
    }

    function fillDemo(){ state.currentTab='history'; state.advancedPlants=['Tulsi','Areca Palm']; state.advancedVendors=['GreenRoot Agro Pvt. Ltd.','Shree Sai Horticulture']; state.advancedLocation='all'; state.advancedFarm='all'; render(); }
    function openPurchase(po){ state.selectedVendor=null; state.ratingVendor=null; state.selectedPurchase=state.purchases.find(x=>x.po===po); render(); }
    function closeModal(){ closeAnyModal(); }
    function modalHtml(){
      if(state.ratingVendor) return ratingModal(state.ratingVendor);
      if(state.selectedVendor) return vendorDetailsModal(state.selectedVendor);
      const r=state.selectedPurchase;
      if(!r) return '';
      return `<div onclick="if(event.target===this)closeModal()" style="position:fixed;inset:0;background:rgba(12,38,23,.42);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;"><div style="width:min(560px,100%);background:#fff;border-radius:20px;box-shadow:0 28px 80px rgba(0,0,0,.22);overflow:hidden;"><div style="padding:22px 24px;background:linear-gradient(145deg,#1a4d2a 0%,#2d6e3e 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:17px;font-weight:950;">Purchase Details</div><div style="font-size:11px;color:#cfe1d3;margin-top:3px;">${r.po}</div></div><button onclick="closeModal()" style="border:none;background:rgba(255,255,255,.12);color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:18px;">×</button></div><div style="padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;">${[['Vendor',r.vendor],['Location',r.location],['Plant',r.plant],['Quantity',r.qty.toLocaleString('en-IN')],['Rate',money(r.rate)],['Total',money(r.total)],['Farm',r.farm],['Status',r.status]].map(([a,b])=>`<div style="padding:12px;border:1px solid #e3ebe2;border-radius:12px;background:#fbfdfb;"><div style="font-size:10px;color:#7b897d;font-weight:850;text-transform:uppercase;">${a}</div><div style="font-size:13px;font-weight:900;margin-top:5px;">${b}</div></div>`).join('')}</div></div></div>`;
    }

    render();
  </script>
</body></html>
