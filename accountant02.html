<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM Nursery · Accounts ERP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a4d2a;--green2:#2d6e3e;--green3:#0f3a1e;--gold:#f5c542;
  --bg:#f4f7f5;--soft:#f8fbf8;--border:#e1ebe2;--text:#1e2e24;--muted:#66786b;
  --blue:#1769aa;--red:#b42331;--orange:#a85d00;--purple:#6b46c1
}
body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.sidebar{
  background:linear-gradient(180deg,#153d25 0%,#1a4d2a 54%,#12341f 100%);
  color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto
}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:18px}
.brand-logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:24px}
.brand h2{font-size:18px;font-weight:900}.brand p{font-size:11px;color:#cfe1d3;margin-top:3px}
.nav-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#9fc1aa;font-weight:900;padding:8px 10px}
.nav-btn{width:100%;border:none;background:transparent;color:#dfece2;border-radius:14px;padding:12px 13px;margin:4px 0;display:flex;align-items:center;gap:11px;text-align:left;font-weight:800;font-size:13px;transition:.2s}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn.active{background:#fff;color:var(--green);box-shadow:0 10px 20px rgba(0,0,0,.14)}
.nav-icon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}
.nav-btn.active .nav-icon{background:#e9f5eb}
.side-summary{margin-top:20px;padding:15px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.side-summary strong{display:block;color:var(--gold);font-size:12px;margin-bottom:7px}.side-summary p{font-size:11px;line-height:1.55;color:#cfe1d3}
.main{padding:28px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}
.mobile-menu{display:none;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 12px;font-weight:900;color:var(--green)}
.account-chip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px 12px;box-shadow:0 8px 18px rgba(0,20,0,.04)}
.avatar{width:35px;height:35px;border-radius:11px;background:#fff2b7;color:#6c5500;display:flex;align-items:center;justify-content:center;font-weight:950}
.account-chip strong{font-size:12px}.account-chip span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.hero{background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;border-radius:28px;padding:28px 30px;box-shadow:0 18px 38px rgba(0,20,0,.14);position:relative;overflow:hidden;margin-bottom:20px}
.hero:after{content:"₹";position:absolute;right:22px;bottom:-30px;font-size:130px;font-weight:900;opacity:.07}
.hero-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#ffe37c;font-weight:900}
.hero h1{font-size:31px;line-height:1.1;margin:8px 0 8px;font-weight:900;letter-spacing:-.03em}
.hero p{font-size:13px;color:#dceade;line-height:1.6;max-width:900px}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 10px 24px rgba(0,20,0,.045);position:relative;overflow:hidden}
.metric .label{font-size:11px;color:var(--muted);font-weight:800}.metric .value{font-size:25px;color:var(--green);font-weight:950;margin-top:13px}.metric .sub{font-size:10px;color:#8a978d;margin-top:4px}.metric .mi{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:12px;background:#eef6ef;display:flex;align-items:center;justify-content:center}
.stepper{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:13px 14px;margin-bottom:18px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:11px;font-weight:850;color:#6d7d70}
.step-num{width:26px;height:26px;border-radius:50%;background:#edf2ed;display:flex;align-items:center;justify-content:center;font-size:10px}
.step.done{color:var(--green)}.step.done .step-num{background:#dff5e5;color:#0f7a45}.step.current{color:#725a00}.step.current .step-num{background:#fff2b7;color:#725a00}
.step-line{height:2px;min-width:26px;flex:1;background:#e7ece7}
.panel{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 10px 24px rgba(0,20,0,.045);margin-bottom:18px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-head h3{font-size:18px;color:var(--green);font-weight:900}.panel-head p{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.input,.select{border:1px solid #d8e3d9;background:#fff;border-radius:11px;padding:10px 12px;font-size:11px;font-weight:700;outline:none;min-height:39px}
.input:focus,.select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,77,42,.08)}
.search{min-width:250px}
.btn{border:none;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-green{background:var(--green);color:#fff}.btn-light{background:#eef6ef;color:var(--green);border:1px solid #d6e8d9}.btn-gold{background:#fff4d3;color:#745b00;border:1px solid #efd884}.btn-blue{background:#eef6ff;color:#135887;border:1px solid #d7e9fb}.btn-red{background:#fff0f1;color:var(--red);border:1px solid #f3cdd1}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1180px}
thead th{background:#edf5ef;color:var(--green);font-size:10px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px 13px;border-bottom:1px solid #d6e2d7;white-space:nowrap}
tbody td{font-size:11.5px;padding:13px;border-bottom:1px solid #e7ede7;vertical-align:middle}
tbody tr:hover{background:#fafcfa}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;white-space:nowrap}
.green{background:#dcf7ea;color:#0f7a45}.yellow{background:#fff3c7;color:#755b00}.blue{background:#eaf4ff;color:#155b88}.red{background:#ffe5e7;color:#a82430}.gray{background:#eef1ef;color:#66736a}.purple{background:#f0eaff;color:#6542a6}
.info-btn{width:26px;height:26px;border-radius:50%;border:1px solid #d5e2d6;background:#fff;color:var(--green);font-weight:950}
.bottom-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.7fr);gap:18px}
.chart-card,.activity-card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(0,20,0,.045)}
.chart-card h3,.activity-card h3{font-size:16px;color:var(--green);font-weight:900;margin-bottom:15px}
.bar-row{display:grid;grid-template-columns:150px 1fr 75px;gap:10px;align-items:center;margin:14px 0;font-size:11px}
.bar-bg{height:11px;background:#edf2ed;border-radius:999px;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),#4caf6d)}
.todo{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #edf1ed;align-items:flex-start}.todo:last-child{border-bottom:none}
.todo-dot{width:10px;height:10px;border-radius:50%;margin-top:3px;background:var(--gold)}.todo strong{font-size:11px}.todo p{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(10,28,18,.62);z-index:1000;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.modal.open{display:flex}.modal-box{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
.modal-head{background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0}
.modal-head h3{font-size:17px}.close{width:32px;height:32px;border:none;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:18px}
.modal-body{padding:20px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{padding:12px;border:1px solid var(--border);border-radius:12px;background:#fbfdfb}.detail label{display:block;font-size:9px;text-transform:uppercase;color:#7a897d;font-weight:900}.detail strong{display:block;font-size:12px;margin-top:5px;color:var(--text);word-break:break-word}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{font-size:11px;color:var(--green);font-weight:850}.form-grid .input,.form-grid .select{width:100%;margin-top:6px}.full{grid-column:1/-1}
.toast{position:fixed;right:22px;bottom:22px;background:var(--green);color:#fff;border-radius:14px;padding:13px 16px;font-size:12px;font-weight:850;box-shadow:0 16px 34px rgba(0,20,0,.2);opacity:0;transform:translateY(20px);transition:.25s;z-index:1200}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.metric-grid{grid-template-columns:repeat(2,1fr)}.bottom-grid{grid-template-columns:1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;top:0;width:270px;z-index:1300;transition:.25s}.sidebar.open{left:0}
  .main{padding:16px}.mobile-menu{display:inline-flex}.hero{padding:22px}.hero h1{font-size:25px}.metric-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){.metric-grid{grid-template-columns:1fr}.detail-grid,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.search{min-width:100%;width:100%}.topbar{align-items:flex-start}.account-chip{padding:7px 9px}.hero h1{font-size:22px}.stepper{padding:10px}.bar-row{grid-template-columns:105px 1fr 55px}}

@media(max-width:760px){
  .main{padding:12px}
  .hero{border-radius:20px;padding:20px 18px}
  .panel{border-radius:18px}
  .panel-head{padding:15px}
  .toolbar{width:100%}
  .toolbar .input,.toolbar .select,.toolbar .btn{width:100%}
  .table-wrap{overflow:visible;padding:10px}
  .table-wrap table,.table-wrap thead,.table-wrap tbody,.table-wrap th,.table-wrap td,.table-wrap tr{display:block}
  .table-wrap table{min-width:0!important;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tbody{display:grid;gap:12px}
  .table-wrap tr{border:1px solid var(--border);border-radius:16px;background:#fff;padding:10px;box-shadow:0 5px 14px rgba(0,20,0,.035)}
  .table-wrap td{display:grid;grid-template-columns:minmax(105px,38%) 1fr;gap:8px;padding:8px 6px;border-bottom:1px dashed #e6ece6;align-items:start;word-break:break-word}
  .table-wrap td:last-child{border-bottom:none}
  #b2cTable td:nth-child(1)::before,#b2bTable td:nth-child(1)::before,#vendorQuoteTable td:nth-child(1)::before,#vendorMasterTable td:nth-child(1)::before,#poTable td:nth-child(1)::before{content:"Sr. No.";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(2)::before{content:"Bill No.";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(3)::before{content:"Date & Time";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(4)::before{content:"Customer";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(5)::before{content:"Total Qty";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(6)::before{content:"Overall Total";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(7)::before{content:"Supervisor";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(8)::before{content:"Counter No.";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(9)::before{content:"Checkout Mode";font-weight:900;color:var(--green)}
  #b2cTable td:nth-child(10)::before{content:"Payment Status";font-weight:900;color:var(--green)}
    #poTable td:nth-child(2)::before{content:"PO / Requisition";font-weight:900;color:var(--green)}
  #poTable td:nth-child(3)::before{content:"Order / Delivery";font-weight:900;color:var(--green)}
  #poTable td:nth-child(4)::before{content:"Vendor";font-weight:900;color:var(--green)}
  #poTable td:nth-child(5)::before{content:"Farm";font-weight:900;color:var(--green)}
  #poTable td:nth-child(6)::before{content:"Products / Receipt";font-weight:900;color:var(--green)}
  #poTable td:nth-child(7)::before{content:"PO Amount";font-weight:900;color:var(--green)}
  #poTable td:nth-child(8)::before{content:"Invoice";font-weight:900;color:var(--green)}
  #poTable td:nth-child(9)::before{content:"Paid";font-weight:900;color:var(--green)}
  #poTable td:nth-child(10)::before{content:"Pending";font-weight:900;color:var(--green)}
  #poTable td:nth-child(11)::before{content:"Receipt Status";font-weight:900;color:var(--green)}
  #poTable td:nth-child(12)::before{content:"Finance Status";font-weight:900;color:var(--green)}
  #poTable td:nth-child(13)::before{content:"Accountant Action";font-weight:900;color:var(--green)}
#b2bTable td:nth-child(2)::before{content:"Order / Date";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(3)::before{content:"Customer";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(4)::before{content:"Quotation";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(5)::before{content:"Total Qty";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(6)::before{content:"Order Value";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(7)::before{content:"Terms / Due";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(8)::before{content:"Received";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(9)::before{content:"Pending";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(10)::before{content:"Payment Status";font-weight:900;color:var(--green)}
  #b2bTable td:nth-child(11)::before{content:"Finance";font-weight:900;color:var(--green)}
  .modal{padding:8px;align-items:flex-start}
  .modal-box{margin-top:8px;border-radius:18px;max-height:calc(100vh - 16px)}
  .modal-head{padding:14px 15px}
  .modal-body{padding:14px}
  .modal-body .table-wrap{padding:0}
  .modal-body .table-wrap td{grid-template-columns:minmax(90px,36%) 1fr}
  .modal-body > div[style*="grid-template-columns:repeat(3"]{grid-template-columns:1fr!important}
  .btn{white-space:normal;text-align:center;justify-content:center}
}


/* ===== FINAL REFERENCE UI · ACCOUNTANT ROLE ===== */
body{background:#fff}
.app{grid-template-columns:232px minmax(0,1fr);background:#fff}
.sidebar{
  background:#fff;color:#243129;padding:14px 12px;border-right:1px solid #e6ece7;
  box-shadow:none;position:sticky;top:0;height:100vh
}
.brand{padding:2px 4px 15px;border-bottom:1px solid #edf1ee;margin-bottom:12px;gap:9px}
.brand-logo{width:36px;height:36px;border-radius:11px;background:#17643a;color:#fff;font-size:17px}
.brand h2{font-size:13px;color:#17643a;font-weight:900}.brand p{font-size:10px;color:#7d8982;margin-top:2px}
.nav-label{font-size:9px;color:#98a39c;padding:6px 8px;letter-spacing:.09em}
.nav-btn{
  color:#526158;border-radius:10px;padding:8px 10px;margin:2px 0;font-size:10.5px;
  gap:9px;min-height:43px
}
.nav-btn:hover{background:#f4f8f5}.nav-btn.active{background:#eaf6ee;color:#17643a;box-shadow:none}
.nav-icon{width:29px;height:29px;border-radius:9px;background:#f6f8f6;color:#526158;border:1px solid #e7ece8;font-size:13px}
.nav-btn.active .nav-icon{background:#1a7a42;color:#fff;border-color:#1a7a42}
.side-summary{display:none}
.main{padding:0;background:#fff}
.topbar{
  height:62px;position:sticky;top:0;z-index:90;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid #edf1ee;margin:0;padding:0 18px
}
.mobile-menu{width:38px;height:38px;padding:0;border-radius:10px;background:#fff;color:#17643a}
.account-chip{border:none;box-shadow:none;background:transparent;padding:0;gap:8px}
.avatar{width:34px;height:34px;border-radius:999px;background:#eaf6ee;color:#17643a;font-size:10px}
.account-chip strong{font-size:10.5px}.account-chip span{font-size:9px}
#content{padding:22px 18px 46px;max-width:1500px;margin:0 auto}

/* Replace dashboard hero with simple production page heading */
.hero{
  background:transparent;color:inherit;border-radius:0;padding:0;box-shadow:none;overflow:visible;margin:3px 0 17px
}
.hero:after{display:none}.hero-kicker{display:none}
.hero h1{font-size:28px;color:#17212b;margin:0;letter-spacing:-.035em;font-weight:800}
.hero p{font-size:11px;color:#6f7a73;line-height:1.55;max-width:760px;margin-top:6px}

/* Compact metrics like Supervisor final reference */
.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{border-radius:14px;padding:13px 14px;box-shadow:none;border:1px solid #e4eae5}
.metric .label{font-size:9.5px}.metric .value{font-size:20px;margin-top:8px}.metric .sub{font-size:8.5px}
.metric .mi{width:32px;height:32px;border-radius:9px;right:11px;top:11px;font-size:13px}

/* Compact process strip */
.stepper{border-radius:12px;padding:9px 11px;margin-bottom:14px;box-shadow:none}
.step{font-size:9.5px}.step-num{width:23px;height:23px;font-size:9px}.step-line{min-width:18px}

/* Panels / lists */
.panel{border-radius:15px;box-shadow:none;margin-bottom:14px;border-color:#e3e9e4}
.panel-head{padding:12px 13px;align-items:center}
.panel-head h3{font-size:13px;color:#172019}.panel-head p{font-size:9.5px;margin-top:3px}
.toolbar{gap:8px}
.input,.select{min-height:40px;border-radius:10px;padding:0 10px;font-size:10.5px}
.search{min-width:250px}

/* Final reference search/filter row */
.acc-searchbar{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;width:100%
}
.acc-searchbox{
  height:45px;border:1px solid #dce3de;border-radius:11px;background:#fff;
  display:flex;align-items:center;gap:9px;padding:0 12px
}
.acc-searchbox input{border:0;outline:0;width:100%;min-width:0;background:transparent;font-size:11px;color:#27322c}
.acc-filter-btn{
  height:45px;border:1px solid #dce3de;border-radius:11px;background:#fff;color:#25332b;
  padding:0 14px;font-size:10.5px;font-weight:850
}
.acc-filter-panel{
  display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:9px;margin-top:8px;border:1px solid #e3e9e4;border-radius:11px;background:#fff
}
.acc-filter-panel.open{display:flex}
.acc-filter-panel .select{min-width:190px}
.acc-resultbar{
  min-height:44px;border:1px solid #dce3de;border-radius:11px;background:#fff;margin:10px 0 14px;
  padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px
}
.acc-resultbar span{font-size:10px;color:#27322c;font-weight:750}.acc-clear{border:0;background:transparent;color:#177b43;font-size:10px;font-weight:850}
.acc-view-toggle{
  display:none;height:36px;border:1px solid #d7e2da;background:#fff;color:#17643a;border-radius:9px;
  padding:0 10px;font-size:9.5px;font-weight:850;white-space:nowrap
}
.acc-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.acc-list-head strong{font-size:11px;color:#17643a}.acc-list-count{min-width:30px;height:30px;border-radius:9px;background:#eaf7ee;color:#177b43;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:850}
.acc-table-view{display:block}
.acc-card-list{display:none;gap:12px}

/* Compact desktop tables - retain ALL fields */
.acc-table-view .table-wrap{overflow:auto}
.acc-table-view table{width:100%;min-width:0!important;table-layout:fixed}
.acc-table-view thead th{padding:9px 7px;font-size:8px;line-height:1.25;white-space:normal}

/* ===== PROFESSIONAL ACCOUNTANT ANALYTICS ===== */
.analytics-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin:4px 0 18px
}
.analytics-head h1{font-size:29px;letter-spacing:-.035em;color:#17212b;font-weight:850;margin:0}

.analytics-live{
  display:inline-flex;align-items:center;gap:7px;border:1px solid #dce7de;background:#f7fbf8;
  color:#17643a;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:900;white-space:nowrap
}

.analytics-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.analytics-kpi{
  background:#fff;border:1px solid #e2e9e3;border-radius:15px;padding:15px;min-width:0
}
.analytics-kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}

.analytics-kpi-sub{font-size:8.7px;color:#7a867e;margin-top:4px;line-height:1.45}
.analytics-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:14px}
.analytics-card{
  grid-column:span 6;background:#fff;border:1px solid #e2e9e3;border-radius:16px;padding:15px;
  min-width:0;overflow:hidden
}
.analytics-card.wide{grid-column:span 8}.analytics-card.narrow{grid-column:span 4}
.analytics-card.full{grid-column:1/-1}

.analytics-chart.short{height:245px;min-height:245px}
.analytics-chart.tall{height:320px;min-height:320px}
.analytics-alerts{display:grid;gap:8px}
.analytics-alert{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  border:1px solid #e5ebe6;border-radius:12px;padding:11px 12px
}
.analytics-alert strong{font-size:10.5px;color:#223128}.analytics-alert p{font-size:8.7px;color:#78847c;margin-top:3px}
.analytics-alert-amount{font-size:11px;font-weight:950;color:#153d25;white-space:nowrap}
.analytics-table{width:100%;border-collapse:collapse;min-width:0!important}

.analytics-table td{font-size:9px;padding:10px 9px;border-bottom:1px solid #edf1ee}
.analytics-table tr:last-child td{border-bottom:0}
.analytics-note{
  border:1px dashed #d7e3da;background:#fbfdfb;border-radius:12px;padding:10px 12px;
  font-size:8.7px;color:#708078;line-height:1.55;margin-top:12px
}

/* ===== ACCOUNTANT TABLE DETAIL ACTIONS · VISIBILITY REFINEMENT =====
   Used consistently for Customer Detail, Product Details, View Quotation,
   Vendor Details, PO Details, View Requirements and Receipt Details.
   No workflow or action has been changed. */
.b2c-inline-btn{
  appearance:none!important;
  -webkit-appearance:none!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  gap:5px!important;
  width:auto!important;
  max-width:100%!important;
  min-height:26px!important;
  margin-top:5px!important;
  padding:4px 8px!important;
  border:1px solid #cfe1d3!important;
  border-radius:7px!important;
  background:#f4faf6!important;
  color:#17643a!important;
  font-size:8.2px!important;
  line-height:1.2!important;
  font-weight:850!important;
  text-decoration:none!important;
  text-underline-offset:0!important;
  white-space:normal!important;
  text-align:center!important;
  cursor:pointer!important;
  transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease!important;
}
.b2c-inline-btn::after{
  content:"›";
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  font-size:12px;
  line-height:1;
  font-weight:900;
  color:#2d7650;
}
.b2c-inline-btn:hover{
  background:#eaf6ee!important;
  border-color:#a9cdb2!important;
  box-shadow:0 2px 7px rgba(23,100,58,.08)!important;
}
.b2c-inline-btn:active{
  transform:translateY(1px)!important;
  box-shadow:none!important;
}
.b2c-inline-btn:focus-visible{
  outline:2px solid rgba(23,100,58,.22)!important;
  outline-offset:2px!important;
}

/* Keep primary cell value visually separate from its secondary detail action. */
.b2c-person,
.b2c-total{
  gap:3px!important;
}
.acc-table-view td .b2c-inline-btn{
  margin-top:5px!important;
  min-height:25px!important;
  padding:4px 7px!important;
  font-size:8px!important;
}

/* Real-device mobile table mode: slightly larger touch target without
   changing table structure or fields. */
@media(max-width:899px){
  .acc-list[data-view="table"] .b2c-inline-btn{
    min-height:30px!important;
    padding:5px 9px!important;
    font-size:9px!important;
    border-radius:8px!important;
    white-space:nowrap!important;
  }
}

/* In very narrow table cells, allow the label to wrap cleanly rather than
   clipping or becoming unreadable. */
@media(min-width:900px) and (max-width:1180px){
  .acc-table-view .b2c-inline-btn{
    width:100%!important;
    padding:4px 5px!important;
    font-size:7.6px!important;
  }
}



/* ===== ACCOUNTANT TABLE BORDER CLEANUP =====
   Visual-only refinement. No fields, actions, data, flow or functionality changed. */

/* One clean outer table container instead of many competing borders. */
.acc-table-view .table-wrap{
  border:1px solid #e3e9e4!important;
  border-radius:11px!important;
  background:#fff!important;
  overflow:auto!important;
  box-shadow:none!important;
}

/* Remove boxy cell borders. Keep only a very light row separator. */
.acc-table-view table{
  border-collapse:collapse!important;
  border-spacing:0!important;
}
.acc-table-view thead th{
  border:0!important;
  border-bottom:1px solid #dfe7e1!important;
  box-shadow:none!important;
}
.acc-table-view tbody td{
  border:0!important;
  border-bottom:1px solid #edf1ee!important;
  box-shadow:none!important;
}
.acc-table-view tbody tr:last-child td{
  border-bottom:0!important;
}
.acc-table-view tbody tr{
  border:0!important;
  box-shadow:none!important;
}

/* Softer detail action chips: visible without adding another hard border. */
.b2c-inline-btn{
  border:0!important;
  background:#edf7f0!important;
  color:#17643a!important;
  box-shadow:inset 0 0 0 1px rgba(23,100,58,.06)!important;
}
.b2c-inline-btn:hover{
  border:0!important;
  background:#e2f2e7!important;
  box-shadow:inset 0 0 0 1px rgba(23,100,58,.11)!important;
}

/* Keep badges visually clean and avoid doubled borders inside cells. */
.acc-table-view .badge{
  border:0!important;
  box-shadow:none!important;
}

/* Mobile table view uses the same clean separator treatment. */
@media(max-width:899px){
  .acc-list[data-view="table"] .acc-table-view{
    border:1px solid #e3e9e4!important;
    border-radius:10px!important;
    box-shadow:none!important;
  }
  .acc-list[data-view="table"] .table-wrap{
    border:0!important;
    border-radius:0!important;
  }
  .acc-list[data-view="table"] .table-wrap th{
    border:0!important;
    border-bottom:1px solid #dfe7e1!important;
  }
  .acc-list[data-view="table"] .table-wrap td{
    border:0!important;
    border-bottom:1px solid #edf1ee!important;
  }
  .acc-list[data-view="table"] .table-wrap tr:last-child td{
    border-bottom:0!important;
  }
}



/* ===== ACCOUNTANT FULL DETAIL SCREENS · BREADCRUMB UX =====
   Detail-heavy read views move out of modals. Forms / quick actions remain modals. */
.acc-detail-page{min-width:0;padding-bottom:18px}
.acc-breadcrumb{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  margin:1px 0 13px;font-size:9.5px;color:#7b877f;font-weight:750
}
.acc-breadcrumb button{
  border:0;background:transparent;padding:0;color:#17643a;
  font-size:9.5px;font-weight:900;cursor:pointer
}
.acc-breadcrumb .sep{color:#a5aea8}
.acc-detail-hero{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  border:1px solid #dce6de;background:linear-gradient(145deg,#154f2f,#237643);
  color:#fff;border-radius:15px;padding:16px 18px;margin-bottom:11px
}
.acc-detail-hero .eyebrow{
  font-size:8px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#f6d66d
}
.acc-detail-hero h1{
  margin:5px 0 4px;font-size:22px;line-height:1.12;letter-spacing:-.025em
}
.acc-detail-hero p{font-size:9.5px;line-height:1.45;color:rgba(255,255,255,.82)}
.acc-detail-hero-status{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.acc-detail-hero .badge{background:#fff!important;color:#17643a!important;border:0!important}

.acc-detail-summary{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px
}
.acc-detail-summary-card{
  background:#fff;border:1px solid #e2e9e3;border-radius:11px;padding:10px;min-width:0
}
.acc-detail-summary-card label{
  display:block;font-size:8px;text-transform:uppercase;letter-spacing:.035em;
  color:#7b877f;font-weight:850;margin-bottom:4px
}
.acc-detail-summary-card strong{
  display:block;font-size:11px;line-height:1.35;color:#172019;overflow-wrap:anywhere
}

.acc-detail-section{
  background:#fff;border:1px solid #e1e8e2;border-radius:13px;
  margin-bottom:10px;overflow:hidden
}
.acc-detail-section-head{
  min-height:42px;padding:10px 12px;border-bottom:1px solid #e9eeea;
  background:#f8faf8;display:flex;align-items:center;justify-content:space-between;gap:10px
}
.acc-detail-section-head strong{font-size:11px;color:#174f30;font-weight:900}
.acc-detail-section-head span{font-size:8.5px;color:#7d8981}
.acc-detail-section-body{padding:11px}
.acc-detail-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px
}
.acc-detail-field{
  border:1px solid #e5ebe6;border-radius:10px;padding:9px;background:#fff;min-width:0
}
.acc-detail-field label{
  display:block;font-size:7.8px;color:#7a877e;font-weight:850;
  text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px
}
.acc-detail-field strong{
  display:block;font-size:10.3px;color:#243229;line-height:1.4;overflow-wrap:anywhere
}
.acc-detail-note{
  border:1px solid #e1e9e3;background:#f8fbf9;border-radius:10px;
  padding:10px;font-size:9.5px;color:#536259;line-height:1.55
}
.acc-detail-actions{
  position:sticky;bottom:0;z-index:8;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
  margin-top:10px;padding:10px 0;background:linear-gradient(180deg,rgba(247,249,247,0),#f7f9f7 28%)
}
.acc-detail-actions .btn{min-height:38px}

/* desktop detail tables */
.acc-detail-table-wrap{
  width:100%;overflow:auto;border:1px solid #e7ece8;border-radius:10px;background:#fff
}
.acc-detail-table{
  width:100%;min-width:650px;border-collapse:collapse;table-layout:auto
}
.acc-detail-table th{
  padding:8px 9px;background:#edf5ef;color:#2b5c3e;font-size:8px;
  text-align:left;border-bottom:1px solid #dde7df;white-space:nowrap
}
.acc-detail-table td{
  padding:9px;font-size:9px;color:#344239;border-bottom:1px solid #edf1ee;vertical-align:middle
}
.acc-detail-table tr:last-child td{border-bottom:0}
.acc-detail-mobile-cards{display:none}
.acc-detail-line-card{
  border:1px solid #e1e8e2;border-radius:12px;background:#fff;padding:11px
}
.acc-detail-line-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:9px;margin-bottom:9px
}
.acc-detail-line-top strong{font-size:12px;color:#172019;line-height:1.3}
.acc-detail-line-top span{font-size:8.5px;color:#758178;font-weight:750}
.acc-detail-line-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;
  border-top:1px solid #edf1ee;padding-top:9px
}
.acc-detail-line-grid div{min-width:0}
.acc-detail-line-grid label{
  display:block;font-size:8px;color:#7c877f;font-weight:800;margin-bottom:3px

.acc-detail-line-grid b{
  display:block;font-size:10px;line-height:1.3;color:#25332a;overflow-wrap:anywhere
}
.acc-detail-line-note{
  margin-top:9px;padding-top:9px;border-top:1px solid #edf1ee;
  font-size:9px;line-height:1.45;color:#607067
}

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const badge=(text)=> {
 const t=String(text).toLowerCase();
 let c='gray';
 if(t==='paid'||t.includes('fully paid')||t.includes('completed')||t==='received'||t==='accepted'||t==='active'||t==='verified'||t==='approved') c='green';
 if(t.includes('partial')||t.includes('pending')||t.includes('due')||t.includes('quote')||t.includes('under review')||t.includes('submitted')) c='yellow';
 if(t.includes('progress')||t.includes('not due')) c='blue';
 if(t.includes('cancel')||t.includes('failed')||t.includes('rejected')||t.includes('disputed')) c='red';
 if(t.includes('variance')||t.includes('hold')) c='purple';
 return `<span class="badge ${c}">${text}</span>`;
};

function renderAccountDetailScreen(){

}

function saveB2BPayment(orderNo){
 const x=state.b2b.find(o=>o.order===orderNo); if(!x)return;
 const amount=Number(document.getElementById('b2bPayAmount')?.value||0);
 const pending=Math.max(0,x.value-x.received);
 if(amount<=0){toast('Enter payment amount');return}
 if(amount>pending){toast('Amount cannot exceed pending balance');return}
 const dateRaw=document.getElementById('b2bPayDate')?.value||'';
 const formatted=dateRaw?new Date(dateRaw+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'22 Aug 2026';
 x.paymentHistory=x.paymentHistory||[];
 x.paymentHistory.push({
   id:'PAY-'+String(Date.now()).slice(-8),
   type:document.getElementById('b2bPayType').value,
   date:formatted,
   amount,
   mode:document.getElementById('b2bPayMode').value,
   reference:document.getElementById('b2bPayRef').value.trim()||'—',
   note:document.getElementById('b2bPayNote').value.trim()||'Payment recorded',
   recordedAt:'22 Aug 2026'
 });
 x.received+=amount;
 const balance=Math.max(0,x.value-x.received);
 x.payment=balance===0?'Fully Paid':'Partially Paid';
 closeModal();render();toast('Payment recorded for '+orderNo);
}

function systemTodos(module){
 const list=[];
 if(module==='master'){
   const pendingB2C=state.b2cBills.filter(x=>x.payment==='Pending');
   const pendingB2B=state.b2b.filter(x=>x.received<x.value);
   const vendorDue=state.purchases.filter(x=>x.payment!=='Paid');
   if(pendingB2C.length) list.push({id:'SYS-B2C',title:`${pendingB2C.length} B2C payment(s) pending`,note:'Review pending counter bills and record collection once received.',priority:'High',source:'Automatic'});
   if(pendingB2B.length) list.push({id:'SYS-B2B',title:`${pendingB2B.length} B2B order balance(s) open`,note:'Follow up outstanding customer receivables and payment references.',priority:'High',source:'Automatic'});
   if(vendorDue.length) list.push({id:'SYS-VEN',title:`${vendorDue.length} vendor PO payment(s) open`,note:'Review due or partially paid purchase orders before settlement.',priority:'Medium',source:'Automatic'});
 }
 if(module==='b2b'){
   state.b2b.filter(x=>x.received<x.value).forEach(x=>list.push({id:'SYS-'+x.order,title:`Follow up ${x.order}`,note:`${money(x.value-x.received)} remains outstanding from ${x.customer}.`,priority:'High',source:'Automatic'}));
 }
 if(module==='purchaseOrders'){
   state.purchases.filter(x=>x.payment!=='Paid').forEach(x=>list.push({id:'SYS-'+x.po,title:`Process ${x.po}`,note:`${x.vendor} · ${x.payment} · ${money(x.total)} purchase value.`,priority:x.payment==='Due'?'High':'Medium',source:'Automatic'}));
 }
 return list;
}

 p.paymentHistory=p.paymentHistory||[];
 p.paymentHistory.push({
   id:'VPAY-'+p.po.replace(/\D/g,'')+'-'+String(p.paymentHistory.length+1).padStart(2,'0'),
   date:document.getElementById('vpDate').value.trim()||'22 Aug 2026',
   amount,
   mode:document.getElementById('vpMode').value,
   reference:document.getElementById('vpRef').value.trim()||'—',
   type:document.getElementById('vpType').value,
   note:document.getElementById('vpNote').value.trim()||'Vendor payment recorded'
 });
 p.amountPaid=Number(p.amountPaid||0)+amount;
 const balance=poPendingAmount(p);
 p.financeStatus=balance===0?'Paid':'Partially Paid';
 closeModal();render();toast('Vendor payment recorded');
}

function renderMaster(){
 const b2cSales=state.b2cBills.reduce((s,x)=>s+Number(x.total||0),0);
 const b2cCollected=state.b2cBills
   .filter(x=>['paid','completed'].includes(String(x.payment||'').toLowerCase()))
   .reduce((s,x)=>s+Number(x.total||0),0);
 const b2cOutstanding=Math.max(0,b2cSales-b2cCollected);

 const b2bSales=state.b2b.reduce((s,x)=>s+Number(x.value||0),0);
 const b2bCollected=state.b2b.reduce((s,x)=>s+Number(x.received||0),0);
 const b2bOutstanding=Math.max(0,b2bSales-b2bCollected);

 const poValue=state.purchases.reduce((s,x)=>s+Number(x.poAmount||0),0);
 const invoiceValue=state.purchases.reduce((s,x)=>s+Number(x.invoiceAmount||0),0);
 const vendorPaid=state.purchases.reduce((s,x)=>s+Number(x.amountPaid||0),0);
 const vendorPayable=state.purchases.reduce((s,x)=>s+poPendingAmount(x),0);

 const totalSales=b2cSales+b2bSales;
 const totalCollected=b2cCollected+b2bCollected;
 const totalReceivable=b2cOutstanding+b2bOutstanding;
 const netRecordedCash=totalCollected-vendorPaid;

 const b2bCollectionRate=b2bSales?Math.round((b2bCollected/b2bSales)*100):0;
 const payableCoverage=invoiceValue?Math.round((vendorPaid/invoiceValue)*100):0;

 const exposures=[
   ...state.b2b.map(x=>({type:'Customer Receivable',ref:x.order,party:x.customer,amount:Math.max(0,Number(x.value||0)-Number(x.received||0)),status:x.payment})),
   ...state.b2cBills.map(x=>({type:'B2C Receivable',ref:x.bill,party:x.customer,amount:['paid','completed'].includes(String(x.payment||'').toLowerCase())?0:Number(x.total||0),status:x.payment})),
   ...state.purchases.map(x=>({type:'Vendor Payable',ref:x.po,party:x.vendor,amount:poPendingAmount(x),status:x.financeStatus}))
 ].filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);

 return `
   <div class="analytics-head">
     <div>
       <h1>Accounts Analytics</h1>

function initAnalyticsCharts(){
 destroyAnalyticsCharts();
 if(typeof Chart==='undefined'){
   document.querySelectorAll('.analytics-chart').forEach(x=>x.innerHTML='<div class="empty">Chart library could not load. ERP totals above are still calculated normally.</div>');
   return;
 }

 const moneyTick=v=>'₹'+Number(v||0).toLocaleString('en-IN',{notation:'compact',maximumFractionDigits:1});
 const common={
   responsive:true,
   maintainAspectRatio:false,
   interaction:{mode:'index',intersect:false},
   plugins:{
     legend:{labels:{boxWidth:10,boxHeight:10,usePointStyle:true,font:{size:10},color:'#5d6a62'}},
     tooltip:{callbacks:{label:(ctx)=>{
       const val=ctx.parsed?.y ?? ctx.parsed?.x ?? ctx.parsed ?? 0;
       return `${ctx.dataset.label||ctx.label||''}: ${money(Number(val)||0)}`;
     }}}
   },
   scales:{
     x:{grid:{display:false},ticks:{font:{size:9},color:'#728078'}},
     y:{beginAtZero:true,grid:{color:'#eef2ef'},ticks:{font:{size:9},color:'#728078',callback:moneyTick}}
   }
 };

 const add=(id,config)=>{
   const el=document.getElementById(id); if(!el)return;
   analyticsChartInstances.push(new Chart(el,config));
 };

 add('chartB2BReceivables',{
   type:'bar',
   data:{
     labels:state.b2b.map(x=>x.order),
     datasets:[
       {label:'Order Value',data:state.b2b.map(x=>Number(x.value||0)),backgroundColor:'rgba(23,100,58,.20)',borderColor:'#17643a',borderWidth:1,borderRadius:6},
       {label:'Received',data:state.b2b.map(x=>Number(x.received||0)),backgroundColor:'rgba(44,139,83,.70)',borderRadius:6},
       {label:'Outstanding',data:state.b2b.map(x=>Math.max(0,Number(x.value||0)-Number(x.received||0))),backgroundColor:'rgba(213,153,31,.72)',borderRadius:6}
     ]
   },
   options:{...common,plugins:{...common.plugins,tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${money(ctx.parsed.y)}`}}}}
 });

 const b2cSales=state.b2cBills.reduce((s,x)=>s+Number(x.total||0),0);
 const b2cCollected=state.b2cBills.filter(x=>['paid','completed'].includes(String(x.payment||'').toLowerCase())).reduce((s,x)=>s+Number(x.total||0),0);
 const b2cOutstanding=Math.max(0,b2cSales-b2cCollected);
 const b2bSales=state.b2b.reduce((s,x)=>s+Number(x.value||0),0);
 const b2bCollected=state.b2b.reduce((s,x)=>s+Number(x.received||0),0);
 const b2bOutstanding=Math.max(0,b2bSales-b2bCollected);

 add('chartReceivableMix',{
   type:'doughnut',
   data:{labels:['B2C Outstanding','B2B Outstanding'],datasets:[{data:[b2cOutstanding,b2bOutstanding],backgroundColor:['#74b789','#d6a33a'],borderWidth:0,hoverOffset:5}]},
   options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,font:{size:9}}},tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${money(ctx.raw)}`}}}}
 });

 add('chartVendorPayables',{
   type:'bar',
   data:{
     labels:state.purchases.map(x=>x.po),
     datasets:[
       {label:'Invoice / Payable',data:state.purchases.map(x=>Number(x.invoiceAmount||0)),backgroundColor:'rgba(32,103,151,.25)',borderColor:'#206797',borderWidth:1,borderRadius:6},
       {label:'Paid',data:state.purchases.map(x=>Number(x.amountPaid||0)),backgroundColor:'rgba(37,135,73,.72)',borderRadius:6},
       {label:'Pending',data:state.purchases.map(x=>poPendingAmount(x)),backgroundColor:'rgba(188,117,28,.72)',borderRadius:6}
     ]
   },
   options:{...common,plugins:{...common.plugins,tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${money(ctx.parsed.y)}`}}}}
 });

 add('chartSalesMix',{
   type:'doughnut',
   data:{labels:['B2C Sales','B2B Orders'],datasets:[{data:[b2cSales,b2bSales],backgroundColor:['#63a977','#245f86'],borderWidth:0,hoverOffset:5}]},
   options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,font:{size:9}}},tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${money(ctx.raw)}`}}}}
 });

 const vendorSpend={};
 state.purchases.forEach(p=>vendorSpend[p.vendor]=(vendorSpend[p.vendor]||0)+Number(p.poAmount||0));
 add('chartVendorSpend',{
   type:'bar',
   data:{
     labels:Object.keys(vendorSpend),
     datasets:[{label:'PO Value',data:Object.values(vendorSpend),backgroundColor:'rgba(23,100,58,.72)',borderRadius:6}]
   },
   options:{...common,indexAxis:'y',plugins:{...common.plugins,legend:{display:false},tooltip:{callbacks:{label:(ctx)=>`PO Value: ${money(ctx.parsed.x)}`}}},scales:{
     x:{beginAtZero:true,grid:{color:'#eef2ef'},ticks:{font:{size:9},color:'#728078',callback:moneyTick}},
     y:{grid:{display:false},ticks:{font:{size:9},color:'#56645b'}}
   }}
 });

 const customerCollected=b2cCollected+b2bCollected;
 const vendorPaid=state.purchases.reduce((s,x)=>s+Number(x.amountPaid||0),0);
 add('chartCashMovement',{
   type:'bar',
   data:{labels:['Customer Collections','Vendor Payments','Net Recorded Cash'],datasets:[{label:'Amount',data:[customerCollected,vendorPaid,customerCollected-vendorPaid],backgroundColor:['#2e8550','#c78228','#315f78'],borderRadius:8}]},
   options:{...common,plugins:{...common.plugins,legend:{display:false},tooltip:{callbacks:{label:(ctx)=>money(ctx.parsed.y)}}}}
 });

 const b2cStatus={};
 state.b2cBills.forEach(x=>{const k=x.payment||'Unknown';b2cStatus[k]=(b2cStatus[k]||0)+1});
 add('chartB2CStatus',{
   type:'doughnut',
   data:{labels:Object.keys(b2cStatus),datasets:[{data:Object.values(b2cStatus),backgroundColor:['#4f9b68','#d6a33a','#b84a52','#527da0','#8a72b5'],borderWidth:0}]},
   options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,font:{size:9}}},tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${ctx.raw} bill${ctx.raw===1?'':'s'}`}}}}
 });

 const poStatus={};
 state.purchases.forEach(x=>{const k=x.financeStatus||'Unknown';poStatus[k]=(poStatus[k]||0)+1});
 add('chartPOStatus',{
   type:'doughnut',
   data:{labels:Object.keys(poStatus),datasets:[{data:Object.values(poStatus),backgroundColor:['#4f9b68','#d6a33a','#527da0','#8a72b5','#b84a52'],borderWidth:0}]},
   options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,font:{size:9}}},tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${ctx.raw} PO${ctx.raw===1?'':'s'}`}}}}
 });
}

      <button class="btn btn-green" onclick="openVendorRegistration()">＋ Register Vendor</button>
    </div>`+
   accSearchFilter(
     'vendorMaster',
     'vendorSearch',
     'Search vendor / GSTIN / contact...',
     `filterRows('vendorMasterTable',this.value)`,
     `<select class="select"><option>All Status</option><option>Active</option></select>
      <select class="select"><option>All Categories</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select>`
   )+
   accResultBar(
     state.vendors.length,
     'registered vendors',
     `document.getElementById('vendorSearch').value='';filterRows('vendorMasterTable','')`
   )+
   accListWrap(
     'vendorMaster',
     state.vendors.length,
     'Vendor List',
     vendorTable,
     state.vendors.map(vendorMasterCard).join('')
   )
 );
}

function renderPurchaseOrders(){
 const total=state.purchases.reduce((s,x)=>s+Number(x.poAmount||0),0);
 const invoiceTotal=state.purchases.reduce((s,x)=>s+Number(x.invoiceAmount||0),0);
 const paidTotal=state.purchases.reduce((s,x)=>s+Number(x.amountPaid||0),0);
 const payable=state.purchases.reduce((s,x)=>s+poPendingAmount(x),0);

 const poTable=`<div class="table-wrap"><table id="poTable" style="min-width:1420px"><thead><tr>
   <th>Sr.</th>
   <th>PO No. / Requisition</th>
   <th>Order / Delivery</th>
   <th>Vendor</th>
   <th>Farm</th>
   <th>Products / Receipt</th>
   <th>PO Amount</th>
   <th>Invoice</th>
   <th>Paid</th>
   <th>Pending</th>
   <th>Receipt Status</th>
   <th>Finance Status</th>
   <th>Accountant Action</th>
 </tr></thead><tbody>
 ${state.purchases.map((p,i)=>{
   const pending=poPendingAmount(p);
   return `<tr>
     <td>${i+1}</td>
     <td>
       <strong>${p.po}</strong><br>
       <span style="font-size:9px;color:var(--muted)">${p.requisition||'—'}</span><br>
       <button class="b2c-inline-btn" onclick="viewPODetails('${p.po}')">PO Details</button>
     </td>
     <td>
       <strong>${p.orderDate}</strong><br>
       <span style="font-size:9px;color:var(--muted)">Expected: ${p.expectedDelivery||'—'}</span>
     </td>
     <td>
       <strong>${p.vendor}</strong><br>
       <button class="b2c-inline-btn" onclick="viewPOVendor('${p.po}')">Vendor Details</button>
     </td>
     <td>${p.farm}</td>
     <td>
       <strong>${(p.items||[]).length} products</strong><br>
       <span style="font-size:9px;color:var(--muted)">Req ${poRequestedQty(p).toLocaleString('en-IN')} · Rec ${poReceivedQty(p).toLocaleString('en-IN')} · Dmg ${poDamagedQty(p).toLocaleString('en-IN')}</span><br>
       <button class="b2c-inline-btn" onclick="viewPOProducts('${p.po}')">Product / Receipt Details</button>
     </td>
     <td><strong>${money(p.poAmount)}</strong></td>
     <td>
       <strong>${p.invoiceNo||'Not recorded'}</strong><br>
       <span style="font-size:9px;color:var(--muted)">${p.invoiceStatus||'—'} · ${money(p.invoiceAmount||0)}</span>
     </td>
     <td><strong>${money(p.amountPaid||0)}</strong></td>
     <td><strong style="color:${pending>0?'var(--orange)':'var(--green)'}">${money(pending)}</strong></td>
     <td>${badge(p.receiptStatus)}</td>
     <td>${badge(p.financeStatus)}</td>
     <td>
       <div style="display:flex;gap:6px;flex-wrap:wrap">
         <button class="btn btn-light" onclick="viewPOFinance('${p.po}')">Finance Details</button>
         <button class="btn btn-blue" onclick="editPOFinance('${p.po}')">Update</button>
         ${pending>0?`<button class="btn btn-green" onclick="recordPOPayment('${p.po}')">Record Payment</button>`:''}
       </div>
     </td>
   </tr>`
 }).join('')}
 </tbody></table></div>`;

 return hero(
   'Purchase Accounting',
   'Purchase Orders',
   'Accountant control for supplier purchase orders, vendor invoices, payable amounts, receipt references, payment entries and financial closure.'
 )+
 `<div class="metric-grid">
   ${metric('PO Value',money(total),'Total value of purchase orders','₹')}
   ${metric('Vendor Invoices',money(invoiceTotal),'Recorded invoice / payable value','🧾')}
   ${metric('Vendor Payments',money(paidTotal),'Payments already recorded','✓')}
   ${metric('Outstanding Payables',money(payable),'Pending vendor settlement','⏳')}
 </div>`+
 panel(
   'Purchase Order & Payables Register',
   'The table keeps high-frequency accounting fields visible. Full PO, vendor, product/receipt, packing-slip and payment history are separated into focused modals.',
   '',
   accSearchFilter(
     'poHistory',
     'poSearch',
     'Search PO / requisition / vendor / invoice...',
     `filterRows('poTable',this.value)`,
     `<select class="select"><option>All Finance Status</option><option>Paid</option><option>Partially Paid</option><option>Payment Pending</option><option>Not Due</option><option>On Hold</option></select>
      <select class="select"><option>All Receipt Status</option><option>Pending Slip</option><option>Partially Received</option><option>Received</option><option>Rejected</option></select>
      <select class="select"><option>All Invoice Status</option><option>Invoice Pending</option><option>Under Review</option><option>Verified</option><option>Disputed</option></select>`
   )+
   accResultBar(
     state.purchases.length,
     'purchase orders',
     `document.getElementById('poSearch').value='';filterRows('poTable','')`
   )+
   accListWrap(
     'poHistory',
     state.purchases.length,
     'Purchase Orders',
     poTable,
     state.purchases.map(purchaseCard).join('')
   )
 );
}

function render(){
 const c=document.getElementById('content');
 if(state.detailScreen){
   destroyAnalyticsCharts();
   c.innerHTML=renderAccountDetailScreen();
   return;
 }
 if(state.current!=='master')destroyAnalyticsCharts();
 c.innerHTML=
   state.current==='b2c'?renderB2C():
   state.current==='b2b'?renderB2B():
   state.current==='vendorPortal'?renderVendorPortal():
   state.current==='vendorManagement'?renderVendorManagement():
   state.current==='purchaseOrders'?renderPurchaseOrders():
   renderMaster();
 if(state.current==='master')requestAnimationFrame(initAnalyticsCharts);
}
function filterRows(tableId,q){
 q=String(q||'').toLowerCase();
 document.querySelectorAll('#'+tableId+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none');
 const list=document.getElementById(tableId)?.closest('.acc-list');
 if(list)list.querySelectorAll('.acc-card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'':'none');
}
function paymentModal(ref,amount,module){
 openModal('Record Payment · '+ref,`<div class="form-grid">
  <label>Module<input class="input" value="${module}" disabled></label>
  <label>Reference<input class="input" value="${ref}" disabled></label>
  <label>Amount<input id="payAmount" class="input" type="number" value="${amount}"></label>
  <label>Payment Date<input class="input" type="date" value="2026-08-19"></label>
  <label>Payment Mode<select class="select"><option>Bank Transfer</option><option>UPI</option><option>Cash</option><option>Cheque</option><option>Card</option></select></label>
  <label>Reference / UTR<input class="input" placeholder="Enter transaction reference"></label>
  <label class="full">Payment Note<input class="input" placeholder="Advance / part / final payment"></label>
 </div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="closeModal();toast('Payment recorded for ${ref}')">Save Payment</button></div>`)
}
function viewRecord(type,ref){openModal(type+' Details',`<div class="detail-grid"><div class="detail"><label>Reference</label><strong>${ref}</strong></div><div class="detail"><label>Module</label><strong>${type}</strong></div><div class="detail full"><label>ERP Note</label><strong>This modal represents the detailed source transaction, payment history, linked documents and audit references.</strong></div></div>`)}
function openVendorRegistration(){openModal('Register Vendor',`<div class="form-grid">
<label>Legal Business Name<input id="rvName" class="input" placeholder="Vendor legal name"></label>
<label>Trade Name<input id="rvTrade" class="input" placeholder="Trade name"></label>
<label>Vendor Category<select id="rvCat" class="select"><option>Plant Grower / Wholesale Nursery</option><option>Packaging & Pots</option><option>Soil, Fertilizer & Growing Media</option><option>Logistics & Freight</option></select></label>
<label>Location<input id="rvLoc" class="input" placeholder="City, State"></label>
<label>Contact Person<input id="rvContact" class="input" placeholder="Primary contact"></label>
<label>Phone<input id="rvPhone" class="input" placeholder="+91 ..."></label>
<label>GST / Tax ID<input id="rvGst" class="input" placeholder="GSTIN"></label>
<label>Payment Terms<select id="rvTerms" class="select"><option>15 Days</option><option>30 Days</option><option>Advance / 7 Days</option><option>45 Days</option></select></label>
</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="saveVendor()">Register Vendor</button></div>`)}
function saveVendor(){
 const name=document.getElementById('rvName').value.trim(); if(!name){toast('Enter vendor legal name');return}
 state.vendors.push({id:'VEN-'+String(state.vendors.length+1).padStart(3,'0'),name,trade:document.getElementById('rvTrade').value||name,category:document.getElementById('rvCat').value,location:document.getElementById('rvLoc').value||'Not provided',contact:document.getElementById('rvContact').value||'Not provided',phone:document.getElementById('rvPhone').value||'Not provided',gst:document.getElementById('rvGst').value||'Not provided',terms:document.getElementById('rvTerms').value,status:'Active'});closeModal();render();toast('Vendor registered successfully')
}
function viewVendor(id){const v=state.vendors.find(x=>x.id===id);openModal('Vendor Details · '+id,`<div class="detail-grid">${[['Vendor ID',v.id],['Legal Name',v.name],['Trade Name',v.trade],['Category',v.category],['Location',v.location],['Contact',v.contact],['Phone',v.phone],['GSTIN',v.gst],['Payment Terms',v.terms],['Status',v.status]].map(a=>`<div class="detail"><label>${a[0]}</label><strong>${a[1]}</strong></div>`).join('')}</div>`)}
render();
</script>
</body>
</html>
